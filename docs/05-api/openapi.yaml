    get:
      operationId: refundList
      tags: [Sales]
      summary: 'List Refunds (added remediation pass 3 — backs the Stage 1 sitemap''s /back-office/void-refund/approvals screen)'
      description: 'The only way to discover a REQUESTED refund pending approval, symmetric to GET /voids. Visibility mirrors GET /sales/{saleId} (any authenticated session, no dedicated capability).'
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
