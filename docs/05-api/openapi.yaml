            - {type: string, format: date-time}
            - {type: 'null'}
          terminals:
            type: array
            items: {type: string, format: uuid}
            description: Terminals currently associated via terminal_fiscal_installation (supports both STANDALONE and SERVER_CONNECTED deployment models, ADR-009/BIR-013).
    TerminalFiscalInstallation:
      description: 'A terminal''s fiscal installation mapping over time (store-setup pass, 2026-09-18) -- at most one row per terminal has effective_to = null (the current mapping).'
      type: object
      properties:
        id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        fiscal_installation_id: {type: string, format: uuid}
        effective_from: {type: string, format: date-time}
        effective_to:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
    InvoiceSeriesInput:
      type: object
      required: [fiscal_installation_id, series_code, starting_number]
      properties:
        fiscal_installation_id: {type: string, format: uuid}
        series_code: {type: string, maxLength: 64}
        prefix:
          anyOf:
          - {type: string, maxLength: 8}
          - {type: 'null'}
        starting_number: {type: integer, minimum: 1}
        ending_number:
          anyOf:
          - {type: integer}
          - {type: 'null'}
    InvoiceSeries:
      description: current_number/starting_number/ending_number/status mirror invoice_series exactly (Stage 6B). Bootstraps at current_number = starting_number - 1 (invariants.md INVSERIES-001).
      type: object
      properties:
        id: {type: string, format: uuid}
        fiscal_installation_id: {type: string, format: uuid}
        series_code: {type: string}
        prefix:
          anyOf:
          - {type: string}
          - {type: 'null'}
        current_number: {type: integer}
        starting_number: {type: integer}
        ending_number:
          anyOf:
          - {type: integer}
          - {type: 'null'}
        status: {type: string, enum: [ACTIVE, CLOSED]}
    InventoryLocationInput:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 255}
        is_default: {type: boolean, description: 'A store''s first location is made the default regardless of this value.'}
    InventoryLocation:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_default: {type: boolean}
    StoreSetupReadiness:
      description: Non-authoritative aggregate check across the four checkout-time resolver prerequisites -- CheckoutService always re-derives its own resolution independently; this never gates or substitutes for that.
      type: object
      properties:
        ready: {type: boolean}
        checks:
          type: object
          properties:
            fiscal_installation: {type: boolean}
            invoice_series: {type: boolean}
            inventory_location: {type: boolean}
            tax_registration: {type: boolean}
    AuditEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        event_type: {type: string}
        actor_user_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        terminal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        entity_type:
          anyOf:
          - {type: string}
          - {type: 'null'}
        entity_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        before_metadata:
          anyOf:
          - {type: object, additionalProperties: true}
          - {type: 'null'}
        after_metadata:
          anyOf:
          - {type: object, additionalProperties: true}
          - {type: 'null'}
        reason:
          anyOf:
          - {type: string}
          - {type: 'null'}
        request_id:
          anyOf:
          - {type: string}
          - {type: 'null'}
        occurred_at: {type: string, format: date-time}
    ElectronicJournalEntry:
      type: object
      description: 'A projection of an authoritative domain event (ADR-005) — never an independently-editable second ledger. RMO 24-2023 requires the POS electronic journal to represent principal and supplementary documents/adjustments (invoices, voids, refunds) and X/Z-Readings; every one of those event types is retrievable here via event_type filtering, and no browser client can create, update, or delete a journal entry directly (journalEntryList/ journalEntryGet are the only two operations on this resource).'
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        terminal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        event_type: {$ref: '#/components/schemas/ElectronicJournalEventType'}
        source_type: {type: string, description: 'The authoritative originating table (e.g. "sale", "void", "refund", "x_reading", "z_reading", "shift", "cash_movement", "stock_movement").'}
        source_id: {type: string, format: uuid}
        audit_event_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        payload_json: {type: object, additionalProperties: true}
        occurred_at: {type: string, format: date-time}
