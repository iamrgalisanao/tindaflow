  # ----------------------------------------------------------- Employees (ADR-016 slice 3.1)
  /employees:
    get:
      operationId: employeeList
      tags: [Employees]
      x-capability: EMPLOYEE_MANAGE
      summary: 'List employees (ADR-016 section 5, slice 3.1). ADMIN and MANAGER (amendment 2026-10-26), reads included: a cashier cannot list employees; the till has employeeLookup. Ordered by last name, first name, code. search matches any part of the name or the code, ignoring case.'
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: search
        in: query
        schema: {type: string}
      - name: employee_type
        in: query
        schema: {$ref: '#/components/schemas/EmployeeType'}
      - name: active
        in: query
        schema: {type: boolean}
      responses:
        '200':
          description: Paginated employee list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/Employee'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
    post:
      operationId: employeeCreate
      tags: [Employees]
      x-capability: EMPLOYEE_MANAGE
      summary: 'Create an employee. The code (TSC00001 / SUB00001) is generated by the server from a locked per-store, per-type counter: gap-free, never reused, immutable. Sending employee_code is a 422. The employee is billed to the store''s one billing party (TSC).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmployeeInput'}
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /employees/import:
    post:
      operationId: employeeImport
      tags: [Employees]
      x-capability: EMPLOYEE_POLICY_MANAGE
      summary: 'ADMIN only (EMPLOYEE_POLICY_MANAGE; a manager gets 403). Bulk-create employees from a CSV body (columns first_name, middle_name?, last_name, employee_type; type takes DIRECT, SUBCONTRACTOR, TSC or SUB). Codes are generated; the file cannot carry one. Re-importing creates NEW employees except that an exact duplicate (same type and names, ignoring case and spaces) of an existing employee or an earlier row is skipped and reported. Rows succeed or fail independently. ?dry_run=true reports and changes nothing. A problem with the file as a whole is a 422 on `file`.'
      parameters:
      - name: dry_run
        in: query
        schema: {type: boolean}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Import processed; the result is returned synchronously
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmployeeImportResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /employees/id-cards:
    get:
      operationId: employeeIdCards
      tags: [Employees]
      x-capability: EMPLOYEE_MANAGE
      summary: 'Data for the printable ID-card sheet: name, type and code of each ACTIVE employee matching the filters (or the listed ids), unpaged, at most 500 (422 on search beyond that). The code is the value a QR image carries; rendering the image is the client''s job (no QR library is installed yet).'
      parameters:
      - name: search
        in: query
        schema: {type: string}
      - name: employee_type
        in: query
        schema: {$ref: '#/components/schemas/EmployeeType'}
      - name: ids
        in: query
        schema: {type: array, items: {type: string, format: uuid}}
      responses:
        '200':
          description: The cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/EmployeeLookupResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /employees/lookup:
    get:
      operationId: employeeLookup
      tags: [Employees]
      summary: 'The till''s lookup (any signed-in user, no capability): ONE employee of the caller''s store by EXACT code, as a scanner types it (code then Enter) or a cashier keys it. Surrounding whitespace and case are ignored; there is no partial match and no listing. Returns id, code, type, name, active and (slice 3.2) the `credit` status for the CURRENT cut-off. Unknown code: EMPLOYEE_NOT_FOUND (404). Deactivated employee: EMPLOYEE_INACTIVE (409). Rate limited per signed-in user (named limiter employee-lookup, default 30 a minute, shared with employeeCreditStatusGet): RATE_LIMITED (429), because codes are sequential.'
      parameters:
      - name: code
        in: query
        required: true
        schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: The employee and their credit status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmployeeCreditLookupResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /employees/{employeeId}/credit-status:
    parameters:
    - {name: employeeId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: employeeCreditStatusGet
      tags: [Employees]
      summary: 'The same answer as employeeLookup for an employee the till already holds (any signed-in user, store-scoped): the limit, what is used (CHARGE minus REVERSAL) and what remains for the CURRENT cut-off, so the till can refresh the balance before it charges. Advisory only: checkout re-checks under the employee lock. Other-store or unknown: EMPLOYEE_NOT_FOUND (404); deactivated: EMPLOYEE_INACTIVE (409). Shares the employee-lookup rate limit.'
      responses:
        '200':
          description: The employee and their credit status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EmployeeCreditLookupResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /employees/{employeeId}:
    parameters:
    - {name: employeeId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: employeeGet
      tags: [Employees]
      x-capability: EMPLOYEE_MANAGE
      summary: Get one employee
      responses:
        '200':
          description: The employee
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: employeeUpdate
      tags: [Employees]
      x-capability: EMPLOYEE_MANAGE
      summary: 'Correct the names. The code and the type cannot be changed: sending employee_code or employee_type is a 422, and the application database role has no UPDATE on those columns. A change that changes nothing records nothing.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: {type: string}
                middle_name:
                  anyOf:
                  - {type: string}
                  - {type: 'null'}
                last_name: {type: string}
      responses:
        '200':
          description: The employee
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /employees/{employeeId}/activate:
    parameters:
    - {name: employeeId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: employeeActivate
      tags: [Employees]
      x-capability: EMPLOYEE_MANAGE
      summary: Reactivate an employee (idempotent; an already active employee changes and records nothing)
      responses:
        '200':
          description: The employee
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /employees/{employeeId}/deactivate:
    parameters:
    - {name: employeeId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: employeeDeactivate
      tags: [Employees]
      x-capability: EMPLOYEE_MANAGE
      summary: 'Deactivate an employee (idempotent). There is no delete; the code stays reserved forever and the till refuses the employee (EMPLOYEE_INACTIVE).'
      responses:
        '200':
          description: The employee
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /credit-policies:
    get:
      operationId: creditPolicyList
      tags: [Employees]
      x-capability: EMPLOYEE_MANAGE
      summary: 'The credit limit per cut-off of each employee type (DIRECT, SUBCONTRACTOR). A store starts with 1500.00 and 1000.00; the rows are created on first use.'
      responses:
        '200':
          description: One policy per employee type, DIRECT first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CreditPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /credit-policies/{employeeType}:
    parameters:
    - {name: employeeType, in: path, required: true, schema: {$ref: '#/components/schemas/EmployeeType'}}
    put:
      operationId: creditPolicySetLimit
      tags: [Employees]
      x-capability: EMPLOYEE_POLICY_MANAGE
      summary: 'ADMIN only (EMPLOYEE_POLICY_MANAGE; a manager gets 403, though a manager can read the limits). Set the limit per cut-off of one employee type (an amount of at most two decimals, 0 allowed). Recorded as CREDIT_LIMIT_CHANGED with the old and new value; setting the value it already has records nothing.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit_per_cutoff]
              properties:
                limit_per_cutoff: {type: string, pattern: '^\d{1,9}(\.\d{1,2})?$'}
      responses:
        '200':
          description: The policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreditPolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ----------------------------------------------------------- Supervisor override of the credit limit (ADR-016 section 6, slice 3.3)
  # ----------------------------------------------------------- Billing (ADR-016 section 8, slice 4.1)
  /billing/statement:
    get:
      operationId: billingStatementGet
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'The billing statement for the store''s one billing party (TSC; subcontractor employees are on the same bill), recomputed from the credit ledger and the sale snapshots for a named cut-off or any from/to range. Account (employee) -> meal type -> item/dish, with sold, returned and net quantity and amount, subtotals, a grand total, and every void and refund as a flagged adjustment in the range of the ORIGINAL charge. Equals the ledger net (CHARGE minus REVERSAL); a statement that does not reconcile is refused with BILLING_RECONCILIATION_FAILED (500). Stores nothing. `comparison` shows what changed since the latest earlier saved run for the same range and filters. `Accept: text/csv` returns the CSV (csv-export-contract.md, "Billing statement") and records BILLING_EXPORTED. MANAGER and ADMIN; a cashier gets 403.'
      parameters:
      - {name: cutoff_month, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}, description: 'A named cut-off: the month, with cutoff_half. Use this OR from/to, not both.'}
      - {name: cutoff_half, in: query, schema: {type: integer, enum: [1, 2]}, description: '1 = the 1st to the 15th, 2 = the 16th to the last day of the month (28, 29, 30 or 31).'}
      - {name: from, in: query, schema: {type: string, format: date}, description: 'First Manila calendar date, inclusive. With to. from must not be after to; the range is at most 366 days.'}
      - {name: to, in: query, schema: {type: string, format: date}}
      - {name: employee_type, in: query, schema: {$ref: '#/components/schemas/EmployeeType'}}
      - {name: employee_id, in: query, schema: {type: string, format: uuid}, description: 'One employee of this store (another store''s is a 422).'}
      - {name: as_of, in: query, schema: {type: string, format: date-time}, description: 'Reproduce the statement as the ledger stood at this instant (entries recorded later are ignored). Default: now.'}
      responses:
        '200':
          description: The statement (JSON), or the CSV when Accept is text/csv
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BillingStatement'}
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /billing-runs:
    get:
      operationId: billingRunList
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'Saved billing runs of the store, newest first, without the frozen statement.'
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated runs
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/BillingRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: billingRunCreate
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'Saves the statement for the given range and filters as the next billing run (BR-000001, gap-free per store): an append-only, numbered, frozen copy that can be reprinted exactly later. Every call creates a NEW run (a re-run is never an edit); the run carries `comparison` with the latest earlier run for the same range. Not idempotent by key (a back-office action has no terminal); the screen disables the button while saving. Audit BILLING_RUN_CREATED. Same parameters as billingStatementGet, in the JSON body.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingRequest'}
      responses:
        '201':
          description: The saved run, with its statement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BillingRunWithStatement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /billing-runs/{runId}:
    get:
      operationId: billingRunGet
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'One saved run with its frozen statement; `statement_intact` is false if the stored statement no longer hashes to `statement_sha256`. `Accept: text/csv` returns the CSV of the frozen statement and records BILLING_EXPORTED. Another store''s run is BILLING_RUN_NOT_FOUND (404).'
      parameters:
      - {name: runId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The run (JSON), or the CSV when Accept is text/csv
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BillingRunWithStatement'}
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # ----------------------------------------------------------- Cheques against what is owed (ADR-016 section 8, slice 4.2)
  /billing/balance:
    get:
      operationId: billingBalanceGet
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'What the billing party (TSC) owes per cut-off period, derived and never stored: billed (the credit ledger''s CHARGE minus REVERSAL, the figure the billing statement of the same cut-off shows) minus received (the allocations of cheques that have not been returned). A period paid more than it now owes (a refund arrived after the cheque) is OVERPAID with a NEGATIVE owed amount, shown as a credit and never netted against other periods; `totals.owed_amount` adds the periods that owe, `totals.credit_amount` the credit. `as_of` reproduces a past balance. `Accept: text/csv` returns the CSV and records BILLING_EXPORTED (report = balance). MANAGER and ADMIN; a cashier gets 403.'
      parameters:
      - {name: as_of, in: query, schema: {type: string, format: date-time}, description: 'Ignore ledger entries and cheques recorded after this instant, and count a cheque as received if it was returned only after it. Default: now.'}
      responses:
        '200':
          description: The balance (JSON), or the CSV when Accept is text/csv
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BillingBalance'}
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /billing-cheques:
    get:
      operationId: billingChequeList
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'Cheques received, newest first, each with the periods it pays. `status` filters. `Accept: text/csv` returns every matching cheque as CSV (csv-export-contract.md) and records BILLING_EXPORTED (report = cheques).'
      parameters:
      - {name: status, in: query, schema: {type: string, enum: [RECEIVED, RETURNED]}}
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated cheques (JSON), or the CSV when Accept is text/csv
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/BillingCheque'}
            text/csv:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
    post:
      operationId: billingChequeRecord
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'Records a cheque received from the billing party against the cut-off periods it pays (BILL-002). The allocations must add up to the cheque amount exactly (no "on account" balance), each period listed once and starting on the 1st or 16th, and each at most what that period currently owes; the check runs under a lock on the billing party, so two cheques cannot over-allocate. A cheque is not a sale or a payment and never touches a shift, the cash drawer or a reading. No Idempotency-Key (a back-office action has no terminal): a repeat of the same bank and number is CHEQUE_DUPLICATE (409). Audit BILLING_CHEQUE_RECORDED. MANAGER and ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingChequeRequest'}
      responses:
        '201':
          description: The recorded cheque
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BillingCheque'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}  # CHEQUE_DUPLICATE or CHEQUE_ALLOCATION_EXCEEDS_OWED (details name the period, what it owes and what was allocated); nothing is recorded
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /billing-cheques/{chequeId}:
    get:
      operationId: billingChequeGet
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'One cheque with its allocations. Another store''s cheque is CHEQUE_NOT_FOUND (404).'
      parameters:
      - {name: chequeId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The cheque
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BillingCheque'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /billing-cheques/{chequeId}/return:
    post:
      operationId: billingChequeReturn
      tags: [Billing]
      x-capability: BILLING_MANAGE
      summary: 'Marks a cheque RETURNED (it bounced): it stops counting as received and the amounts it paid are owed again, by derivation (nothing else is written). Final: a second attempt is CHEQUE_ALREADY_RETURNED (409), and a cheque the bank pays later is recorded as a NEW cheque. Requires a reason and the date returned (not in the future). Audit BILLING_CHEQUE_RETURNED with the reason. No Idempotency-Key (the status change is one-way, so a retry is refused clearly).'
      parameters:
      - {name: chequeId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BillingChequeReturnRequest'}
      responses:
        '200':
          description: The cheque, now RETURNED
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/BillingCheque'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /credit-override-approvers:
    get:
      operationId: creditOverrideApproverList
      tags: [CreditOverride]
      summary: 'The managers a cashier can ask to approve an over-limit credit sale (any signed-in user): active users of the caller''s store who hold CREDIT_LIMIT_OVERRIDE and have set a code, by name, the caller left out. No code, status or role is returned.'
      responses:
        '200':
          description: Approvers by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /credit-overrides:
    post:
      operationId: creditOverrideGrant
      tags: [CreditOverride]
      summary: 'A NAMED approver''s code -> a single-use approval for ONE over-limit credit sale (terminal-scoped: session and enrolled terminal; the cashier and terminal come from the authoritative context, never the body). One generic CREDIT_OVERRIDE_INVALID (422) covers a wrong code, an unknown, inactive or other-store approver, one without a code and one without CREDIT_LIMIT_OVERRIDE; only a wrong code counts toward the lockout (5 wrong codes lock that approver 15 minutes: CREDIT_OVERRIDE_LOCKED, 423). The approver being the cashier is CREDIT_OVERRIDE_NOT_ALLOWED (403). The wrong-code count is committed on its own, before the refusal. Limited to 10 requests per 15 minutes per terminal and per user (RATE_LIMITED 429). The token is returned once; only its SHA-256 is stored. It is bound to this terminal, cashier and employee, valid 5 minutes, and consumed by the first saleFinalize that needs it. Neither the code nor the token is ever logged or audited.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreditOverrideGrantRequest'}
      responses:
        '201':
          description: The approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreditOverrideGrantResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '423':
          description: CREDIT_OVERRIDE_LOCKED. details.retry_after_minutes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /credit-override-code:
    get:
      operationId: creditOverrideCodeGet
      tags: [CreditOverride]
      x-capability: CREDIT_LIMIT_OVERRIDE
      summary: 'Whether the signed-in approver has an override code, whether it is locked, and when it was set. Never the code.'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverrideCodeStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: creditOverrideCodeSet
      tags: [CreditOverride]
      x-capability: CREDIT_LIMIT_OVERRIDE
      summary: 'The approver sets or changes their OWN code after re-entering their account password. 6 to 8 digits; not one repeated digit, a straight run or a repeated short block; different from the account password. Stored only as a slow hash. Clears a lockout and the wrong-code count. Audit OVERRIDE_CODE_SET (no code, no hash). Limited to 10 requests per 15 minutes per user (RATE_LIMITED 429).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OverrideCodeSetRequest'}
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverrideCodeStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /credit-override-codes:
    get:
      operationId: creditOverrideCodeList
      tags: [CreditOverride]
      x-capability: USER_MANAGE
      summary: 'For an administrator: the store''s ADMIN and MANAGER users with whether each holds a code or is locked. Never a code.'
      responses:
        '200':
          description: Statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                      - {$ref: '#/components/schemas/OverrideCodeStatus'}
                      - type: object
                        properties:
                          name: {type: string}
                          role: {$ref: '#/components/schemas/UserRole'}
                          active: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/{userId}/override-code/reset:
    parameters:
    - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: creditOverrideCodeReset
      tags: [CreditOverride]
      x-capability: USER_MANAGE
      summary: 'An administrator CLEARS a user''s override code (and any lockout) after re-entering their own account password; the user then sets a new code themselves, so the administrator never knows it. Audit OVERRIDE_CODE_RESET. A user of another store is USER_NOT_FOUND (404); a user with no code row changes nothing.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OverrideCodeResetRequest'}
      responses:
        '200':
          description: Status after the clear
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverrideCodeStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  # ----------------------------------------------------------- Inventory
  /inventory/stock:
    get:
      operationId: inventoryStockList
      tags: [Inventory]
      summary: Stock on hand (derived StockBalance projection)
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: product_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated stock balances
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/StockBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /inventory/low-stock:
    get:
      operationId: inventoryLowStockList
      tags: [Inventory]
      summary: 'Products at or below their low-stock threshold: the product''s own reorder_level when it has one (even 0), otherwise the store''s low_stock_default_threshold (3 out of the box). Each row carries that effective threshold as low_stock_threshold. ADR-017 section 2.'
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated low-stock list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/StockBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /stock/availability:
    get:
      operationId: stockAvailabilityGet
      tags: [Inventory]
      summary: 'ADR-017 slice A. What is left of every ACTIVE TRACKED product at the store''s default location, plus the store''s stock rules, for the till''s tiles and cart. Any signed-in user of the store (a session, no capability): quantities and flags only, never a cost. A tracked product with no stock record is listed with remaining 0.000 (sold out). `low` = 0 < remaining <= threshold; `sold_out` = remaining <= 0; `threshold` is the product''s reorder_level or the store default. Advisory: a stale figure can show a tile as available that checkout then refuses (INSUFFICIENT_STOCK).'
      responses:
        '200':
          description: The rules and the remaining quantities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockAvailability'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /daily-stock:
    get:
      operationId: dailyStockGet
      tags: [DailyStock]
      summary: 'ADR-017 slice B. The entry grid for the store''s CURRENT stock date: one row per active DAILY dish (through its hidden pool) and per active plain DAILY product, in dish-category order, with cooked (portions added minus removed today), sold, remaining (the date''s balance; negative = oversold) and yesterday''s cooked (for "copy yesterday''s quantities", which only pre-fills the form). Any signed-in user of the store (quantities only); `can_enter_directly` says whether the caller holds STOCK_ADJUST.'
      responses:
        '200':
          description: Today's grid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyStockGrid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /daily-stock/approvers:
    get:
      operationId: dailyStockApproverList
      tags: [DailyStock]
      summary: 'The managers a cashier can ask to approve a daily stock entry (any signed-in user): active users of the caller''s store who hold STOCK_ADJUST and have set an override code, by name, the caller left out. No code, status or role is returned.'
      responses:
        '200':
          description: Approvers by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /daily-stock/approvals:
    post:
      operationId: dailyStockApprovalCreate
      tags: [DailyStock]
      summary: 'ADR-017 slice B, client decision 5. A NAMED manager''s code -> a single-use approval for ONE daily stock save by a cashier (terminal-scoped: session and enrolled terminal; the cashier and terminal come from the authoritative context). The approver must hold STOCK_ADJUST and differ from the cashier. The code is the approver''s ONE override code, shared with the other overrides: one generic STOCK_ENTRY_APPROVAL_INVALID (422) for a wrong code, an unknown, inactive or other-store approver, one without a code and one without STOCK_ADJUST; five wrong codes lock that approver 15 minutes whichever override they were for (STOCK_ENTRY_APPROVAL_LOCKED, 423). Shares the 10-per-15-minutes limit per terminal and user with the other override grants (RATE_LIMITED 429). The token is returned once and only its SHA-256 is stored; it is bound to this terminal, this cashier, the store and TODAY''s stock date, valid 5 minutes, and consumed by the dailyStockEntryCreate that uses it. Neither the code nor the token is ever logged or audited.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DailyStockApprovalRequest'}
      responses:
        '201':
          description: The approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyStockApprovalResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '423':
          description: STOCK_ENTRY_APPROVAL_LOCKED. details.retry_after_minutes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /daily-stock/entries:
    post:
      operationId: dailyStockEntryCreate
      tags: [DailyStock]
      summary: 'ADR-017 slice B. Saves the daily stock grid for the CURRENT stock date: each line SETS an item''s cooked total (`cooked`; the server writes the difference as DAILY_PORTIONS_ADDED or _REMOVED) or ADDS portions (`add`, a second batch). Lowering needs `reason` and may not take the remaining below zero (DAILY_STOCK_BELOW_SOLD, 422, nothing written). Terminal-scoped and idempotent (Idempotency-Key). A user holding STOCK_ADJUST (MANAGER, ADMIN) enters directly; a CASHIER must present `stock_entry_token` from dailyStockApprovalCreate (STOCK_ENTRY_APPROVAL_REQUIRED, 403 without; _INVALID 422, _EXPIRED 409, _NOT_ALLOWED 403). The token is consumed in this transaction only; a refused save leaves it usable. Every movement records created_by and approved_by; one DAILY_STOCK_ENTERED audit event carries entered_by, approved_by and every line.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DailyStockEntryRequest'}
      responses:
        '201':
          description: The entry as recorded, and the refreshed grid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyStockEntryResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /stock-rules:
    get:
      operationId: stockRulesGet
      tags: [StockRules]
      x-capability: STOCK_ADJUST
      summary: 'ADR-017 section 1 (gate moved to STOCK_ADJUST, MANAGER and ADMIN, by slice B). The store''s stock rules (block a sale without stock, allow the manager override, the low-stock default, the hour the stock day starts) and the PRE-FLIGHT count: how many RUNNING-stock, active products currently have zero or no stock (these would be unsellable if blocking were on). Daily items are entered each morning and are not counted.'
      responses:
        '200':
          description: The rules and the pre-flight
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockRules'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      operationId: stockRulesSet
      tags: [StockRules]
      x-capability: STOCK_ADJUST
      summary: 'Replaces the values (stock_day_cutover_hour optional: left out, the stored hour is kept). MANAGER and ADMIN (a cashier gets 403). Writes one STOCK_RULES_CHANGED audit event with the old and new values (and, when blocking is turned on, the unsellable count shown); saving what is already stored writes nothing. Turning blocking on never touches a balance.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StockRulesInput'}
      responses:
        '200':
          description: The rules as saved, with the pre-flight
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockRules'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /stock-override-approvers:
    get:
      operationId: stockOverrideApproverList
      tags: [StockOverride]
      summary: 'The managers a cashier can ask to approve a sale that is short of stock (any signed-in user): active users of the caller''s store who hold STOCK_SALE_OVERRIDE and have set an override code, by name, the caller left out. No code, status or role is returned.'
      responses:
        '200':
          description: Approvers by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /stock-overrides:
    post:
      operationId: stockOverrideGrant
      tags: [StockOverride]
      summary: 'ADR-017 section 9. A NAMED approver''s code + the cart -> a single-use approval for ONE sale that is short of stock (terminal-scoped: session and enrolled terminal; the cashier and terminal come from the authoritative context). The server works out the cart''s shortfall itself and refuses (STOCK_OVERRIDE_NOT_ALLOWED, 403) when there is none, when the store switched overrides off, or when the approver is the cashier. The code is the approver''s ONE override code, shared with the credit-limit override: one generic STOCK_OVERRIDE_INVALID (422) for a wrong code, an unknown, inactive or other-store approver, one without a code and one without STOCK_SALE_OVERRIDE; five wrong codes lock that approver 15 minutes whichever override they were for (STOCK_OVERRIDE_LOCKED, 423). Shares the 10-per-15-minutes limit per terminal and user with creditOverrideGrant (RATE_LIMITED 429). The token is returned once and only its SHA-256 is stored; it is bound to this terminal, this cashier and the exact shortfall, valid 5 minutes, and consumed by the first saleFinalize that really is short. Neither the code nor the token is ever logged or audited.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StockOverrideGrantRequest'}
      responses:
        '201':
          description: The approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockOverrideGrantResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '423':
          description: STOCK_OVERRIDE_LOCKED. details.retry_after_minutes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /inventory/movements:
    get:
      operationId: inventoryMovementList
      tags: [Inventory]
      summary: Append-only stock movement ledger
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: product_id
        in: query
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: movement_type
        in: query
        schema: {$ref: '#/components/schemas/StockMovementType'}
      responses:
        '200':
          description: Paginated stock movements
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/StockMovement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /inventory/receipts:
    post:
      operationId: inventoryReceiptCreate
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Receive stock (PURCHASE_RECEIPT / OPENING_STOCK movement)
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, movement_type]
              properties:
                product_id: {type: string, format: uuid}
                quantity: {$ref: '#/components/schemas/Quantity'}
                movement_type:
                  type: string
                  enum: [OPENING_STOCK, PURCHASE_RECEIPT]
                unit_cost: {$ref: '#/components/schemas/Money'}
                note: {type: string}
      responses:
        '201':
          description: Stock movement recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /inventory/adjustments:
    post:
      operationId: inventoryAdjustmentCreate
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Record a stock adjustment (reason required — Stage 2 invariant
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, movement_type, reason]
              properties:
                product_id: {type: string, format: uuid}
                quantity: {$ref: '#/components/schemas/Quantity'}
                movement_type:
                  type: string
                  enum: [STOCK_ADJUSTMENT_IN, STOCK_ADJUSTMENT_OUT, DAMAGE, EXPIRED]
                reason: {type: string, minLength: 1, description: Required — STOCK_ADJUSTMENT_REASON_REQUIRED if omitted}
                note: {type: string}
      responses:
        '201':
          description: Stock movement recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ---- Stock counts and transfers (stage 25) ---------------------------------------------------
  # Added 2026-09-20 as a forward commit: none of these operations had a prior draft at any stage
  # (docs/06-backend/stage-25-stock-counts-and-transfers.md). Scope note: scope.md lists stocktake and inter-store
  # transfers as Phase 2; the owner chose to build counts and transfers between one store's own locations now.
  # Every operation needs STOCK_ADJUST and is scoped to the caller's store. Posting a count and creating a transfer
  # write the ledger, so, like receipts and adjustments, they need an enrolled terminal and an Idempotency-Key.
  /inventory/counts:
    get:
      operationId: stockCountList
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: List stock counts, newest first
      description: Carries lines_count, not the lines; stockCountGet carries the lines. An unknown status or a malformed location_id matches nothing.
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/StockCountStatus'}
      - name: location_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated stock counts
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/StockCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: stockCountCreate
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Start a stock count of one location
      description: Session only (nothing is written to the ledger until the count is posted). Without location_id the store's default location is counted. A location has at most one OPEN count, so two people counting the same shelf share it; a second start is STOCK_COUNT_ALREADY_OPEN, whose details carry the open count's id.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                location_id: {type: string, format: uuid}
                note: {type: string, maxLength: 255}
      responses:
        '201':
          description: Count started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /inventory/counts/{stockCountId}:
    get:
      operationId: stockCountGet
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Get a stock count with its lines and the summary of what posting does
      parameters:
      - {$ref: '#/components/parameters/StockCountId'}
      responses:
        '200':
          description: The count, its lines ordered by product name, and a summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /inventory/counts/{stockCountId}/lines:
    put:
      operationId: stockCountLinesRecord
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Record what was found for one or more products
      description: 'Session only. Each line remembers what the ledger expected at the moment it was recorded (expected_quantity), so posting corrects counted minus expected and sales made while people count are never overwritten. Counting a product again replaces its line and reads the expected quantity again. The request is all or nothing. Only tracked products of the store can be counted (an untracked product is VALIDATION_FAILED); zero is a valid count. Only an OPEN count can be changed (STOCK_COUNT_NOT_OPEN).'
      parameters:
      - {$ref: '#/components/parameters/StockCountId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [product_id, counted_quantity]
                    properties:
                      product_id: {type: string, format: uuid}
                      counted_quantity: {$ref: '#/components/schemas/Quantity'}
      responses:
        '200':
          description: The count after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /inventory/counts/{stockCountId}/lines/{productId}:
    delete:
      operationId: stockCountLineRemove
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Remove a product from the count
      description: Session only. Removing a product that is not in the count is not an error; the count simply does not include it. Only an OPEN count can be changed (STOCK_COUNT_NOT_OPEN).
      parameters:
      - {$ref: '#/components/parameters/StockCountId'}
      - name: productId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: The count after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/counts/{stockCountId}/post:
    post:
      operationId: stockCountPost
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Post the count
      description: 'Every line whose variance is not zero becomes one STOCK_ADJUSTMENT_IN (found more) or STOCK_ADJUSTMENT_OUT (found fewer) movement at the count''s location, referencing the count, with the reason "Stock count". Products nobody counted are left alone, never assumed to be zero. Writes an audit event STOCK_COUNT_POSTED and one journal entry per movement. A count with no lines is VALIDATION_FAILED. Posting is final: correct a wrong count with a later count or adjustment. Terminal-scoped and idempotent; a retry with the same key returns the same count.'
      parameters:
      - {$ref: '#/components/parameters/StockCountId'}
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      responses:
        '200':
          description: The posted count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockCount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /inventory/counts/{stockCountId}/cancel:
    post:
      operationId: stockCountCancel
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Cancel an open count
      description: Session only. Discards the count without touching stock and frees the location for a new one. Writes an audit event STOCK_COUNT_CANCELLED. A count that is already posted or cancelled is STOCK_COUNT_NOT_OPEN.
      parameters:
      - {$ref: '#/components/parameters/StockCountId'}
      responses:
        '200':
          description: The cancelled count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /inventory/transfers:
    get:
      operationId: stockTransferList
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: List stock transfers, newest first
      description: Carries lines_count, not the lines. location_id matches a transfer on either side. An unknown or malformed filter id matches nothing.
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: location_id
        in: query
        schema: {type: string, format: uuid}
      - name: product_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated stock transfers
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/StockTransfer'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: stockTransferCreate
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Move stock between two locations of the same store
      description: 'Immediate: one TRANSFER_OUT at the source and one TRANSFER_IN at the destination per product, written in one transaction with the transfer record, so total stock never changes and the two legs cannot be separated. There is no in-transit state, edit or cancel: a wrong transfer is corrected by transferring back. As with every outflow in V1 the source may go below zero rather than block the move. A location of another store is INVENTORY_LOCATION_NOT_FOUND (transfers between stores are Phase 2). Writes an audit event STOCK_TRANSFERRED. Terminal-scoped and idempotent.'
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_location_id, to_location_id, items]
              properties:
                from_location_id: {type: string, format: uuid}
                to_location_id: {type: string, format: uuid, description: Must differ from from_location_id}
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: {type: string, format: uuid}
                      quantity: {$ref: '#/components/schemas/Quantity'}
                note: {type: string, maxLength: 255}
      responses:
        '201':
          description: Transfer recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockTransfer'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /inventory/transfers/{stockTransferId}:
    get:
      operationId: stockTransferGet
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Get a stock transfer with its lines
      parameters:
      - name: stockTransferId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: The transfer and its lines ordered by product name
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockTransfer'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # --------------------------------------------------------------- Sales
  /sales:
    get:
      operationId: saleList
      tags: [Sales]
      summary: Search sales history
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: invoice_number
        in: query
        schema: {type: string}
      - name: slip_number
        in: query
        description: ADR-016. Exact match on the slip number of a sale made in SLIP mode.
        schema: {type: string}
      - name: document_number
        in: query
        description: ADR-016. Exact match on the number on the sale's document, whichever it is -- the invoice number of an INVOICE-mode sale or the slip number of a SLIP-mode sale.
        schema: {type: string}
      - name: transaction_number
        in: query
        schema: {type: string}
      - name: cashier_id
        in: query
        schema: {type: string, format: uuid}
      - name: terminal_id
        in: query
        schema: {type: string, format: uuid}
      - name: product_id
        in: query
        schema: {type: string, format: uuid}
      - name: payment_method
        in: query
        schema: {$ref: '#/components/schemas/PaymentMethod'}
      - name: employee_code
        in: query
        description: 'ADR-016 slice 3.2. The credit sales of one employee, by the code on their card (exact match; case and surrounding whitespace ignored).'
        schema: {type: string, maxLength: 64}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/SaleStatus'}
      - name: sort
        in: query
        schema:
          type: string
          enum: [sold_at, -sold_at, grand_total, -grand_total]
      responses:
        '200':
          description: Paginated sales
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/SaleSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: saleFinalize
      tags: [Sales]
      summary: Finalize a Sale (checkout) — the single most important operation
      x-stock-note: 'ADR-017 slice A: when the store blocks sales without stock the 409 may be INSUFFICIENT_STOCK (details.shortfalls[] of every short line and details.override_available; not transient, the till does not retry it; a refused checkout stores no idempotency result, so the same key may be sent again once stock is entered or a stock_override_token is added).'
      description: 'A Sale does not exist before this call succeeds (Stage 2 §2.7: no persisted DRAFT). Terminal, cashier, shift, fiscal_day are resolved server-side and can never be overridden by the request body (architecture.md §5/§11, Stage 2 invariant #3/#4). Server recomputes every monetary/tax/discount figure via the FinancialCalculator (ADR-012) regardless of any client-submitted preview values. Credit (ADR-016 slice 3.2): `payments` may be ONE `{method: CREDIT, amount}` plus `employee_id`. CREDIT mixed with any other payment: CREDIT_MIXED_TENDER (422); CREDIT without employee_id, or employee_id without CREDIT: CREDIT_EMPLOYEE_REQUIRED (422); unknown or other-store employee: EMPLOYEE_NOT_FOUND (404); deactivated: EMPLOYEE_INACTIVE (409); over the limit for the sale''s cut-off period: CREDIT_LIMIT_EXCEEDED (409, details carry limit, used, remaining and requested). The recorded CREDIT amount is always the server''s grand total (an amount below it is INSUFFICIENT_PAYMENT).'
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaleFinalizeRequest'}
      responses:
        '201':
          description: Sale finalized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /sales/{saleId}:
    get:
      operationId: saleGet
      tags: [Sales]
      summary: Get full Sale detail
      parameters:
      - {$ref: '#/components/parameters/SaleIdPath'}
      responses:
        '200':
          description: Sale detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /sales/{saleId}/void:
