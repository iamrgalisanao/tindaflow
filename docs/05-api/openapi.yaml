  # -------------------------------------------------------- StoreSettings
  /store-settings:
    get:
      operationId: storeSettingsGet
      tags: [StoreSettings]
      summary: Get current store settings
      responses:
        '200':
          description: Store settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      operationId: storeSettingsUpdate
      tags: [StoreSettings]
      x-capability: STORE_SETTINGS_MANAGE
      summary: Update current store settings
      description: 'Updates current configuration only. Never mutates any historical invoice_snapshot_json (ADR-006) — a name/address/footer change here has no effect on already-issued invoices.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StoreSettingsInput'}
      responses:
        '200':
          description: Store settings updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /tax-registrations:
    get:
      operationId: taxRegistrationList
      tags: [StoreSettings]
      summary: Effective-dated tax registration history
      responses:
        '200':
          description: Tax registration history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaxRegistration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: taxRegistrationCreate
      tags: [StoreSettings]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Register a new effective-dated tax registration (never overwrites history — Stage 2 invariant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_type, effective_from]
              properties:
                registration_type: {$ref: '#/components/schemas/TaxRegistrationType'}
                effective_from: {type: string, format: date}
      responses:
        '201':
          description: New tax registration created; prior one closed as of the new effective_from
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxRegistration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ---------------------------------------------------- FiscalInstallation
  /fiscal-installations:
    get:
      operationId: fiscalInstallationList
      tags: [FiscalInstallation]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: List fiscal installations
      description: 'Administrative surface only. Entering values here does not itself constitute BIR accreditation — TindaFlow V1 is not accredited (architecture.md §12/ADR-009).'
      responses:
        '200':
          description: Fiscal installations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FiscalInstallation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: fiscalInstallationCreate
      tags: [FiscalInstallation]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Record a fiscal installation (accreditation and PTU tracked as independent effective-dated facts — ADR-009)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FiscalInstallationInput'}
      responses:
        '201':
          description: Fiscal installation recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FiscalInstallation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /fiscal-installations/{fiscalInstallationId}:
    get:
      operationId: fiscalInstallationGet
      tags: [FiscalInstallation]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Get a fiscal installation
      parameters:
      - name: fiscalInstallationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Fiscal installation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FiscalInstallation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /fiscal-installations/{fiscalInstallationId}/terminals:
    post:
      operationId: fiscalInstallationAssignTerminal
      tags: [FiscalInstallation]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Assign (or reassign) a terminal's current fiscal installation mapping
      description: 'Added in the store-setup pass (2026-09-18) -- no prior draft in this document at any stage. Closes the terminal''s existing current mapping (`terminal_fiscal_installations_one_current_per_terminal` allows only one `effective_to IS NULL` row per terminal) and opens a new one, rather than requiring a separate close call first -- the same "prior one closed" shape as `taxRegistrationCreate`. This is the row `FiscalInstallationResolver::resolveForTerminal` reads at checkout; without one, `POST /sales` fails with a setup-defect 500 (a disclosed, deliberately uncaught gap -- see `docs/06-backend/stage-6c-sale-finalization.md` §5).'
      parameters:
      - name: fiscalInstallationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_id]
              properties:
                terminal_id: {type: string, format: uuid}
                effective_from: {type: string, format: date-time, description: Defaults to now if omitted}
      responses:
        '201':
          description: Mapping created; any prior current mapping for this terminal is closed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalFiscalInstallation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ----------------------------------------------------------- InvoiceSeries
  # Store-setup pass (2026-09-18) -- no prior draft in this document at any
  # stage; forward-committed past stage-6c-baseline per the owner decision
  # recorded in docs/PROJECT-MANIFEST.md's store-setup section. This is the
  # table InvoiceSeriesAllocator::allocateForFiscalInstallation reads at
  # checkout time.
  /invoice-series:
    get:
      operationId: invoiceSeriesList
      tags: [InvoiceSeries]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: List invoice series for the store
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: fiscal_installation_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated invoice series
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/InvoiceSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: invoiceSeriesCreate
      tags: [InvoiceSeries]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Activate a new invoice series for a fiscal installation
      description: 'Bootstraps `current_number = starting_number - 1` (invariants.md INVSERIES-001) so the first real allocation yields `starting_number` exactly. `409 INVOICE_SERIES_ALREADY_ACTIVE` if the fiscal installation already has an ACTIVE series -- close it first (`invoiceSeriesClose`), never an implicit auto-supersede.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoiceSeriesInput'}
      responses:
        '201':
          description: Invoice series activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /invoice-series/{invoiceSeriesId}/close:
    post:
      operationId: invoiceSeriesClose
      tags: [InvoiceSeries]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Close an invoice series
      description: An explicit admin action, never automatic -- retiring a fiscally-significant numbering sequence is never implied by another operation.
      parameters:
      - name: invoiceSeriesId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Invoice series closed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  # ------------------------------------------------------- InventoryLocation
  # Store-setup pass (2026-09-18) -- tagged Inventory (already-existing tag,
  # no new tag needed); no prior draft in this document at any stage. This
  # is the table InventoryLocationResolver::resolveDefaultForStore reads at
  # checkout time.
  /inventory-locations:
    get:
      operationId: inventoryLocationList
      tags: [Inventory]
      summary: List inventory locations for the store
      description: 'Loosened 2026-09-20 (stage 25): session only, no capability. A location is just a name, and the stock, count and transfer screens of a MANAGER (STOCK_ADJUST without FISCAL_CONFIGURATION_MANAGE) need the list to say where stock is. Creating and editing stay FISCAL_CONFIGURATION_MANAGE.'
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated inventory locations
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/InventoryLocation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: inventoryLocationCreate
      tags: [Inventory]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Create an inventory location
      description: A store's first location is made the default automatically, regardless of the submitted `is_default` value -- otherwise a fresh store could never pass the checkout-time default-location check without a second, separate call.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryLocationInput'}
      responses:
        '201':
          description: Inventory location created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryLocation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /inventory-locations/{inventoryLocationId}:
    patch:
      operationId: inventoryLocationUpdate
      tags: [Inventory]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Rename an inventory location, or promote it to the store's default
      description: '`is_default` may only be submitted as `true` -- a location is promoted to default (which transactionally demotes the current one), never explicitly demoted on its own, so this endpoint can never leave a store with zero default locations.'
      parameters:
      - name: inventoryLocationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                is_default: {type: boolean, enum: [true]}
      responses:
        '200':
          description: Inventory location updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryLocation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ------------------------------------------------------------ StoreSetup
  # Store-setup pass (2026-09-18) -- no prior draft in this document at any
  # stage. Read-only, non-authoritative aggregate check across the four
  # checkout-time resolver prerequisites, so the frontend can show a clear
  # "setup incomplete" state before a cashier attempts a checkout that is
  # guaranteed to fail.
  /store-setup/readiness:
    get:
      operationId: storeSetupReadinessGet
      tags: [StoreSetup]
      summary: Store-setup readiness for the current terminal
      description: 'security: cookieAuth AND terminalCookieAuth conjunctively, same as shiftCurrentGet -- no x-capability, since a cashier on an enrolled terminal needs this too, not just an admin.'
      responses:
        '200':
          description: Readiness checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreSetupReadiness'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  # --------------------------------------------------------------- Audit
  /audit-events:
    get:
      operationId: auditEventList
      tags: [Audit]
      x-capability: AUDIT_VIEW
      summary: Search the audit event log (read-only — no create/update/delete endpoint exists)
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: event_type
        in: query
        schema: {type: string}
      - name: actor_user_id
        in: query
        schema: {type: string, format: uuid}
      - name: entity_type
        in: query
        schema: {type: string}
      - name: entity_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /audit-events/{auditEventId}:
    get:
      operationId: auditEventGet
      tags: [Audit]
      x-capability: AUDIT_VIEW
      summary: Get a single audit event
      parameters:
      - name: auditEventId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Audit event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # ----------------------------------------------------- ElectronicJournal
  /electronic-journal-entries:
    get:
      operationId: journalEntryList
      tags: [ElectronicJournal]
      x-capability: JOURNAL_VIEW
      summary: Search the electronic journal (read-only — no create/update/delete endpoint exists)
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: event_type
        in: query
        schema: {$ref: '#/components/schemas/ElectronicJournalEventType'}
      - name: terminal_id
        in: query
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/AcceptFormatHeader'}
      responses:
        '200':
          description: Paginated (or CSV-exported) journal entries
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/ElectronicJournalEntry'}
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /electronic-journal-entries/{journalEntryId}:
    get:
      operationId: journalEntryGet
      tags: [ElectronicJournal]
      x-capability: JOURNAL_VIEW
      summary: Get a single journal entry
      parameters:
      - name: journalEntryId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Journal entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ElectronicJournalEntry'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # --------------------------------------------------------------- Users
  /users:
    get:
      operationId: userList
      tags: [Users]
      x-capability: USER_MANAGE
      summary: List users
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: role
        in: query
        schema: {$ref: '#/components/schemas/UserRole'}
      - name: active
        in: query
        schema: {type: boolean}
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: userCreate
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /users/{userId}:
    get:
      operationId: userGet
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Get a user
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: userUpdate
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Update a user
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /users/{userId}/deactivate:
    post:
      operationId: userDeactivate
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Deactivate a user (no DELETE — users are referenced by historical audit/sale records)
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{userId}/activate:
    post:
      operationId: userActivate
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Reactivate a deactivated user
      description: 'Added 2026-09-19 (forward commit, no prior draft): userDeactivate had no inverse, so a deactivation was permanent. Idempotent -- activating an already-active user returns them unchanged. The user signs in again with their existing password; sessions that ended at deactivation are not resurrected.'
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: User activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: tindaflow_session, description: 'Laravel-compatible session cookie (HttpOnly, Secure, SameSite=Strict). All state-changing requests additionally require a valid CSRF token via the standard Laravel double-submit-cookie mechanism (X-XSRF-TOKEN header sourced from the XSRF-TOKEN cookie); this is enforced by global middleware and is not repeated as a parameter on every operation in this document — see api-design.md, Authentication.'}
    terminalCookieAuth: {type: apiKey, in: cookie, name: tindaflow_terminal, description: 'Opaque, high-entropy terminal credential issued at enrollment (ADR-011) and stored as a second HttpOnly/SameSite=Strict cookie (Secure mandatory in production). Looked up by deterministic hash against terminals.credential_hash on every request; a revoked (revoked_at IS NOT NULL) or unmatched credential fails with TERMINAL_REVOKED/TERMINAL_NOT_ENROLLED. Required in addition to, never instead of, cookieAuth on every POS_TERMINAL operation (module-a-auth-terminal-initialization.md §14 Ruling 3) — combined in a single Security Requirement Object so both are conjunctively required.'}
  parameters:
    PageParam:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPageParam:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    FromParam:
      name: from
      in: query
      description: Inclusive start of a date range (YYYY-MM-DD)
      schema: {type: string, format: date}
    ToParam:
      name: to
      in: query
      description: Inclusive end of a date range (YYYY-MM-DD)
      schema: {type: string, format: date}
    AcceptFormatHeader:
      name: Accept
      in: header
      description: application/json (default) or text/csv for CSV export
      schema:
        type: string
        enum: [application/json, text/csv]
        default: application/json
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated UUIDv4, scoped to (authenticated terminal, key) per ADR-010. The terminal component is resolved server-side from the enrolled terminal credential, never from this header or the request body. Reused across retries of the same attempt; never reused for a genuinely new attempt.'
      schema: {type: string, format: uuid, example: 0f3c9b1a-6e2d-4c7a-9a2e-1b4d5f6a7c8b}
    StockCountId:
      name: stockCountId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TerminalIdPath:
      name: terminalId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SaleIdPath:
      name: saleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VoidIdPath:
      name: voidId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RefundIdPath:
      name: refundId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InvoiceIdPath:
      name: invoiceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ShiftIdPath:
      name: shiftId
      in: path
      required: true
      schema: {type: string, format: uuid}
    FiscalDayIdPath:
      name: fiscalDayId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: BAD_REQUEST — malformed request / protocol error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: AUTHENTICATION_REQUIRED
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: AUTHORIZATION_DENIED or TERMINAL_NOT_ENROLLED/TERMINAL_REVOKED
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Current-resource-state conflict, concurrency conflict, or idempotency-key reuse with a different payload
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: Structurally valid request containing invalid field/domain input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReportOk:
      description: Report result (JSON by default; text/csv if requested via Accept)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReportResult'}
        text/csv:
          schema: {type: string, format: binary}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, description: Stable machine-readable code — see error-catalog.md}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            request_id: {type: string}
    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        last_page: {type: integer}
    PaginatedResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    Money: {type: string, description: 'Decimal string, always exactly 2 places, never a binary float. Sized for a single transaction/line/ledger amount (matches the NUMERIC(12,2) storage decision in architecture.md §3.1) — do not reuse this schema for a lifetime/accumulated total; see AccumulatedMoney for that.', pattern: '^-?\d+\.\d{2}$', example: '1250.50'}
    AccumulatedMoney: {type: string, description: 'Decimal string, always exactly 2 places — used specifically for cumulative/lifetime fiscal totals (e.g. ZReading''s accumulated grand total sales) where RMO 24-2023 requires at least 12 digits of capacity inclusive of the 2 decimal places (i.e. at least 10 integer digits; the floor is exercised by the 9999999999.99 boundary test). Corrected in Stage 4 remediation pass 3: this schema previously claimed "no artificial digit cap," but that let the contract accept values the frozen NUMERIC(18,2) storage decision (architecture.md §3.1) cannot persist. The pattern now caps at exactly NUMERIC(18,2)''s own maximum — 16 integer digits + 2 fractional digits, i.e. up to 9999999999999999.99 — so the contract can never promise a value the database is guaranteed to reject. This remains a schema distinct from Money (which is capped far lower, at NUMERIC(12,2)) so a future per-transaction constraint tightened on Money can never be silently inherited by an accumulated total, and vice versa.

        ', pattern: '^(?:0|[1-9][0-9]{0,15})\.[0-9]{2}$', example: '9999999999999999.99'}
    Quantity: {type: string, description: 'Decimal string, up to 3 places (Stage 2 Quantity value object, NUMERIC(10,3)). Example "1.000" or "0.500".', pattern: '^\d+(\.\d{1,3})?$', example: '1.000'}
    TaxClassification:
      type: string
      enum: [VATABLE, VAT_EXEMPT, ZERO_RATED, NON_VAT]
    TaxRegistrationType:
      type: string
      enum: [VAT, NON_VAT]
    PaymentMethod:
      type: string
      enum: [CASH, GCASH, MAYA, CARD, OTHER]
    SaleStatus:
      type: string
      enum: [COMPLETED, VOIDED, PARTIALLY_REFUNDED, REFUNDED]
    StockMovementType:
      type: string
      enum: [OPENING_STOCK, PURCHASE_RECEIPT, SALE, SALE_RETURN, STOCK_ADJUSTMENT_IN, STOCK_ADJUSTMENT_OUT, DAMAGE, EXPIRED, TRANSFER_IN, TRANSFER_OUT]
    RefundDisposition:
      type: string
      enum: [RETURN_TO_STOCK, DAMAGED, EXPIRED, DISPOSED]
    ElectronicJournalEventType:
      type: string
      description: Matches Stage 2's electronic_journal_entry.event_type catalog (domain-model.md §2.10) exactly.
      enum: [INVOICE, VOID, REFUND, X_READING, Z_READING, SHIFT_OPENED, SHIFT_CLOSED, CASH_IN, CASH_OUT, STOCK_ADJUSTED]
    TerminalStatus:
      type: string
      enum: [ACTIVE, INACTIVE, DECOMMISSIONED]
    UserRole:
      type: string
      enum: [ADMIN, MANAGER, CASHIER]
    Capability:
      type: string
      description: 'The full Stage 2 capability catalog (domain-model.md §2.2), including the six additions synced back into Stage 2 during Stage 4 remediation pass 2 (2026-09-16) — CATALOG_MANAGE, AUDIT_VIEW, JOURNAL_VIEW, USER_MANAGE, TERMINAL_MANAGE, FISCAL_CONFIGURATION_MANAGE — so this enum and Stage 2''s canonical list never drift again. This is a fixed enum of string constants, not a dynamic/configurable permission system — see api-design.md §4 for the role→capability mapping and rationale.

        '
      enum: [SALE_VOID, SALE_VOID_APPROVE, SALE_REFUND, SALE_REFUND_APPROVE, PRICE_OVERRIDE, DISCOUNT_OVERRIDE, STOCK_ADJUST, CASH_OUT, REPORT_VIEW, STORE_SETTINGS_MANAGE, FISCAL_DAY_CLOSE, CATALOG_MANAGE, AUDIT_VIEW, JOURNAL_VIEW, USER_MANAGE, TERMINAL_MANAGE, FISCAL_CONFIGURATION_MANAGE]
    UserSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/Capability'}
        active: {type: boolean}
    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        password: {type: string, format: password, writeOnly: true}
    TerminalEnrollmentToken:
      type: object
      properties:
        token: {type: string}
        terminal_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    TerminalSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        terminal_code: {type: string}
        status: {$ref: '#/components/schemas/TerminalStatus'}
        activated_at: {type: string, format: date-time}
    Category:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Brand:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    ProductBarcode:
      description: Stage 26. An alternate barcode of a product; the product's own barcode is Product.barcode.
      type: object
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        barcode: {type: string}
        created_at: {type: string, format: date-time}
    Product:
      type: object
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        barcode:
          anyOf:
          - {type: string}
          - {type: 'null'}
        name: {type: string}
        description:
          anyOf:
          - {type: string}
          - {type: 'null'}
        category_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        brand_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        unit_of_measure: {type: string}
        cost: {$ref: '#/components/schemas/Money'}
        selling_price: {$ref: '#/components/schemas/Money'}
        tax_class: {$ref: '#/components/schemas/TaxClassification'}
        track_inventory: {type: boolean}
        reorder_level: {type: integer}
        active: {type: boolean}
        note: {type: string, readOnly: true, description: 'selling_price/tax_class here are current catalog values for cashier preview only — never authoritative for a historical sale_item, which carries its own immutable snapshot.'}
    ProductInput:
      type: object
      required: [sku, name, unit_of_measure, selling_price, tax_class]
      properties:
        sku: {type: string}
        barcode:
          anyOf:
          - {type: string}
          - {type: 'null'}
        name: {type: string}
        description:
          anyOf:
          - {type: string}
          - {type: 'null'}
        category_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        brand_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        unit_of_measure: {type: string}
        cost: {$ref: '#/components/schemas/Money'}
        selling_price: {$ref: '#/components/schemas/Money'}
        tax_class: {$ref: '#/components/schemas/TaxClassification'}
        track_inventory: {type: boolean, default: true}
        reorder_level: {type: integer, default: 0}
    ImportResult:
      type: object
      properties:
        created: {type: integer}
        updated: {type: integer}
        failed: {type: integer}
        errors:
          type: array
          items:
            type: object
            properties:
              row: {type: integer}
              message: {type: string}
    StockBalance:
      type: object
      properties:
        product_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        quantity_on_hand: {$ref: '#/components/schemas/Quantity'}
        updated_at: {type: string, format: date-time}
    StockCountStatus:
      type: string
      enum: [OPEN, POSTED, CANCELLED]
      description: Stage 25. OPEN counts can be edited, posted or cancelled; POSTED and CANCELLED are final.
    StockCount:
      description: 'Stage 25. The list omits lines and summary and carries lines_count; the detail (stockCountGet, and what the write operations return) carries both.'
      type: object
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        location_name: {type: string}
        status: {$ref: '#/components/schemas/StockCountStatus'}
        note:
          anyOf:
          - {type: string}
          - {type: 'null'}
        created_by: {type: string, format: uuid}
        posted_by:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        posted_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
        cancelled_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        lines_count: {type: integer}
        summary:
          type: object
          description: What posting does (or did). units_over is stock found beyond the books, units_short is stock the books had that was not found.
          properties:
            lines_counted: {type: integer}
            lines_with_variance: {type: integer}
            units_over: {$ref: '#/components/schemas/Quantity'}
            units_short: {$ref: '#/components/schemas/Quantity'}
        lines:
          type: array
          items: {$ref: '#/components/schemas/StockCountLine'}
    StockCountLine:
      type: object
      properties:
        product_id: {type: string, format: uuid}
        sku: {type: string}
        product_name: {type: string}
        counted_quantity: {$ref: '#/components/schemas/Quantity'}
        expected_quantity:
          description: What the ledger said was on hand when this line was recorded; may be negative.
          type: string
        variance:
          description: counted_quantity minus expected_quantity, signed. Negative means stock the books had was not found.
          type: string
        counted_by: {type: string, format: uuid}
        counted_at: {type: string, format: date-time}
        stock_movement_id:
          description: The adjustment this line produced once the count was posted; null before posting and for a line with no variance.
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
    StockTransfer:
      description: 'Stage 25. The list omits lines and carries lines_count; the detail carries the lines.'
      type: object
      properties:
        id: {type: string, format: uuid}
        from_location_id: {type: string, format: uuid}
        from_location_name: {type: string}
        to_location_id: {type: string, format: uuid}
        to_location_name: {type: string}
        note:
          anyOf:
          - {type: string}
          - {type: 'null'}
        terminal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        lines_count: {type: integer}
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string, format: uuid}
              sku: {type: string}
              product_name: {type: string}
              quantity: {$ref: '#/components/schemas/Quantity'}
    StockMovement:
      type: object
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        terminal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        movement_type: {$ref: '#/components/schemas/StockMovementType'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        reference_type:
          anyOf:
          - {type: string}
          - {type: 'null'}
        reference_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        reason:
          anyOf:
          - {type: string}
          - {type: 'null'}
        unit_cost: {$ref: '#/components/schemas/Money'}
        created_by: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
    TaxSummary:
      type: object
      description: 'Preserved as separate values per current BIR invoicing guidance for mixed-category sales. `non_vat_sales` (added 2026-09-17, see domain-model.md 4a) carries the finalized consideration of a sale governed by a NON_VAT store registration; for a VAT-registered sale it is always "0.00", and for a NON_VAT-registered sale the other four fields are always "0.00" while non_vat_sales equals the sale grand total -- the two groups are never both nonzero on the same TaxSummary.'
      properties:
        taxable_sales: {$ref: '#/components/schemas/Money'}
        vat_exempt_sales: {$ref: '#/components/schemas/Money'}
        zero_rated_sales: {$ref: '#/components/schemas/Money'}
        vat_amount: {$ref: '#/components/schemas/Money'}
        non_vat_sales: {$ref: '#/components/schemas/Money'}
    SaleItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {$ref: '#/components/schemas/Quantity'}
        line_discount_amount: {$ref: '#/components/schemas/Money'}
        order_discount_eligible: {type: boolean, default: true}
        override_reason: {type: string, description: Required when a PRICE_OVERRIDE/DISCOUNT_OVERRIDE capability check applies}
    PaymentInput:
      type: object
      required: [method, amount]
      properties:
        method: {$ref: '#/components/schemas/PaymentMethod'}
        amount: {$ref: '#/components/schemas/Money'}
        external_reference:
          anyOf:
          - {type: string}
          - {type: 'null'}
    SaleFinalizeRequest:
      type: object
      required: [items, payments]
      properties:
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SaleItemInput'}
        order_level_discount_amount: {$ref: '#/components/schemas/Money'}
        payments:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PaymentInput'}
        buyer_name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        buyer_address:
          anyOf:
          - {type: string}
          - {type: 'null'}
        buyer_tin:
          anyOf:
          - {type: string}
          - {type: 'null'}
        buyer_business_style:
          anyOf:
          - {type: string}
          - {type: 'null'}
        client_expected_grand_total:
          allOf:
          - {$ref: '#/components/schemas/Money'}
          description: 'NON-AUTHORITATIVE. Optional client-computed preview total, compared server-side only to surface a UI mismatch warning; the server''s own recomputation always governs the finalized Sale (Stage 2 invariant #4; architecture.md §46).

            '
    SaleItem:
      type: object
      description: Immutable per-line financial snapshot (Stage 2 domain-model.md §2.7).
      properties:
        id: {type: string, format: uuid}
        line_number: {type: integer}
        product_id: {type: string, format: uuid}
        product_name_snapshot: {type: string}
        sku_snapshot: {type: string}
        barcode_snapshot:
          anyOf:
          - {type: string}
          - {type: 'null'}
        unit_of_measure_snapshot: {type: string}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit_price_snapshot: {$ref: '#/components/schemas/Money'}
        gross_line_amount: {$ref: '#/components/schemas/Money'}
        line_discount_amount: {$ref: '#/components/schemas/Money'}
        order_discount_eligible: {type: boolean}
        allocated_order_discount_amount: {$ref: '#/components/schemas/Money'}
        net_line_amount: {$ref: '#/components/schemas/Money'}
        tax_classification_snapshot: {$ref: '#/components/schemas/TaxClassification'}
        tax_rate_snapshot: {type: string}
        taxable_base: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
    Payment:
      type: object
      properties:
        id: {type: string, format: uuid}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        amount: {$ref: '#/components/schemas/Money'}
        reference_note:
          anyOf:
          - {type: string}
          - {type: 'null'}
        recorded_at: {type: string, format: date-time}
    SaleSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        uuid: {type: string, format: uuid}
        transaction_number: {type: string, description: 'TindaFlow''s internal human-readable identifier — a distinct namespace from invoice_number, never interchangeable (RMO 24-2023 series-separation requirement).'}
        invoice_number:
          anyOf:
          - {type: string, description: 'The accountable fiscal serial itself — digits only, minimum six, leading zeroes preserved (RMO 24-2023). Deliberately excludes any invoice_series.prefix/series_code (Stage 2 domain-model.md §2.6 already keeps those as separate invoice_series fields); a future need to display a series prefix alongside this serial must add an explicit separate field, never concatenate it into this one. See InvoiceSummary.invoice_number for the full rationale.', pattern: '^[0-9]{6,}$', example: '000103'}
          - {type: 'null'}
        store_id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        fiscal_day_id: {type: string, format: uuid}
        shift_id: {type: string, format: uuid}
        cashier_id: {type: string, format: uuid}
        sold_at: {type: string, format: date-time}
        grand_total: {$ref: '#/components/schemas/Money'}
        status: {$ref: '#/components/schemas/SaleStatus'}
    SaleDetail:
      allOf:
      - {$ref: '#/components/schemas/SaleSummary'}
      - type: object
        properties:
          subtotal: {$ref: '#/components/schemas/Money'}
          order_level_discount_amount: {$ref: '#/components/schemas/Money'}
          discount_total: {$ref: '#/components/schemas/Money'}
          tax_summary: {$ref: '#/components/schemas/TaxSummary'}
          idempotency_key:
            anyOf:
            - {type: string, format: uuid}
            - {type: 'null'}
          buyer_name:
            anyOf:
            - {type: string}
            - {type: 'null'}
          buyer_address:
            anyOf:
            - {type: string}
            - {type: 'null'}
          buyer_tin:
            anyOf:
            - {type: string}
            - {type: 'null'}
          buyer_business_style:
            anyOf:
            - {type: string}
            - {type: 'null'}
          items:
            type: array
            items: {$ref: '#/components/schemas/SaleItem'}
          payments:
            type: array
            items: {$ref: '#/components/schemas/Payment'}
          amount_tendered: {$ref: '#/components/schemas/Money'}
          change: {$ref: '#/components/schemas/Money'}
          invoice: {$ref: '#/components/schemas/InvoiceSummary'}
          void:
            anyOf:
            - allOf:
              - {$ref: '#/components/schemas/VoidSummary'}
            - {type: 'null'}
          refunds:
            type: array
            items: {$ref: '#/components/schemas/RefundSummary'}
    InvoiceSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        invoice_number: {type: string, description: 'The accountable fiscal serial (invoice_series.current_number), always a STRING — never modeled as integer/number, because RMO 24-2023 requires a minimum six-digit running serial with leading zeroes preserved (e.g. "000001", "000103"). A JSON number would silently drop leading zeroes; a string never does. Digits only — no series prefix/code is embedded here, deliberately: Stage 2 domain-model.md §2.6 already models invoice_series.prefix/series_code as fields distinct from current_number, so this field represents the serial alone. If a future release needs to display a prefixed/composed invoice number, that must be an explicit additional field (e.g. display_invoice_number), never a looser pattern on this one. Never interchangeable with Sale.transaction_number, which is a separate internal identifier drawn from a distinct namespace/series (RMO 24-2023''s series-separation requirement) and may carry its own human-readable prefix.

            ', example: '000103', pattern: '^[0-9]{6,}$'}
        issued_at: {type: string, format: date-time}
        schema_version: {type: integer}
    InvoiceDetail:
      allOf:
      - {$ref: '#/components/schemas/InvoiceSummary'}
      - type: object
        properties:
          sale_id: {type: string, format: uuid}
          invoice_series_id: {type: string, format: uuid}
          terminal_id: {type: string, format: uuid}
          fiscal_installation_id:
            anyOf:
            - {type: string, format: uuid}
            - {type: 'null'}
          seller_registered_name_snapshot: {type: string}
          tax_registration_type_snapshot: {$ref: '#/components/schemas/TaxRegistrationType'}
          terminal_code_snapshot: {type: string}
          render_html: {type: string, description: 'Server-rendered, print-optimized HTML for the 80mm thermal layout, produced by the versioned renderer matching schema_version (ADR-006). Rendered exclusively from invoice_snapshot_json. Carries no reprint marker of its own — GET /invoices/{invoiceId} always renders the plain original document; see InvoiceReprintResult for the watermarked reprint rendering.'}
    InvoiceReprintResult:
      type: object
      description: 'The response shape for POST /invoices/{invoiceId}/reprints only. An Invoice is an immutable resource that may be reprinted any number of times (Stage 2 invariant #11 — the invoice_number/invoice_snapshot_json/issued_at never change), so "is this a reprint, and when" is a property of one reprint occurrence, never a property of the Invoice resource itself — it does not appear on InvoiceDetail. GET /invoices/{invoiceId} always returns the plain InvoiceDetail with no knowledge that a reprint ever happened.'
      properties:
        reprint_event_id: {type: string, format: uuid, description: 'Identifies this specific reprint occurrence — the id of the INVOICE_REPRINTED audit_event row created for this call (Stage 2 §2.11; no new Stage 2 entity was introduced for this). Distinct on every call, including idempotent retries that return the original stored result.'}
        invoice: {$ref: '#/components/schemas/InvoiceDetail'}
        is_reprint: {type: boolean, enum: [true], description: 'Always true — this schema only ever describes a reprint occurrence. render_html inside `invoice` carries a visible "REPRINT"/"COPY" watermark whenever it was produced via this endpoint (ADR-007), even though the underlying `invoice` payload is otherwise identical to the original.'}
        reprinted_at: {type: string, format: date-time, description: 'The date/time of this specific reprint event — never the original invoice.issued_at.'}
        requested_by: {type: string, format: uuid, description: 'The authenticated user who performed this reprint (resolved server-side from the session, never client-supplied).'}
    VoidSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED, VOIDED]
        reason: {type: string}
        requested_by: {type: string, format: uuid}
        approved_by:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        requested_at: {type: string, format: date-time}
        resolved_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
        terminal_id:
          anyOf:
          - {type: string, format: uuid, description: 'Processing context, populated at execution — independent of the original sale''s terminal_id (Stage 2 invariant'}
          - {type: 'null'}
        fiscal_day_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        shift_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
    VoidResult:
      allOf:
      - {$ref: '#/components/schemas/VoidSummary'}
      - type: object
        properties:
          sale: {$ref: '#/components/schemas/SaleSummary'}
    RefundItemInput:
      type: object
      required: [sale_item_id, quantity, disposition]
      properties:
        sale_item_id: {type: string, format: uuid}
        quantity: {$ref: '#/components/schemas/Quantity'}
        disposition: {$ref: '#/components/schemas/RefundDisposition'}
    RefundSettlementInput:
      type: object
      required: [payment_method, amount]
      properties:
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        amount: {$ref: '#/components/schemas/Money'}
        external_reference:
          anyOf:
          - {type: string}
          - {type: 'null'}
    RefundRequest:
      type: object
      required: [items, settlements, reason]
      properties:
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RefundItemInput'}
        settlements:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RefundSettlementInput'}
        reason: {type: string, minLength: 1}
    RefundItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        sale_item_id: {type: string, format: uuid}
        quantity_returned: {$ref: '#/components/schemas/Quantity'}
        disposition: {$ref: '#/components/schemas/RefundDisposition'}
        unit_refund_amount: {$ref: '#/components/schemas/Money'}
    RefundSettlement:
      type: object
      properties:
        id: {type: string, format: uuid}
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        amount: {$ref: '#/components/schemas/Money'}
        processed_at: {type: string, format: date-time}
        external_reference:
          anyOf:
          - {type: string}
          - {type: 'null'}
    RefundSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        status:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED, COMPLETED]
        reason: {type: string}
        requested_by: {type: string, format: uuid, description: 'Added Stage 4 remediation pass 4 — the authenticated user who created this refund request. Symmetric with VoidSummary.requested_by; the original draft omitted it (VoidSummary always had it), a gap only surfaced when refundApprove/refundReject needed to state explicitly who resolved a request they did not create.'}
        approved_by:
          anyOf:
          - {type: string, format: uuid, description: 'The user who resolved this refund — via approve OR reject (exactly one ever applies to a given REQUESTED refund). Null while still REQUESTED. Named approved_by for symmetry with VoidSummary even when the actual resolution was a rejection, matching VoidSummary''s own established convention.'}
          - {type: 'null'}
        refund_total: {$ref: '#/components/schemas/Money'}
        requested_at: {type: string, format: date-time, description: 'Added Stage 4 remediation pass 4, symmetric with VoidSummary.requested_at — this request''s own creation timestamp, distinct from refunded_at/resolved_at below.'}
        resolved_at:
          anyOf:
          - {type: string, format: date-time, description: 'Added Stage 4 remediation pass 4, symmetric with VoidSummary.resolved_at — set once, whenever approve OR reject resolves this refund (whichever happens). Null while still REQUESTED.'}
          - {type: 'null'}
        refunded_at:
          anyOf:
          - {type: string, format: date-time, description: 'Set only on the COMPLETED outcome (equal to resolved_at in that case) — kept as its own field, distinct from resolved_at, specifically so a REJECTED refund is never described as having a "refunded_at" moment it never had.'}
          - {type: 'null'}
        terminal_id:
          anyOf:
          - {type: string, format: uuid, description: 'Processing context — may differ from the original sale''s terminal/fiscal_day (e.g. a Friday refund against a Monday sale), per Stage 2 invariant'}
          - {type: 'null'}
        fiscal_day_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        shift_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
    RefundResult:
      allOf:
      - {$ref: '#/components/schemas/RefundSummary'}
      - type: object
        properties:
          items:
            type: array
            items: {$ref: '#/components/schemas/RefundItem'}
          settlements:
            type: array
            items: {$ref: '#/components/schemas/RefundSettlement'}
          sale: {$ref: '#/components/schemas/SaleSummary'}
          remaining_refundable:
            type: array
            description: Non-authoritative convenience projection of remaining refundable quantity/amount per sale_item, for UI display only — always re-derived server-side on the next refund attempt, never trusted from a prior response.
            items:
              type: object
              properties:
                sale_item_id: {type: string, format: uuid}
                remaining_quantity: {$ref: '#/components/schemas/Quantity'}
                remaining_amount: {$ref: '#/components/schemas/Money'}
    CashMovement:
      type: object
      properties:
        id: {type: string, format: uuid}
        shift_id: {type: string, format: uuid}
        type:
          type: string
          enum: [CASH_IN, CASH_OUT]
        amount: {$ref: '#/components/schemas/Money'}
        reason: {type: string}
        authorized_by:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        created_at: {type: string, format: date-time}
    Shift:
      type: object
      properties:
        id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        fiscal_day_id: {type: string, format: uuid}
        cashier_id: {type: string, format: uuid}
        opening_cash: {$ref: '#/components/schemas/Money'}
        opened_at: {type: string, format: date-time}
        status:
          type: string
          enum: [OPEN, CLOSED]
        expected_cash:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        declared_cash:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        variance:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        cash_sales:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        non_cash_sales:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        refunds_total:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        cash_in_total:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        cash_out_total:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        closed_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
    ShiftOpenResult:
      type: object
      properties:
        shift: {$ref: '#/components/schemas/Shift'}
        fiscal_day: {$ref: '#/components/schemas/FiscalDay'}
        fiscal_day_was_opened: {type: boolean, description: True if this request also opened a new FiscalDay (V1 auto-open-on-first-shift policy — see api-design.md).}
    ShiftCloseResult:
      type: object
      properties:
        shift: {$ref: '#/components/schemas/Shift'}
        x_reading: {$ref: '#/components/schemas/XReading'}
    XReadingTotalsSnapshot:
      type: object
      description: 'Cashier''s Accountability / End-of-Shift Report figures (RMO 24-2023). Deliberately narrower than ZReadingTotalsSnapshot — X-Reading is a drawer/shift accountability document, not a fiscal closure document; it carries no accumulated-grand-total or Z/reset-counter fields (those belong to Z-Reading only). All values are computed server-side from Sale/Payment/CashMovement records for this shift — never accepted from the browser. Reviewed 2026-09-17 alongside the Stage 6A NON_VAT gap (domain-model.md 4a): this object intentionally carries no tax-category breakdown at all (no taxable_sales/vat_exempt_sales/zero_rated_sales/vat_amount either) — it reports cash-drawer accountability only, keyed by payment method, never by tax classification or registration type. `non_vat_sales` is therefore deliberately not added here; it belongs on ZReadingTotalsSnapshot, the fiscal-closure-scoped object.

        '
      required: [opening_cash, expected_cash, cash_sales, non_cash_sales, payment_breakdown, refunds_total, cash_in_total, cash_out_total, transaction_count]
      properties:
        opening_cash: {$ref: '#/components/schemas/Money'}
        expected_cash: {$ref: '#/components/schemas/Money'}
        cash_sales: {$ref: '#/components/schemas/Money'}
        non_cash_sales: {$ref: '#/components/schemas/Money'}
        payment_breakdown:
          type: object
          description: 'Keyed by PaymentMethod, e.g. {"CASH": "260.00", "GCASH": "200.00"}.'
          additionalProperties: {$ref: '#/components/schemas/Money'}
        refunds_total: {$ref: '#/components/schemas/Money'}
        cash_in_total: {$ref: '#/components/schemas/Money'}
        cash_out_total: {$ref: '#/components/schemas/Money'}
        variance:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
            description: Only present once the shift has closed (the closing X-Reading); null for an interim, on-demand reading.
          - {type: 'null'}
        transaction_count: {type: integer}
    XReading:
      type: object
      description: 'Immutable, append-only, generated accountability snapshot (Stage 2 invariant #41). A shift may have multiple management-requested XReadings in addition to the automatic one generated at shift close (Stage 2 §2.5, invariant #43) — generating an interim XReading never closes or resets the shift. Re-viewing/reprinting a previously generated XReading is a plain GET of this same resource (see shiftXReadingList) — it never creates a new row, since an X-Reading carries no BIR-mandated reprint-audit requirement of its own (unlike Invoice reprint, ADR-006).'
      properties:
        id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        shift_id: {type: string, format: uuid}
        cashier_id: {type: string, format: uuid}
        from_at: {type: string, format: date-time}
        to_at: {type: string, format: date-time}
        generated_at: {type: string, format: date-time}
        generated_by: {type: string, format: uuid}
        is_closing_reading: {type: boolean, description: 'True for the reading automatically generated at shift close; false for an on-demand, management-requested interim reading.'}
        totals_snapshot: {$ref: '#/components/schemas/XReadingTotalsSnapshot'}
    FiscalDay:
      type: object
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        opened_at: {type: string, format: date-time}
        closed_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
        status:
          type: string
          enum: [OPEN, CLOSED]
    FiscalDayCloseResult:
      type: object
      properties:
        fiscal_day: {$ref: '#/components/schemas/FiscalDay'}
        z_reading: {$ref: '#/components/schemas/ZReading'}
    ZReadingTotalsSnapshot:
      type: object
      description: 'End-of-Day Report figures (RMO 24-2023) — the fiscal-closure breakdown, distinct from XReadingTotalsSnapshot''s shift- accountability focus. All values are computed server-side from Sale/Payment/Void/Refund/CashMovement records for this fiscal day — never accepted from the browser (architecture.md §8/§46).

        '
      required: [accumulated_grand_total_sales_before, accumulated_grand_total_sales_after, gross_sales, taxable_sales, vat_exempt_sales, zero_rated_sales, vat_amount, non_vat_sales, payment_breakdown, void_total, refund_total, z_counter, reset_counter]
      properties:
        accumulated_grand_total_sales_before:
          allOf:
          - {$ref: '#/components/schemas/AccumulatedMoney'}
          description: This terminal's accumulated grand total sales immediately before this Z-Reading (RMO 24-2023's non-resettable running total).
        accumulated_grand_total_sales_after:
          allOf:
          - {$ref: '#/components/schemas/AccumulatedMoney'}
          description: This terminal's accumulated grand total sales immediately after this Z-Reading (accumulated_before + this day's gross_sales).
        gross_sales:
          allOf:
          - {$ref: '#/components/schemas/Money'}
          description: This fiscal day's completed (non-voided) sales total.
        taxable_sales: {$ref: '#/components/schemas/Money'}
        vat_exempt_sales: {$ref: '#/components/schemas/Money'}
        zero_rated_sales: {$ref: '#/components/schemas/Money'}
        vat_amount: {$ref: '#/components/schemas/Money'}
        non_vat_sales:
          allOf:
          - {$ref: '#/components/schemas/Money'}
          description: 'Added 2026-09-17 (Stage 6A NON_VAT gap, see domain-model.md 4a). "0.00" for a fiscal day closed under a VAT-registered store; equals this fiscal day''s gross_sales for a fiscal day closed under a NON_VAT-registered store, since a NON_VAT sale has no taxable_sales/vat_exempt_sales/zero_rated_sales/vat_amount contribution. Uses the same Money precision as its peer tax-category fields on this object, not AccumulatedMoney -- only the running accumulated-grand-total fields use that type.'
        payment_breakdown:
          type: object
          description: 'Keyed by PaymentMethod, e.g. {"CASH": "260.00", "GCASH": "200.00"}.'
          additionalProperties: {$ref: '#/components/schemas/Money'}
        void_total:
          allOf:
          - {$ref: '#/components/schemas/Money'}
          description: Sum of grand_total for sales voided on this fiscal day, reported for audit transparency — excluded from gross_sales.
        refund_total: {$ref: '#/components/schemas/Money'}
        z_counter: {type: integer, description: 'This terminal''s running Z-Reading sequence number (RMO 24-2023 Z Counter requirement) — increments by exactly one per closure, never reused.'}
        reset_counter: {type: integer, default: 0, description: 'Number of times the accumulated grand total has been reset. TindaFlow''s architecture provides no user-facing reset function (architecture.md §4/Stage 2 invariant #4 on fiscal_day/z_reading design) — this field is expected to remain 0 for the life of a terminal and exists to satisfy RMO 24-2023''s accreditation-demonstration checklist item, not because a reset path exists in the product.

            '}
    ZReading:
      type: object
      description: 'Immutable, append-only, generated fiscal-closure snapshot. Exactly one ZReading exists per FiscalDay, created atomically with its OPEN→CLOSED transition (Stage 2 invariant #42) — there is no "regenerate Z-Reading" operation. Historical retrieval (fiscalDayZReadingGet) always returns the stored totals_snapshot exactly as generated, never recomputed under today''s configuration.

        '
      properties:
        id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        fiscal_day_id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        from_at: {type: string, format: date-time}
        to_at: {type: string, format: date-time}
        generated_at: {type: string, format: date-time}
        generated_by: {type: string, format: uuid}
        totals_snapshot: {$ref: '#/components/schemas/ZReadingTotalsSnapshot'}
    ReportResult:
      type: object
      properties:
        generated_at: {type: string, format: date-time}
        filters_applied: {type: object, additionalProperties: true}
        rows:
          type: array
          items: {type: object, additionalProperties: true}
        summary: {type: object, additionalProperties: true, description: 'Report-specific aggregate totals (e.g. grand_total, vat_amount) — always Money-schema decimal strings where monetary.'}
    StoreSettings:
      type: object
      properties:
        business_name: {type: string}
        registered_name: {type: string}
        business_address: {type: string}
        tin: {type: string}
        branch_code:
          anyOf:
          - {type: string}
          - {type: 'null'}
        invoice_header:
          anyOf:
          - {type: string}
          - {type: 'null'}
        invoice_footer:
          anyOf:
          - {type: string}
          - {type: 'null'}
        telephone:
          anyOf:
          - {type: string}
          - {type: 'null'}
        email:
          anyOf:
          - {type: string}
          - {type: 'null'}
        current_tax_registration: {$ref: '#/components/schemas/TaxRegistration'}
    StoreSettingsInput:
      type: object
      properties:
        business_name: {type: string}
        registered_name: {type: string}
        business_address: {type: string}
        tin: {type: string}
        branch_code:
          anyOf:
          - {type: string}
          - {type: 'null'}
        invoice_header:
          anyOf:
          - {type: string}
          - {type: 'null'}
        invoice_footer:
          anyOf:
          - {type: string}
          - {type: 'null'}
        telephone:
          anyOf:
          - {type: string}
          - {type: 'null'}
        email:
          anyOf:
          - {type: string}
          - {type: 'null'}
    TaxRegistration:
      type: object
      properties:
        id: {type: string, format: uuid}
        registration_type: {$ref: '#/components/schemas/TaxRegistrationType'}
        effective_from: {type: string, format: date}
        effective_to:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
    Accreditation:
      type: object
      description: 'Supplier/software-level accreditation status — independently effective-dated from PermitToUse per ADR-009 (RMC 72-2025: an expiring Certificate of Accreditation does not itself expire the taxpayer''s PTU). All fields nullable/empty until a real accreditation exists — entering values here does not itself constitute BIR accreditation.

        '
      properties:
        number:
          anyOf:
          - {type: string}
          - {type: 'null'}
        date:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
        effective_from:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
        effective_to:
          anyOf:
          - {type: string, format: date, description: Null = currently in effect}
          - {type: 'null'}
    PermitToUse:
      type: object
      description: 'Taxpayer/installation-level Permit to Use status — independently effective-dated from Accreditation per ADR-009. Carries the Machine Identification Number (MIN), which is a PTU-lifecycle concept per domain-model.md §2.1, not an accreditation-lifecycle one.'
      properties:
        number:
          anyOf:
          - {type: string}
          - {type: 'null'}
        min:
          anyOf:
          - {type: string, description: Machine Identification Number}
          - {type: 'null'}
        date:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
        effective_from:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
        effective_to:
          anyOf:
          - {type: string, format: date, description: Null = currently in effect}
          - {type: 'null'}
    FiscalInstallationInput:
      type: object
      required: [deployment_model, software_version]
      properties:
        deployment_model:
          type: string
          enum: [STANDALONE, SERVER_CONNECTED]
        machine_serial_number:
          anyOf:
          - {type: string}
          - {type: 'null'}
        software_version: {type: string}
        accreditation:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Accreditation'}
          - {type: 'null'}
        permit_to_use:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/PermitToUse'}
          - {type: 'null'}
    FiscalInstallation:
      description: 'Accreditation and PermitToUse are represented as distinct nested objects, never collapsed into one generic "compliance_status" field — they are independent lifecycles (ADR-009/BIR-012) even though V1''s underlying database representation (two column-pairs vs. two child tables) remains a Stage 5 decision that this HTTP shape does not need to anticipate further.

        '
      allOf:
      - {$ref: '#/components/schemas/FiscalInstallationInput'}
