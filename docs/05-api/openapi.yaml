          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ---------------------------------------------------- Void approval (new, pass 3)
  /voids:
    get:
      operationId: voidList
      tags: [Sales]
      summary: 'List Voids (added remediation pass 3 — backs the Stage 1 sitemap''s /back-office/void-refund/approvals screen)'
      description: 'The only way to discover a REQUESTED void pending approval — sale.status stays COMPLETED while its void is REQUESTED (state-machines.md §1/§2), so a REQUESTED void is never visible through GET /sales'' own status filter. Visibility mirrors GET /sales/{saleId} (any authenticated session, no dedicated capability), consistent with V1 having no per-user data siloing beyond store scope.'
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: status
        in: query
        description: Filter to a single lifecycle status, e.g. ?status=REQUESTED for the pending-approval queue.
        schema: {type: string, enum: [REQUESTED, APPROVED, REJECTED, VOIDED]}
      - name: sale_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated voids
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/VoidSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /voids/{voidId}:
    get:
      operationId: voidGet
      tags: [Sales]
      summary: Get full Void detail (backs the Stage 1 sitemap's /back-office/void-refund/:id screen)
      parameters:
      - {$ref: '#/components/parameters/VoidIdPath'}
      responses:
        '200':
          description: Void detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VoidResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /voids/{voidId}/approve:
    post:
      operationId: voidApprove
      tags: [Sales]
      x-capability: SALE_VOID_APPROVE
      summary: 'Approve a REQUESTED Void — this IS the fiscal execution point, not a permission grant (state-machines.md §2)'
      description: 'CONFIRMED FISCAL EXECUTION COMMAND, not mere authorization: Stage 2''s void state diagram shows APPROVED immediately followed by system-executed reversal ("APPROVED --> VOIDED: system executes reversal"), with no separately-persisted resting state between them, and invariant #24 names exactly three void audit events — SALE_VOID_REQUESTED, SALE_VOIDED, SALE_VOID_REJECTED — with no fourth "SALE_VOID_APPROVED" event, confirming Stage 2 never treats APPROVED as its own independently-loggable, fiscally-effective moment. This operation therefore performs REQUESTED → APPROVED → VOIDED atomically, in one database transaction, exactly mirroring what already happens inline in POST /sales/{saleId}/void when the original requester holds SALE_VOID_APPROVE. On success, this single transaction: resolves the authenticated approver from the session (never client-supplied); resolves the enrolled executing terminal (ADR-011) and its own currently-OPEN fiscal_day/shift — independent of the original requester''s or the original sale''s terminal/shift/fiscal_day (Stage 2 amendment pass 3; invariants #67/#69) — failing the call (see below) if none is open right now; locks and re-validates the referenced void row is still REQUESTED and the originating sale still meets void eligibility (Stage 2 §2.8''s five conditions, re-checked, not read from the original request-time result); creates the full-quantity SALE_RETURN stock_movement per sale_item (invariant #22); populates void.terminal_id/fiscal_day_id/shift_id from the executing context; transitions sale.status to VOIDED; and writes a single SALE_VOIDED audit_event plus its corresponding electronic_journal_entry (event_type=VOID) — all committed atomically, or none of it. A REQUESTED-time processing context is never reused: this call always resolves and uses the context that exists right now, at execution, never a context captured or frozen when the void was originally requested. FAILED APPROVAL IS NOT AUTOMATIC REJECTION (Stage 2 amendment pass 4, correcting state-machines.md §2''s previous wording): if the void''s eligibility no longer holds at execution time (any of the five request-time conditions, e.g. the originating sale''s own fiscal_day has since Z-closed), this call fails with `409 SALE_NOT_VOIDABLE` and the void row is left completely unchanged — still REQUESTED, no stock_movement, no audit_event, no electronic_journal_entry, no processing-context fields populated. Likewise, if the executing terminal itself has no open fiscal_day/shift right now, this call fails with `409 FISCAL_DAY_CLOSED`/`SHIFT_NOT_OPEN` and the void stays REQUESTED, unchanged — never silently reattributed to whatever context happens to be open. A failed execution attempt is never itself an authorized decision that the request should not proceed; only an explicit call to POST /voids/{voidId}/reject (a human, capability-holding decision) or a later, successful call to this same endpoint ever resolves a REQUESTED void. The 409 below for VOID_NOT_PENDING_APPROVAL is reserved for a structurally invalid call — the void was not in REQUESTED status when this call arrived (already VOIDED/REJECTED by a concurrent request) — which, like every other failure path here, never touches the ledger. Idempotent (ADR-010), with an important refinement for failure paths: a retry with the same Idempotency-Key after a SUCCESSFUL execution returns the original VOIDED result verbatim, never re-executing the reversal. A retry after a FAILED attempt (409, no fiscal mutation committed) is different: no idempotency_record is durably resolved for an attempt that committed nothing, so the SAME Idempotency-Key MAY be reused for a fresh attempt once the caller corrects the precondition (e.g. opens a shift) — this is treated as a new attempt of the same logical operation, not a cached-failure replay, and a new key is not required.'
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/VoidIdPath'}
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      responses:
        '200':
          description: Void executed — status is VOIDED. A failed attempt never reaches this response; see 409 below.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VoidResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: VOID_NOT_PENDING_APPROVAL (already resolved by a concurrent request) — or SALE_NOT_VOIDABLE (eligibility no longer holds, e.g. the originating sale's fiscal_day has since closed) — or FISCAL_DAY_CLOSED/SHIFT_NOT_OPEN (the executing terminal has no open fiscal_day/shift right now). In every case the void remains REQUESTED, unchanged; the same Idempotency-Key may be reused for a fresh attempt once the underlying condition is corrected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /voids/{voidId}/reject:
    post:
      operationId: voidReject
      tags: [Sales]
      x-capability: SALE_VOID_APPROVE
      summary: Reject a REQUESTED Void — a human decision, never a fiscal mutation (state-machines.md §2)
      description: 'NOT a fiscal mutation, by design: REQUESTED → REJECTED only. Resolves the authenticated rejecting actor from the session (never client-supplied) and persists reason/rejected_at/rejected_by (via approved_by/resolved_at on VoidSummary — the same fields approve uses, since exactly one of the two ever resolves a REQUESTED void). Never executes a reversal, never creates a stock_movement, never touches Sale (sale.status stays COMPLETED), and never touches invoice_series. Writes SALE_VOID_REJECTED to audit_event ONLY — never electronic_journal_entry, since a rejected void never becomes the fiscal fact the VOID journal event_type represents (see voidApprove''s description for the full reasoning). No processing-context fields (terminal_id/fiscal_day_id/shift_id) are populated on this path, because Stage 2 only defines those as being set during APPROVED → VOIDED execution — so, unlike approve, this operation does not require an enrolled terminal or an OPEN shift/fiscal_day; nothing in Stage 2 ties declining a request to the rejecting actor''s own processing context. Requires SALE_VOID_APPROVE — the same capability that can approve can decline. Idempotent (ADR-010): a retry with the same Idempotency-Key returns the original rejection result verbatim.'
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/VoidIdPath'}
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1}
      responses:
        '200':
          description: Void rejected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VoidResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: VOID_NOT_PENDING_APPROVAL — the void is no longer in REQUESTED status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
