      description: 'Session only. Each line remembers what the ledger expected at the moment it was recorded (expected_quantity), so posting corrects counted minus expected and sales made while people count are never overwritten. Counting a product again replaces its line and reads the expected quantity again. The request is all or nothing. Only tracked products of the store can be counted (an untracked product is VALIDATION_FAILED); zero is a valid count. Only an OPEN count can be changed (STOCK_COUNT_NOT_OPEN).'
