  /sales/{saleId}/void:
    post:
      operationId: saleVoid
      tags: [Sales]
      x-capability: SALE_VOID
      summary: Execute a Void (Stage 2 §2.8 — five-condition eligibility gate + processing-context precondition)
      description: 'No processing terminal/shift/fiscal_day field is accepted in the request body — those are resolved from the authenticated terminal context at execution (Stage 2 invariants #67–#69). Requires SALE_VOID capability. If the requester already holds SALE_VOID_APPROVE, the REQUESTED → APPROVED → VOIDED transitions all happen immediately within this same call (state-machines.md §2, "or immediate, if requester already holds SALE_VOID_APPROVE"). Otherwise the response reflects status REQUESTED, and the void remains pending until a separate actor calls POST /voids/{voidId}/approve or POST /voids/{voidId}/reject — see the Voids section below (added in remediation pass 3 to make that transition reachable).

        '
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/SaleIdPath'}
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1}
      responses:
        '201':
          description: Void executed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VoidResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /sales/{saleId}/refunds:
    post:
      operationId: saleRefund
      tags: [Sales]
      x-capability: SALE_REFUND
      summary: Finalize a Refund (Stage 2 §2.9 — full or partial)
      description: 'No authoritative refund totals are accepted from the client — the server derives remaining refundable quantity/consideration from the frozen sale_item snapshot (net_line_amount, DISC-004) and validates SUM(settlements.amount) equals the derived refund total (Stage 2 invariant #70). Processing terminal/shift/fiscal_day are resolved server-side, never from the request body (invariants #67–#69). If the requester already holds SALE_REFUND_APPROVE, the REQUESTED → APPROVED → COMPLETED transitions all happen immediately within this same call (state-machines.md §3). Otherwise the response reflects status REQUESTED — the requested items/settlements are recorded but not yet executed — and the refund remains pending until a separate actor calls POST /refunds/{refundId}/approve or POST /refunds/{refundId}/reject — see the Refunds section below (added in remediation pass 3 to make that transition reachable).'
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/SaleIdPath'}
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
