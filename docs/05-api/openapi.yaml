          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /refunds/{refundId}/approve:
    post:
      operationId: refundApprove
      tags: [Sales]
      x-capability: SALE_REFUND_APPROVE
      summary: 'Approve a REQUESTED Refund — this IS the fiscal execution point, not a permission grant (state-machines.md §3)'
      description: 'CONFIRMED FISCAL EXECUTION COMMAND, not mere authorization — same determination as voidApprove (see its description for the full frozen-text citation: state-machines.md''s APPROVED→COMPLETED arrow, no separately-persisted resting state, no distinct "SALE_REFUND_APPROVED" event name). Performs REQUESTED → APPROVED → COMPLETED atomically, in one database transaction. On success: resolves the authenticated approver from the session; resolves the enrolled executing terminal (ADR-011) and its own currently-OPEN fiscal_day/shift, independent of the original requester''s or original sale''s terminal/shift/fiscal_day (Stage 2 amendment pass 3; invariants #67/#69) — never the context that existed when the refund was originally requested; locks the referenced refund row and the referenced sale_item row(s), re-confirming the refund is still REQUESTED; **re-validates the cumulative quantity/amount cap against every refund_item that exists right now** (invariants #27/#28 — "checked server-side... never trusted from client input" applies at the moment rows are actually created, not only at the original request, precisely because a *different* refund against the same sale_item could have been approved in the interim); validates `SUM(settlements.amount)` still equals the derived refund total (invariant #70); creates `refund_item` rows (with disposition, from the values supplied at request time — never re-solicited here) and `refund_settlement` rows (from the settlement detail supplied at request time); creates a restocking `stock_movement` only for `RETURN_TO_STOCK` lines (invariant #30); recomputes `sale.status`; populates `refund.terminal_id`/`fiscal_day_id`/`shift_id` from the executing context; and writes a single fiscal-completion audit_event plus its corresponding `electronic_journal_entry` (event_type=REFUND) — all committed atomically, or none of it. FAILED APPROVAL IS NOT AUTOMATIC REJECTION, symmetric with voidApprove (Stage 2 amendment pass 4): if the originally-requested quantity/amount no longer fits (a concurrent refund against the same sale_item was approved first), this call fails with `422 REFUND_EXCEEDS_REMAINING_QUANTITY`/`REFUND_EXCEEDS_REMAINING_AMOUNT` (the same codes the original request-time check uses); if the executing terminal has no open fiscal_day/shift at this moment, this call fails with `409 FISCAL_DAY_CLOSED`/`SHIFT_NOT_OPEN` (the same codes `POST /sales/{saleId}/refunds` itself already documents for that condition). In every failure case the refund row is left completely unchanged — still REQUESTED, no refund_item/refund_settlement/stock_movement/audit_event/electronic_journal_entry, no processing-context fields populated — requiring a human decision (a fresh approve attempt, or an explicit reject) rather than silently completing an over-limit refund or silently producing a REJECTED result. (Refund and Void now share the same failure-handling shape; the only remaining difference is which specific conditions each re-checks, not what happens when a check fails — see api-design.md §12.1.) Idempotent (ADR-010), with the same refinement as voidApprove: a retry with the same Idempotency-Key after a SUCCESSFUL execution returns the original COMPLETED result verbatim. A retry after a FAILED attempt (409/422, no fiscal mutation committed) may reuse the same Idempotency-Key for a fresh attempt once the underlying condition is corrected — no idempotency_record is durably resolved for an attempt that committed nothing, so this is treated as a new attempt, not a cached-failure replay.'
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/RefundIdPath'}
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      responses:
        '200':
          description: Refund executed — status is COMPLETED. A failed attempt never reaches this response; see 409/422 below.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: REFUND_NOT_PENDING_APPROVAL (already resolved by a concurrent request) — or FISCAL_DAY_CLOSED/SHIFT_NOT_OPEN (the executing terminal has no open fiscal_day/shift right now). In every case the refund remains REQUESTED, unchanged; the same Idempotency-Key may be reused for a fresh attempt once the underlying condition is corrected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: REFUND_EXCEEDS_REMAINING_QUANTITY/REFUND_EXCEEDS_REMAINING_AMOUNT — a concurrent refund against the same sale_item(s) was approved first, so the originally-requested amount no longer fits. The refund remains REQUESTED, unchanged, for a human re-decision; the same Idempotency-Key may be reused for a fresh attempt if the underlying quantity/amount later becomes available again (e.g. a sibling refund is rejected instead).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /refunds/{refundId}/reject:
    post:
      operationId: refundReject
      tags: [Sales]
      x-capability: SALE_REFUND_APPROVE
      summary: Reject a REQUESTED Refund — a human decision, never a fiscal mutation (state-machines.md §3)
      description: 'NOT a fiscal mutation, by design: REQUESTED → REJECTED only. Resolves the authenticated rejecting actor from the session (never client-supplied) and persists it to RefundSummary.approved_by, sets resolved_at to now (both added this pass — see their schema descriptions), and leaves refunded_at null (it only ever reflects COMPLETED, never REJECTED). Never executes, never creates a refund_item/refund_settlement/stock_movement, and never touches Sale (sale.status stays whatever it already was). Writes a rejection audit_event ONLY — never electronic_journal_entry, since a rejected refund never becomes the fiscal fact the REFUND journal event_type represents (same reasoning as voidReject). No processing-context fields are populated, because Stage 2 only defines those as being set during APPROVED → COMPLETED execution — so, unlike approve, this operation does not require an enrolled terminal or an OPEN shift/fiscal_day. Requires SALE_REFUND_APPROVE. Idempotent (ADR-010): a retry with the same Idempotency-Key returns the original rejection result verbatim.'
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/RefundIdPath'}
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1}
      responses:
        '200':
          description: Refund rejected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefundResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: REFUND_NOT_PENDING_APPROVAL — the refund is no longer in REQUESTED status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
