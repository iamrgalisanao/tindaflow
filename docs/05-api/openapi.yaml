openapi: 3.1.0
info:
  title: TindaFlow POS API
  version: 1.0.0-draft
  description: 'TindaFlow POS HTTP API (Stage 4 contract). Implements the frozen Stage 2 domain (tag stage-2-baseline, commit 2bc8885) and Stage 3 architecture (tag stage-3-baseline, commit c8a8bbe) without redesigning either. Same-origin session-authenticated SPA API for a self-hosted, LAN-first deployment. This is a design-time contract; no implementation exists yet.'
  contact: {name: ABBADev IT Solutions}
servers:
- {url: /api/v1, description: Same-origin relative base path (store LAN server or VPS)}
tags:
- {name: Auth}
- {name: Terminal}
- {name: Catalog}
- {name: Menu}
- {name: Employees}
- {name: CreditOverride}
- {name: Billing}
- {name: Inventory}
- {name: StockRules}
- {name: StockOverride}
- {name: Sales}
- {name: Invoices}
- {name: SaleSlips}
- {name: SaleDocumentSettings}
- {name: Shifts}
- {name: FiscalDay}
- {name: Reports}
- {name: StoreSettings}
- {name: FiscalInstallation}
- {name: InvoiceSeries}
- {name: StoreSetup}
- {name: Audit}
- {name: ElectronicJournal}
- {name: Users}
security:
- cookieAuth: []
paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Authenticate a user and establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password, writeOnly: true}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Terminate the current session
      responses:
        '204': {description: Session terminated}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      operationId: authMe
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  # ------------------------------------------------------------ Terminal
  /terminal-enrollment-tokens:
    post:
      operationId: terminalCreateEnrollmentToken
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Generate a one-time enrollment token for a terminal (ADR-011)
      description: 'Requires TERMINAL_MANAGE. Does not itself require an enrolled terminal, since this is administered from an already-authenticated back-office session (which may or may not be running on an enrolled terminal browser).'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_id]
              properties:
                terminal_id: {type: string, format: uuid}
      responses:
        '201':
          description: Enrollment token created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalEnrollmentToken'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /terminal/enroll:
    post:
      operationId: terminalEnroll
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Bind this browser to a Terminal using a one-time token (ADR-011)
      description: 'Requires an authenticated administrative session on this workstation. On success, the server establishes an HttpOnly terminal credential on this browser; the one-time token is invalidated immediately.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Terminal credential established for this browser
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Token already used, expired, or revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /terminal/pairing-requests:
    post:
      operationId: terminalPairingRequestCreate
      tags: [Terminal]
      summary: Ask for this browser to be approved as a till (ADR-015)
      description: 'Any signed-in user, at the browser that wants to be a till. Returns once a short code (to be read to an administrator) and a secret (kept by this browser, used to collect the credential). Both are stored only hashed. A person has one live request at a time; at most 20 wait per store (429 PAIRING_REQUEST_LIMIT); 10 an hour per person.'
      security:
      - cookieAuth: []
      responses:
        '201':
          description: The request
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  code: {type: string, example: 'ABCD-EFGH'}
                  secret: {type: string}
                  expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          description: Too many requests waiting, or too many asked (PAIRING_REQUEST_LIMIT / RATE_LIMITED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    get:
      operationId: terminalPairingRequestList
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Till requests waiting for approval
      description: 'Pending, unexpired requests of the actor''s store, oldest first, with who asked, from which address and browser. The code is never listed: the administrator must type the one shown on the till computer.'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Waiting requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        requested_by:
                          type: object
                          properties:
                            id: {type: string, format: uuid}
                            name: {type: string}
                            role: {$ref: '#/components/schemas/UserRole'}
                        ip_address: {type: string, nullable: true}
                        user_agent: {type: string, nullable: true}
                        requested_at: {type: string, format: date-time}
                        expires_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /terminal/pairing-requests/{requestId}/claim:
    post:
      operationId: terminalPairingRequestClaim
      tags: [Terminal]
      summary: The requesting browser asks whether it has been approved (ADR-015)
      description: 'Needs the secret and must come from the same signed-in user that asked. 202 while still waiting. Once approved, issues the terminal credential as the HttpOnly cookie, exactly once, and answers the terminal. 409 PAIRING_REQUEST_INVALID for every other case (unknown, someone else''s, wrong secret, expired, declined, already used).'
      security:
      - cookieAuth: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: {type: string}
      responses:
        '200':
          description: Approved; terminal credential established for this browser
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '202':
          description: Still waiting for an administrator
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [PENDING]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: PAIRING_REQUEST_INVALID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /terminal/pairing-requests/{requestId}/approve:
    post:
      operationId: terminalPairingRequestApprove
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Approve a till request with the code read from the till computer, and choose its terminal (ADR-015)
      description: 'The code must match the request (a wrong one is a 422 field error; five decline the request). Approving a revoked terminal needs a free licensed seat (409 TERMINAL_LIMIT_REACHED); approving an already-enrolled terminal replaces its credential.'
      security:
      - cookieAuth: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, terminal_id]
              properties:
                code: {type: string}
                terminal_id: {type: string, format: uuid}
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [APPROVED]}
                  terminal_id: {type: string, format: uuid}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: PAIRING_REQUEST_INVALID or TERMINAL_LIMIT_REACHED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /terminal/pairing-requests/{requestId}/reject:
    post:
      operationId: terminalPairingRequestReject
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Decline a till request (ADR-015)
      security:
      - cookieAuth: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [REJECTED]}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: PAIRING_REQUEST_INVALID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /terminal/current:
    get:
      operationId: terminalCurrent
      tags: [Terminal]
      summary: The terminal this browser is currently enrolled as
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      responses:
        '200':
          description: Current terminal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: This browser is not enrolled as any terminal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /terminals:
    post:
      operationId: terminalCreate
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Create a terminal (a till) for the store
      description: 'Requires TERMINAL_MANAGE. Creates an ACTIVE terminal that is not yet enrolled; enroll a browser as it with terminalCreateEnrollmentToken then terminalEnroll. terminal_code is unique per store, compared case-insensitively; a duplicate is a 422 VALIDATION_FAILED field error. When the installation carries a signed license (ADR-014) and every licensed till is in use, the answer is 409 TERMINAL_LIMIT_REACHED.'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_code]
              properties:
                terminal_code: {type: string, minLength: 1, maxLength: 40}
      responses:
        '201':
          description: Terminal created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: The installation's license allows no more active tills (TERMINAL_LIMIT_REACHED)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
    get:
      operationId: terminalList
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: List terminals for the store
      description: 'meta.license is null when no till limit is enforced on this installation, otherwise {max_terminals, in_use} (ADR-014).'
      security:
      - cookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/TerminalStatus'}
      responses:
        '200':
          description: Paginated terminal list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /terminals/{terminalId}:
    get:
      operationId: terminalGet
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Get a terminal
      parameters:
      - {$ref: '#/components/parameters/TerminalIdPath'}
      responses:
        '200':
          description: Terminal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /terminals/{terminalId}/revoke:
    post:
      operationId: terminalRevoke
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Revoke a terminal's enrolled credential
      parameters:
      - {$ref: '#/components/parameters/TerminalIdPath'}
      responses:
        '200':
          description: Terminal revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # ------------------------------------------------------------- Catalog
  /products:
    get:
      operationId: productList
      tags: [Catalog]
      summary: List products
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: category_id
        in: query
        schema: {type: string, format: uuid}
      - name: menu_group_id
        in: query
        description: 'Products placed in this menu group. A top group also matches the products of its sub-groups.'
        schema: {type: string, format: uuid}
      - name: active
        in: query
        schema: {type: boolean}
      - name: search
        in: query
        description: Matches name or SKU (not barcode — use the barcode lookup operation for that)
        schema: {type: string}
      - name: sort
        in: query
        schema:
          type: string
          enum: [name, -name, sku, -sku, created_at, -created_at]
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: productCreate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /products/{productId}:
    get:
      operationId: productGet
      tags: [Catalog]
      summary: Get a product
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: productUpdate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Update a product's catalog attributes
      description: 'Updates current catalog data only (name, price, tax class, etc.). Never affects historical sale_item snapshots, which are immutable per Stage 2. There is no DELETE for products — see productDeactivate.'
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /products/{productId}/activate:
    post:
      operationId: productActivate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Reactivate a product
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      responses:
        '200':
          description: Product activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /products/{productId}/deactivate:
    post:
      operationId: productDeactivate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Deactivate a product (retirement mechanism — never DELETE)
      description: 'Deactivated products are excluded from barcode lookup and catalog listings by default but remain fully referenceable by historical sale_item rows, satisfying Stage 2''s "reference only, never a live dependency" rule.

        '
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      responses:
        '200':
          description: Product deactivated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # ---- Alternate barcodes (stage 26) ------------------------------------------------------------
  # Added 2026-09-20 as a forward commit: no prior draft at any stage (docs/06-backend/stage-26-alternate-barcodes.md).
  # productLookupByBarcode already matched alternates from stage 20; nothing could create them until now. A code identifies
  # at most one product per store across a product's own barcode and every alternate. A code already in use is the
  # catalog's usual 422 VALIDATION_FAILED field error on `barcode`; no new error code.
  /products/{productId}/barcodes:
    get:
      operationId: productBarcodeList
      tags: [Catalog]
      summary: List a product's packagings (alternate barcodes and named packs)
      description: Session only, like the other catalog reads. The product's own barcode and unit are Product.barcode and Product.unit_of_measure (the base unit) and are not repeated here. Oldest first (rows added in the same second by name, then code). Stage 29 gave each row an optional name and a pack size.
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated alternate barcodes
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/ProductBarcode'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: productBarcodeCreate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Add a packaging to a product (an alternate barcode and/or a named pack)
      description: 'A code the product can be scanned by, for example a different supplier''s packaging, and/or (stage 29) a named pack such as "Case" that holds units_per_base single units, used when receiving stock. At least one of barcode and name is required; a barcode alone is an alias of the single unit (1 unit). Stock is always kept in the product''s one base unit; the pack size only says how to convert a pack count. Surrounding whitespace (a scanner''s line break) is trimmed; the code is otherwise stored exactly as given (matching is exact, so case matters). A code already in use in the store, as any product''s own barcode or alternate, is 422 VALIDATION_FAILED on `barcode`; a second pack of the same name on the product (any capitals) is 422 on `name`; another store''s identical code is not a conflict. Allowed for an inactive product. Audited as PRODUCT_BARCODE_ADDED. Selling by the pack is not available: the stored can_sell flag is not exposed and nothing reads it yet.'
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of barcode and name.
              properties:
                barcode: {type: string, minLength: 1, maxLength: 255}
                name: {type: string, minLength: 1, maxLength: 60, description: 'A label such as Case or Tray; unique per product ignoring capitals.'}
                units_per_base: {$ref: '#/components/schemas/Quantity', description: 'How many single units one of these holds; greater than zero, default 1.'}
                can_receive: {type: boolean, description: 'May stock be received in this pack. Default true.'}
      responses:
        '201':
          description: Alternate barcode added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductBarcode'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /products/{productId}/barcodes/{barcodeId}:
    delete:
      operationId: productBarcodeDelete
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Remove an alternate barcode
      description: 'The product can no longer be scanned by that code (its own barcode and other alternates are unaffected). Idempotent: removing a barcode that is not there, or one that belongs to another product, is a 204 that changes nothing. Audited as PRODUCT_BARCODE_REMOVED when a barcode was actually removed. A real delete is fine here: an alternate barcode is a lookup key, not accounting data, and sale lines keep their own barcode snapshot.'
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      - name: barcodeId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '204': {description: 'Barcode removed, or was not there'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /products/by-barcode/{barcode}:
    get:
      operationId: productLookupByBarcode
      tags: [Catalog]
      summary: Low-latency barcode lookup for cashier scanning
      description: 'Returns current saleable-product data for cart preview only. The returned price/tax data is NOT authoritative for checkout — sale finalization always recalculates server-side from current authoritative data at the moment of finalization (Stage 2 invariant #4; architecture.md §11).'
      parameters:
      - name: barcode
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: BARCODE_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /categories:
    get:
      operationId: categoryList
      tags: [Catalog]
      summary: List categories
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated category list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/Category'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: categoryCreate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
