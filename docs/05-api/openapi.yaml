      description: 'Rejects with FISCAL_DAY_HAS_OPEN_SHIFT if any Shift referencing this FiscalDay is still OPEN (Stage 2 invariant #36). All Z-Reading totals are derived server-side from authoritative committed records — never accepted from the browser (architecture.md §46).'
