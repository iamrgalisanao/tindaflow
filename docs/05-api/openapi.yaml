    post:
      operationId: saleFinalize
      tags: [Sales]
      summary: Finalize a Sale (checkout) — the single most important operation
      description: 'A Sale does not exist before this call succeeds (Stage 2 §2.7: no persisted DRAFT). Terminal, cashier, shift, fiscal_day are resolved server-side and can never be overridden by the request body (architecture.md §5/§11, Stage 2 invariant #3/#4). Server recomputes every monetary/tax/discount figure via the FinancialCalculator (ADR-012) regardless of any client-submitted preview values.'
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaleFinalizeRequest'}
      responses:
        '201':
          description: Sale finalized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleDetail'}
