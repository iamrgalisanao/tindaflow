        '404':
          description: Not found — either the FiscalDay doesn't exist, or it hasn't closed yet
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /fiscal-days/{fiscalDayId}/z-reading/prints:
    post:
      operationId: fiscalDayZReadingPrint
      tags: [FiscalDay]
      x-capability: REPORT_VIEW
      summary: Print the Z-reading; the server decides which printout is the original
      description: 'Store-scoped; REPORT_VIEW; 30 an hour per person (429). The first print of a reading is the plain original (recorded in z_reading_prints, insert-only and unique per reading, so two simultaneous first prints cannot both be originals, with a Z_READING_PRINTED audit event). Every later print is a copy marked REPRINT -- COPY, recorded as Z_READING_REPRINTED. Rendered from the stored totals_snapshot and never recalculated; changes nothing about the reading, the fiscal day or any counter. A day of another store, or one with no Z-reading yet, is FISCAL_DAY_NOT_FOUND. Not idempotent: a retry after a lost response records one more print, never a changed figure.'
