                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/RefundSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /refunds/{refundId}:
    get:
      operationId: refundGet
      tags: [Sales]
      summary: Get full Refund detail (backs the Stage 1 sitemap's /back-office/void-refund/:id screen)
      parameters:
      - {$ref: '#/components/parameters/RefundIdPath'}
      responses:
        '200':
