        schema: {type: string, enum: [REQUESTED, APPROVED, REJECTED, COMPLETED]}
      - name: sale_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated refunds
          content:
            application/json:
              schema:
