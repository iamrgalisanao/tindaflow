      responses:
        '200':
          description: Store settings updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ------------------------------------------------- SaleDocumentSettings
  /sale-document-settings:
    get:
      operationId: saleDocumentSettingsGet
      tags: [SaleDocumentSettings]
      summary: How the store documents a sale (INVOICE or SLIP), the slip footer, and what is open right now
      description: 'ADR-016. open_shifts and open_fiscal_days count the store''s shifts and business days that are open on any terminal; the mode cannot change while either is above zero.'
      responses:
        '200':
          description: Sale document settings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleDocumentSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /sale-document-settings/mode:
    put:
      operationId: saleDocumentModeSet
      tags: [SaleDocumentSettings]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Switch the store between INVOICE and SLIP
      description: 'ADR-016 section 7 / ADR-014. A store-wide decision, uniform across its tills. Refused with SALE_DOCUMENT_MODE_CHANGE_BLOCKED (409) while any shift or business day is open on any terminal; writes a SALE_DOCUMENT_MODE_CHANGED audit event. Each sale records the mode it was finalized in, so earlier sales keep their document. Asking for the mode already in force changes nothing and writes nothing. A store with no settings row gets one (its own name, blank registered name and TIN).'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaleDocumentModeInput'}
      responses:
        '200':
          description: The settings after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleDocumentSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: SALE_DOCUMENT_MODE_CHANGE_BLOCKED -- a shift or business day is open; details carry open_shifts and open_fiscal_days
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /sale-document-settings/slip-footer:
    put:
      operationId: slipFooterSet
      tags: [SaleDocumentSettings]
      x-capability: STORE_SETTINGS_MANAGE
      summary: Set the optional line printed at the bottom of every slip
      description: 'ADR-016. Empty by default; the store decides the wording. Applies to slips printed from now on only -- a printed slip keeps the footer it was printed with. null (or blank) clears it. Writes a SETTINGS_CHANGED audit event when the value changes.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SlipFooterInput'}
      responses:
        '200':
          description: The settings after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SaleDocumentSettings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /tax-registrations:
    get:
      operationId: taxRegistrationList
      tags: [StoreSettings]
      summary: Effective-dated tax registration history
      responses:
        '200':
          description: Tax registration history
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TaxRegistration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: taxRegistrationCreate
      tags: [StoreSettings]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      description: 'A registration that has not started yet (its effective_from is still in the future) has never applied to a sale, so registering again CORRECTS it in place (new type and start date, the end of the registration before it moved to match, the old values audited as TAX_REGISTRATION_CORRECTED); the new date then only has to be after the previous registration started. A registration that has started is never edited: a new one must start after it.'
      summary: Register a new effective-dated tax registration (never overwrites history — Stage 2 invariant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_type, effective_from]
              properties:
                registration_type: {$ref: '#/components/schemas/TaxRegistrationType'}
                effective_from: {type: string, format: date}
      responses:
        '201':
          description: New tax registration created; prior one closed as of the new effective_from
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxRegistration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ---------------------------------------------------- FiscalInstallation
  /fiscal-installations:
    get:
      operationId: fiscalInstallationList
      tags: [FiscalInstallation]
      x-capability: STORE_SETTINGS_MANAGE
      summary: List fiscal installations
      description: 'The store''s administrators can always see what is configured (ADR-014: changing it needs FISCAL_CONFIGURATION_MANAGE, held only while the server operator has unlocked it); a cashier or manager cannot, since it carries accreditation and permit numbers and the machine serial. Administrative surface only. Entering values here does not itself constitute BIR accreditation — TindaFlow V1 is not accredited (architecture.md §12/ADR-009).'
      responses:
        '200':
          description: Fiscal installations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FiscalInstallation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: fiscalInstallationCreate
      tags: [FiscalInstallation]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Record a fiscal installation (accreditation and PTU tracked as independent effective-dated facts — ADR-009)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FiscalInstallationInput'}
      responses:
        '201':
          description: Fiscal installation recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FiscalInstallation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /fiscal-installations/{fiscalInstallationId}:
    get:
      operationId: fiscalInstallationGet
      tags: [FiscalInstallation]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Get a fiscal installation
      parameters:
      - name: fiscalInstallationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Fiscal installation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FiscalInstallation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /fiscal-installations/{fiscalInstallationId}/terminals:
    post:
      operationId: fiscalInstallationAssignTerminal
      tags: [FiscalInstallation]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Assign (or reassign) a terminal's current fiscal installation mapping
      description: 'Added in the store-setup pass (2026-09-18) -- no prior draft in this document at any stage. Closes the terminal''s existing current mapping (`terminal_fiscal_installations_one_current_per_terminal` allows only one `effective_to IS NULL` row per terminal) and opens a new one, rather than requiring a separate close call first -- the same "prior one closed" shape as `taxRegistrationCreate`. This is the row `FiscalInstallationResolver::resolveForTerminal` reads at checkout; without one, `POST /sales` fails with a setup-defect 500 (a disclosed, deliberately uncaught gap -- see `docs/06-backend/stage-6c-sale-finalization.md` §5).'
      parameters:
      - name: fiscalInstallationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_id]
              properties:
                terminal_id: {type: string, format: uuid}
                effective_from: {type: string, format: date-time, description: Defaults to now if omitted}
      responses:
        '201':
          description: Mapping created; any prior current mapping for this terminal is closed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalFiscalInstallation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ----------------------------------------------------------- InvoiceSeries
  # Store-setup pass (2026-09-18) -- no prior draft in this document at any
  # stage; forward-committed past stage-6c-baseline per the owner decision
  # recorded in docs/PROJECT-MANIFEST.md's store-setup section. This is the
  # table InvoiceSeriesAllocator::allocateForFiscalInstallation reads at
  # checkout time.
  /invoice-series:
    get:
      operationId: invoiceSeriesList
      tags: [InvoiceSeries]
      x-capability: STORE_SETTINGS_MANAGE
      summary: List invoice series for the store
      description: 'Administrators only (STORE_SETTINGS_MANAGE); changing needs FISCAL_CONFIGURATION_MANAGE, held only while the server operator has unlocked it (ADR-014).'
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: fiscal_installation_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated invoice series
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/InvoiceSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: invoiceSeriesCreate
      tags: [InvoiceSeries]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Activate a new invoice series for a fiscal installation
      description: 'Bootstraps `current_number = starting_number - 1` (invariants.md INVSERIES-001) so the first real allocation yields `starting_number` exactly. `409 INVOICE_SERIES_ALREADY_ACTIVE` if the fiscal installation already has an ACTIVE series -- close it first (`invoiceSeriesClose`), never an implicit auto-supersede.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoiceSeriesInput'}
      responses:
        '201':
          description: Invoice series activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /invoice-series/{invoiceSeriesId}/close:
    post:
      operationId: invoiceSeriesClose
      tags: [InvoiceSeries]
      x-capability: FISCAL_CONFIGURATION_MANAGE
      summary: Close an invoice series
      description: An explicit admin action, never automatic -- retiring a fiscally-significant numbering sequence is never implied by another operation.
      parameters:
      - name: invoiceSeriesId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Invoice series closed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceSeries'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  # ------------------------------------------------------- InventoryLocation
  # Store-setup pass (2026-09-18) -- tagged Inventory (already-existing tag,
  # no new tag needed); no prior draft in this document at any stage. This
  # is the table InventoryLocationResolver::resolveDefaultForStore reads at
  # checkout time.
  /inventory-locations:
    get:
      operationId: inventoryLocationList
      tags: [Inventory]
      summary: List inventory locations for the store
      description: 'Loosened 2026-09-20 (stage 25): session only, no capability. A location is just a name, and the stock, count and transfer screens of a MANAGER (STOCK_ADJUST without FISCAL_CONFIGURATION_MANAGE) need the list to say where stock is. Creating and editing stay FISCAL_CONFIGURATION_MANAGE.'
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated inventory locations
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/InventoryLocation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: inventoryLocationCreate
      tags: [Inventory]
      x-capability: STORE_SETTINGS_MANAGE
      summary: Create an inventory location
      description: A store's first location is made the default automatically, regardless of the submitted `is_default` value -- otherwise a fresh store could never pass the checkout-time default-location check without a second, separate call.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryLocationInput'}
      responses:
        '201':
          description: Inventory location created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryLocation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /inventory-locations/{inventoryLocationId}:
    patch:
      operationId: inventoryLocationUpdate
      tags: [Inventory]
      x-capability: STORE_SETTINGS_MANAGE
      summary: Rename an inventory location, or promote it to the store's default
      description: '`is_default` may only be submitted as `true` -- a location is promoted to default (which transactionally demotes the current one), never explicitly demoted on its own, so this endpoint can never leave a store with zero default locations.'
      parameters:
      - name: inventoryLocationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                is_default: {type: boolean, enum: [true]}
      responses:
        '200':
          description: Inventory location updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryLocation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ------------------------------------------------------------ StoreSetup
  # Store-setup pass (2026-09-18) -- no prior draft in this document at any
  # stage. Read-only, non-authoritative aggregate check across the four
  # checkout-time resolver prerequisites, so the frontend can show a clear
  # "setup incomplete" state before a cashier attempts a checkout that is
  # guaranteed to fail.
  /store-setup/readiness:
    get:
      operationId: storeSetupReadinessGet
      tags: [StoreSetup]
      summary: Store-setup readiness for the current terminal
      description: 'security: cookieAuth AND terminalCookieAuth conjunctively, same as shiftCurrentGet -- no x-capability, since a cashier on an enrolled terminal needs this too, not just an admin.'
      responses:
        '200':
          description: Readiness checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreSetupReadiness'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /store-setup/overview:
    get:
      operationId: storeSetupOverviewGet
      tags: [StoreSetup]
      x-capability: STORE_SETTINGS_MANAGE
      summary: Store-setup readiness for the whole store
      description: 'Session only (an administrator may have no terminal enrolled on the browser they use). Asks the same four questions the till asks (storeSetupReadinessGet), for every terminal that can sell (ACTIVE and not revoked): the store is ready only when each of them is. `terminals` carries each one''s own checks so a failure can be pinned to a till; with no terminal that can sell, fiscal_installation and invoice_series are false.'
      responses:
        '200':
          description: Store readiness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StoreSetupOverview'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  # --------------------------------------------------------------- Audit
  /audit-events:
    get:
      operationId: auditEventList
      tags: [Audit]
      x-capability: AUDIT_VIEW
      summary: Search the audit event log (read-only — no create/update/delete endpoint exists)
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: event_type
        in: query
        schema: {type: string}
      - name: actor_user_id
        in: query
        schema: {type: string, format: uuid}
      - name: entity_type
        in: query
        schema: {type: string}
      - name: entity_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated audit events
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /audit-events/{auditEventId}:
    get:
      operationId: auditEventGet
      tags: [Audit]
      x-capability: AUDIT_VIEW
      summary: Get a single audit event
      parameters:
      - name: auditEventId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Audit event
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # ----------------------------------------------------- ElectronicJournal
  /electronic-journal-entries:
    get:
      operationId: journalEntryList
      tags: [ElectronicJournal]
      x-capability: JOURNAL_VIEW
      summary: Search the electronic journal (read-only — no create/update/delete endpoint exists)
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: event_type
        in: query
        schema: {$ref: '#/components/schemas/ElectronicJournalEventType'}
      - name: terminal_id
        in: query
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/AcceptFormatHeader'}
      responses:
        '200':
          description: Paginated (or CSV-exported) journal entries
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/ElectronicJournalEntry'}
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /electronic-journal-entries/{journalEntryId}:
    get:
      operationId: journalEntryGet
      tags: [ElectronicJournal]
      x-capability: JOURNAL_VIEW
      summary: Get a single journal entry
      parameters:
      - name: journalEntryId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Journal entry
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ElectronicJournalEntry'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # --------------------------------------------------------------- Users
  /users:
    get:
      operationId: userList
      tags: [Users]
      x-capability: USER_MANAGE
      summary: List users
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: role
        in: query
        schema: {$ref: '#/components/schemas/UserRole'}
      - name: active
        in: query
        schema: {type: boolean}
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: userCreate
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /users/{userId}:
    get:
      operationId: userGet
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Get a user
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: userUpdate
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Update a user
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserInput'}
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /users/{userId}/deactivate:
    post:
      operationId: userDeactivate
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Deactivate a user (no DELETE — users are referenced by historical audit/sale records)
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: User deactivated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/{userId}/activate:
    post:
      operationId: userActivate
      tags: [Users]
      x-capability: USER_MANAGE
      summary: Reactivate a deactivated user
      description: 'Added 2026-09-19 (forward commit, no prior draft): userDeactivate had no inverse, so a deactivation was permanent. Idempotent -- activating an already-active user returns them unchanged. The user signs in again with their existing password; sessions that ended at deactivation are not resurrected.'
      parameters:
      - name: userId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: User activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: tindaflow_session, description: 'Laravel-compatible session cookie (HttpOnly, Secure, SameSite=Strict). All state-changing requests additionally require a valid CSRF token via the standard Laravel double-submit-cookie mechanism (X-XSRF-TOKEN header sourced from the XSRF-TOKEN cookie); this is enforced by global middleware and is not repeated as a parameter on every operation in this document — see api-design.md, Authentication.'}
    terminalCookieAuth: {type: apiKey, in: cookie, name: tindaflow_terminal, description: 'Opaque, high-entropy terminal credential issued at enrollment (ADR-011) and stored as a second HttpOnly/SameSite=Strict cookie (Secure mandatory in production). Looked up by deterministic hash against terminals.credential_hash on every request; a revoked (revoked_at IS NOT NULL) or unmatched credential fails with TERMINAL_REVOKED/TERMINAL_NOT_ENROLLED. Required in addition to, never instead of, cookieAuth on every POS_TERMINAL operation (module-a-auth-terminal-initialization.md §14 Ruling 3) — combined in a single Security Requirement Object so both are conjunctively required.'}
  parameters:
    PageParam:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPageParam:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    FromParam:
      name: from
      in: query
      description: Inclusive start of a date range (YYYY-MM-DD)
      schema: {type: string, format: date}
    ToParam:
      name: to
      in: query
      description: Inclusive end of a date range (YYYY-MM-DD)
      schema: {type: string, format: date}
    AcceptFormatHeader:
      name: Accept
      in: header
      description: application/json (default) or text/csv for CSV export
      schema:
        type: string
        enum: [application/json, text/csv]
        default: application/json
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-generated UUIDv4, scoped to (authenticated terminal, key) per ADR-010. The terminal component is resolved server-side from the enrolled terminal credential, never from this header or the request body. Reused across retries of the same attempt; never reused for a genuinely new attempt.'
      schema: {type: string, format: uuid, example: 0f3c9b1a-6e2d-4c7a-9a2e-1b4d5f6a7c8b}
    StockCountId:
      name: stockCountId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TerminalIdPath:
      name: terminalId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SaleIdPath:
      name: saleId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VoidIdPath:
      name: voidId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RefundIdPath:
      name: refundId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InvoiceIdPath:
      name: invoiceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    SlipIdPath:
      name: slipId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ShiftIdPath:
      name: shiftId
      in: path
      required: true
      schema: {type: string, format: uuid}
    FiscalDayIdPath:
      name: fiscalDayId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: BAD_REQUEST — malformed request / protocol error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: AUTHENTICATION_REQUIRED
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: AUTHORIZATION_DENIED or TERMINAL_NOT_ENROLLED/TERMINAL_REVOKED
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Current-resource-state conflict, concurrency conflict, or idempotency-key reuse with a different payload
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: Structurally valid request containing invalid field/domain input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ReportOk:
      description: Report result (JSON by default; text/csv if requested via Accept)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ReportResult'}
        text/csv:
          schema: {type: string, format: binary}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, description: Stable machine-readable code — see error-catalog.md}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            request_id: {type: string}
    PaginationMeta:
      type: object
      required: [page, per_page, total, last_page]
      properties:
        page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        last_page: {type: integer}
    PaginatedResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    Money: {type: string, description: 'Decimal string, always exactly 2 places, never a binary float. Sized for a single transaction/line/ledger amount (matches the NUMERIC(12,2) storage decision in architecture.md §3.1) — do not reuse this schema for a lifetime/accumulated total; see AccumulatedMoney for that.', pattern: '^-?\d+\.\d{2}$', example: '1250.50'}
    AccumulatedMoney: {type: string, description: 'Decimal string, always exactly 2 places — used specifically for cumulative/lifetime fiscal totals (e.g. ZReading''s accumulated grand total sales) where RMO 24-2023 requires at least 12 digits of capacity inclusive of the 2 decimal places (i.e. at least 10 integer digits; the floor is exercised by the 9999999999.99 boundary test). Corrected in Stage 4 remediation pass 3: this schema previously claimed "no artificial digit cap," but that let the contract accept values the frozen NUMERIC(18,2) storage decision (architecture.md §3.1) cannot persist. The pattern now caps at exactly NUMERIC(18,2)''s own maximum — 16 integer digits + 2 fractional digits, i.e. up to 9999999999999999.99 — so the contract can never promise a value the database is guaranteed to reject. This remains a schema distinct from Money (which is capped far lower, at NUMERIC(12,2)) so a future per-transaction constraint tightened on Money can never be silently inherited by an accumulated total, and vice versa.

        ', pattern: '^(?:0|[1-9][0-9]{0,15})\.[0-9]{2}$', example: '9999999999999999.99'}
    Quantity: {type: string, description: 'Decimal string, up to 3 places (Stage 2 Quantity value object, NUMERIC(10,3)). Example "1.000" or "0.500".', pattern: '^\d+(\.\d{1,3})?$', example: '1.000'}
    TaxClassification:
      type: string
      enum: [VATABLE, VAT_EXEMPT, ZERO_RATED, NON_VAT]
    TaxRegistrationType:
      type: string
      enum: [VAT, NON_VAT]
    PaymentMethod:
      type: string
      enum: [CASH, GCASH, MAYA, CARD, OTHER, CREDIT]
      description: 'CREDIT (ADR-016 slice 3.2) is a whole-sale tender charged to an employee: it is the sale''s ONLY payment, equals its grand total, and the request names the employee (employee_id). It is never cash: it adds nothing to the drawer, expected cash or change. As a refund settlement it is accepted ONLY for a sale that was paid with credit (and a credit sale accepts nothing else).'
    SaleStatus:
      type: string
      enum: [COMPLETED, VOIDED, PARTIALLY_REFUNDED, REFUNDED]
    StockMovementType:
      type: string
      enum: [OPENING_STOCK, PURCHASE_RECEIPT, SALE, SALE_RETURN, STOCK_ADJUSTMENT_IN, STOCK_ADJUSTMENT_OUT, DAMAGE, EXPIRED, TRANSFER_IN, TRANSFER_OUT, DAILY_PORTIONS_ADDED, DAILY_PORTIONS_REMOVED]
    RefundDisposition:
      type: string
      enum: [RETURN_TO_STOCK, DAMAGED, EXPIRED, DISPOSED]
    ElectronicJournalEventType:
      type: string
      description: Matches Stage 2's electronic_journal_entry.event_type catalog (domain-model.md §2.10) exactly.
      enum: [INVOICE, VOID, REFUND, X_READING, Z_READING, SHIFT_OPENED, SHIFT_CLOSED, CASH_IN, CASH_OUT, STOCK_ADJUSTED]
    TerminalStatus:
      type: string
      enum: [ACTIVE, INACTIVE, DECOMMISSIONED]
    UserRole:
      type: string
      enum: [ADMIN, MANAGER, CASHIER]
    Capability:
      type: string
      description: 'The full Stage 2 capability catalog (domain-model.md §2.2), including the six additions synced back into Stage 2 during Stage 4 remediation pass 2 (2026-09-16) — CATALOG_MANAGE, AUDIT_VIEW, JOURNAL_VIEW, USER_MANAGE, TERMINAL_MANAGE, FISCAL_CONFIGURATION_MANAGE — so this enum and Stage 2''s canonical list never drift again. This is a fixed enum of string constants, not a dynamic/configurable permission system — see api-design.md §4 for the role→capability mapping and rationale.

        '
      enum: [SALE_VOID, SALE_VOID_APPROVE, SALE_REFUND, SALE_REFUND_APPROVE, PRICE_OVERRIDE, DISCOUNT_OVERRIDE, STOCK_ADJUST, CASH_OUT, REPORT_VIEW, STORE_SETTINGS_MANAGE, FISCAL_DAY_CLOSE, CATALOG_MANAGE, AUDIT_VIEW, JOURNAL_VIEW, USER_MANAGE, TERMINAL_MANAGE, FISCAL_CONFIGURATION_MANAGE, EMPLOYEE_MANAGE, EMPLOYEE_POLICY_MANAGE, CREDIT_LIMIT_OVERRIDE, BILLING_MANAGE, STOCK_SALE_OVERRIDE]
    UserSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        capabilities:
          type: array
          items: {$ref: '#/components/schemas/Capability'}
        active: {type: boolean}
    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        password: {type: string, format: password, writeOnly: true}
    TerminalEnrollmentToken:
      type: object
      properties:
        token: {type: string}
        terminal_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
    TerminalSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        terminal_code: {type: string}
        status: {$ref: '#/components/schemas/TerminalStatus'}
        activated_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time, nullable: true}
        last_seen_at: {type: string, format: date-time, nullable: true, description: 'When the till was last used (written at most once a minute).'}
        last_seen_ip: {type: string, nullable: true, description: 'The network address of the computer that last used it; only as reliable as the network path to the server.'}
        shared_use_suspected_at: {type: string, format: date-time, nullable: true, description: 'Set when the till''s credential was used from two different computers in turn; a flag for an administrator, never a lock. Cleared by enrolling the till again.'}
    Category:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    MenuGroup:
      type: object
      properties:
        id: {type: string, format: uuid}
        parent_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    EmployeeType:
      type: string
      enum: [DIRECT, SUBCONTRACTOR]
      description: 'DIRECT employees get codes TSC00001...; SUBCONTRACTOR employees get SUB00001.... Both are billed to the store''s one billing party, TSC (client decision 2026-10-25).'
    Employee:
      type: object
      properties:
        id: {type: string, format: uuid}
        employee_code: {type: string, pattern: '^(TSC|SUB)[0-9]{5,}$', description: 'System generated, immutable, never reused; also the QR value.'}
        employee_type: {$ref: '#/components/schemas/EmployeeType'}
        first_name: {type: string}
        middle_name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        last_name: {type: string}
        name: {type: string, description: 'First Middle Last.'}
        billing_party_id: {type: string, format: uuid}
        active: {type: boolean}
        created_at: {type: string, format: date-time}
    EmployeeInput:
      type: object
      required: [employee_type, first_name, last_name]
      properties:
        employee_type: {$ref: '#/components/schemas/EmployeeType'}
        first_name: {type: string}
        middle_name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        last_name: {type: string}
    EmployeeLookupResult:
      type: object
      description: 'Only what the till needs to name the person it is charging. No billing party, no dates, no balance.'
      properties:
        id: {type: string, format: uuid}
        employee_code: {type: string}
        employee_type: {$ref: '#/components/schemas/EmployeeType'}
        name: {type: string}
        active: {type: boolean}
    CreditOverrideGrantRequest:
      type: object
      required: [approver_id, code, employee_id, amount]
      properties:
        approver_id: {type: string, format: uuid, description: 'The approver the cashier picked by name (from creditOverrideApproverList).'}
        code: {type: string, pattern: '^\d{6,8}$', writeOnly: true, description: 'The approver''s own code, typed by them. Never stored, logged or audited.'}
        employee_id: {type: string, format: uuid}
        amount: {type: string, pattern: '^\d{1,10}\.\d{2}$', description: 'The sale total being approved (the figure CREDIT_LIMIT_EXCEEDED reported as `requested`): the approval''s ceiling. Must be more than zero.'}
    CreditOverrideGrantResult:
      type: object
      properties:
        grant_id: {type: string, format: uuid}
        token: {type: string, pattern: '^[0-9a-f]{64}$', description: 'Shown once. Send as saleFinalize.credit_override_token. Only its SHA-256 is stored.'}
        expires_at: {type: string, format: date-time}
        max_amount: {$ref: '#/components/schemas/Money'}
        employee_id: {type: string, format: uuid}
        approver:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
    OverrideCodeStatus:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        has_code: {type: boolean}
        locked: {type: boolean}
        locked_until: {type: [string, 'null'], format: date-time}
        set_at: {type: [string, 'null'], format: date-time}
    OverrideCodeSetRequest:
      type: object
      required: [password, code]
      properties:
        password: {type: string, format: password, writeOnly: true}
        code: {type: string, pattern: '^\d{6,8}$', writeOnly: true}
    OverrideCodeResetRequest:
      type: object
      required: [password]
      properties:
        password: {type: string, format: password, writeOnly: true, description: 'The administrator''s own password.'}
    BillingRequest:
      type: object
      description: 'A range is EITHER cutoff_month + cutoff_half OR from + to (Manila calendar dates, inclusive; from <= to; at most 366 days).'
      properties:
        cutoff_month: {type: string, pattern: '^\d{4}-\d{2}$'}
        cutoff_half: {type: integer, enum: [1, 2]}
        from: {type: string, format: date}
        to: {type: string, format: date}
        employee_type: {$ref: '#/components/schemas/EmployeeType'}
        employee_id: {type: string, format: uuid}
        as_of: {type: string, format: date-time}
    BillingStatement:
      type: object
      description: 'ADR-016 section 8. Amounts are two-decimal strings, quantities three-decimal strings. `returned_*` is what voids and refunds took back (positive here; shown negative on paper). `net` = sold - returned. A charge belongs to the range by the Manila date of its sale; a reversal belongs to the range of the charge it reverses.'
      properties:
        version: {type: integer}
        party: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}}}
        criteria:
          type: object
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
            period_label: {type: string}
            cutoff_month: {type: [string, 'null']}
            cutoff_half: {type: [integer, 'null']}
            employee_type: {type: [string, 'null']}
            employee_id: {type: [string, 'null']}
            employee_code: {type: [string, 'null']}
            as_of: {type: string, format: date-time}
        generated_at: {type: string, format: date-time}
        accounts:
          type: array
          items:
            type: object
            properties:
              employee_id: {type: string, format: uuid}
              employee_code: {type: string}
              employee_name: {type: string}
              employee_type: {$ref: '#/components/schemas/EmployeeType'}
              sale_count: {type: integer}
              sold_amount: {$ref: '#/components/schemas/Money'}
              returned_amount: {$ref: '#/components/schemas/Money'}
              net_amount: {$ref: '#/components/schemas/Money'}
              meal_types:
                type: array
                description: 'Sorted by name, "Other items" last. A meal and its add-ons: the meal name snapshot; a plain product: its menu group path snapshot, else "Other items".'
                items:
                  type: object
                  properties:
                    meal_type: {type: string}
                    sold_amount: {$ref: '#/components/schemas/Money'}
                    returned_amount: {$ref: '#/components/schemas/Money'}
                    net_amount: {$ref: '#/components/schemas/Money'}
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          item: {type: string, description: 'Chosen dishes joined with " + " (DISH), the add-on label (ADDON), or the product name (PRODUCT), all from the sale snapshots.'}
                          kind: {type: string, enum: [DISH, ADDON, PRODUCT]}
                          quantity_sold: {$ref: '#/components/schemas/Quantity'}
                          sold_amount: {$ref: '#/components/schemas/Money'}
                          quantity_returned: {$ref: '#/components/schemas/Quantity'}
                          returned_amount: {$ref: '#/components/schemas/Money'}
                          quantity_net: {type: string}
                          net_amount: {$ref: '#/components/schemas/Money'}
        adjustments:
          type: array
          description: 'Every void and refund counted, oldest first.'
          items:
            type: object
            properties:
              entry_id: {type: string, format: uuid}
              type: {type: string, enum: [VOID, REFUND]}
              recorded_at: {type: string, format: date-time}
              sale_id: {type: string, format: uuid}
              document_reference: {type: [string, 'null']}
              sold_on: {type: string, format: date, description: 'The date of the ORIGINAL sale (the period the reversal belongs to).'}
              employee_id: {type: string, format: uuid}
              employee_code: {type: string}
              employee_name: {type: string}
              employee_type: {type: string}
              amount: {$ref: '#/components/schemas/Money'}
              reason: {type: [string, 'null']}
              lines:
                type: array
                items:
                  type: object
                  properties:
                    meal_type: {type: string}
                    item: {type: string}
                    kind: {type: string}
                    quantity: {$ref: '#/components/schemas/Quantity'}
                    amount: {$ref: '#/components/schemas/Money'}
        totals:
          type: object
          properties:
            sold_amount: {$ref: '#/components/schemas/Money'}
            returned_amount: {$ref: '#/components/schemas/Money'}
            net_amount: {$ref: '#/components/schemas/Money'}
            employee_count: {type: integer}
            sale_count: {type: integer}
            adjustment_count: {type: integer}
            by_employee_type: {type: object, additionalProperties: {type: object, properties: {employee_count: {type: integer}, net_amount: {$ref: '#/components/schemas/Money'}}}}
        reconciliation:
          type: object
          description: 'BILL-001. ledger_net is SUM(CHARGE) - SUM(REVERSAL) read straight from the ledger; matches is always true on a statement that is returned.'
          properties:
            ledger_net: {$ref: '#/components/schemas/Money'}
            statement_net: {$ref: '#/components/schemas/Money'}
            items_net: {$ref: '#/components/schemas/Money'}
            matches: {type: boolean}
        comparison:
          type: [object, 'null']
          description: 'Against the latest EARLIER saved run for the same party, range and filters; null when there is none.'
          properties:
            previous_run: {type: object, properties: {id: {type: string, format: uuid}, run_number: {type: string}, generated_at: {type: string, format: date-time}, as_of: {type: string, format: date-time}, sold_amount: {$ref: '#/components/schemas/Money'}, returned_amount: {$ref: '#/components/schemas/Money'}, net_amount: {$ref: '#/components/schemas/Money'}}}
            sold_change: {type: string}
            returned_change: {type: string}
            net_change: {type: string}
            changed: {type: boolean}
            added_adjustments: {type: array, items: {type: object}}
            removed_adjustments: {type: array, items: {type: object}}
    BillingRun:
      type: object
      properties:
        id: {type: string, format: uuid}
        run_number: {type: string, example: BR-000001}
        from: {type: string, format: date}
        to: {type: string, format: date}
        period_label: {type: [string, 'null']}
        employee_type: {type: [string, 'null']}
        employee_code: {type: [string, 'null']}
        as_of: {type: string, format: date-time}
        generated_at: {type: string, format: date-time}
        generated_by: {type: object, properties: {id: {type: string, format: uuid}, name: {type: [string, 'null']}}}
        sold_amount: {$ref: '#/components/schemas/Money'}
        returned_amount: {$ref: '#/components/schemas/Money'}
        net_amount: {$ref: '#/components/schemas/Money'}
        employee_count: {type: integer}
        sale_count: {type: integer}
        statement_sha256: {type: string}
    BillingRunWithStatement:
      allOf:
      - {$ref: '#/components/schemas/BillingRun'}
      - type: object
        properties:
          statement_intact: {type: boolean}
          statement: {$ref: '#/components/schemas/BillingStatement'}
    BillingCheque:
      type: object
      properties:
        id: {type: string, format: uuid}
        cheque_number: {type: string, example: '0012345', description: 'Trimmed and upper-cased.'}
        bank: {type: string, example: BDO}
        cheque_date: {type: string, format: date, description: 'The date written on the cheque; may be post-dated, up to a year from received_on.'}
        amount: {$ref: '#/components/schemas/Money'}
        received_on: {type: string, format: date}
        received_by: {type: object, properties: {id: {type: string, format: uuid}, name: {type: [string, 'null']}}}
        status: {type: string, enum: [RECEIVED, RETURNED]}
        returned_on: {type: [string, 'null'], format: date}
        returned_at: {type: [string, 'null'], format: date-time}
        returned_by: {type: [object, 'null'], properties: {id: {type: string, format: uuid}, name: {type: [string, 'null']}}}
        return_reason: {type: [string, 'null']}
        notes: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        allocations:
          type: array
          description: 'The cut-off periods this cheque pays; they add up to `amount`. A returned cheque keeps them (RETURNED is what stops them counting).'
          items: {type: object, properties: {period_start: {type: string, format: date}, period_end: {type: string, format: date}, amount: {$ref: '#/components/schemas/Money'}}}
    BillingChequeRequest:
      type: object
      required: [cheque_number, bank, cheque_date, amount, received_on, allocations]
      properties:
        cheque_number: {type: string, maxLength: 40, pattern: '^[A-Za-z0-9][A-Za-z0-9 \-/]*$'}
        bank: {type: string, minLength: 2, maxLength: 80}
        cheque_date: {type: string, format: date}
        amount: {$ref: '#/components/schemas/Money'}
        received_on: {type: string, format: date, description: 'Manila calendar date, not in the future.'}
        notes: {type: [string, 'null'], maxLength: 500}
        allocations:
          type: array
          minItems: 1
          maxItems: 36
          items:
            type: object
            required: [period_start, amount]
            properties:
              period_start: {type: string, format: date, description: 'The 1st or the 16th of a month; each period once.'}
              amount: {$ref: '#/components/schemas/Money'}
    BillingChequeReturnRequest:
      type: object
      required: [returned_on, reason]
      properties:
        returned_on: {type: string, format: date, description: 'Manila calendar date, not in the future.'}
        reason: {type: string, minLength: 3, maxLength: 255}
    BillingBalance:
      type: object
      properties:
        party: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}}}
        as_of: {type: string, format: date-time}
        periods:
          type: array
          description: 'Newest period first.'
          items:
            type: object
            properties:
              period_start: {type: string, format: date}
              period_end: {type: string, format: date}
              period_label: {type: string, example: 'Oct 1-15, 2026'}
              charged_amount: {$ref: '#/components/schemas/Money'}
              reversed_amount: {$ref: '#/components/schemas/Money'}
              billed_amount: {$ref: '#/components/schemas/Money'}
              received_amount: {$ref: '#/components/schemas/Money'}
              returned_cheques_amount: {$ref: '#/components/schemas/Money'}
              owed_amount: {type: string, description: 'billed - received; NEGATIVE when the period was paid more than it now owes.'}
              status: {type: string, enum: [OPEN, PARTLY_PAID, PAID, OVERPAID, NO_CHARGES]}
              cheques: {type: array, items: {type: object, properties: {cheque_id: {type: string, format: uuid}, cheque_number: {type: string}, bank: {type: string}, received_on: {type: string, format: date}, amount: {$ref: '#/components/schemas/Money'}, status: {type: string, enum: [RECEIVED, RETURNED]}}}}
        totals:
          type: object
          properties:
            billed_amount: {$ref: '#/components/schemas/Money'}
            received_amount: {$ref: '#/components/schemas/Money'}
            owed_amount: {$ref: '#/components/schemas/Money'}
            credit_amount: {$ref: '#/components/schemas/Money'}
            returned_cheques_amount: {$ref: '#/components/schemas/Money'}
            period_count: {type: integer}
            open_period_count: {type: integer}
    EmployeeCreditLookupResult:
      description: 'EmployeeLookupResult plus the credit status of the CURRENT cut-off (1st-15th, or 16th to the end of the month, in the store''s timezone).'
      allOf:
      - {$ref: '#/components/schemas/EmployeeLookupResult'}
      - type: object
        properties:
          credit:
            type: object
            properties:
              limit: {$ref: '#/components/schemas/Money'}
              used: {$ref: '#/components/schemas/Money'}
              remaining: {type: string, description: 'limit minus used; negative if a limit was lowered below what is used.'}
              period_start: {type: string, format: date}
              period_end: {type: string, format: date}
    EmployeeImportResult:
      type: object
      properties:
        created: {type: integer}
        skipped: {type: integer, description: 'Exact duplicates (same type and names) of an existing employee or an earlier row.'}
        failed: {type: integer}
        errors:
          type: array
          items:
            type: object
            properties:
              row: {type: integer, description: 'Position in the file as a spreadsheet shows it (the heading is row 1).'}
              message: {type: string}
        skipped_rows:
          type: array
          items:
            type: object
            properties:
              row: {type: integer}
              message: {type: string}
        employees:
          type: array
          description: 'The employees created (or, on a dry run, the ones that would be), with their codes.'
          items:
            type: object
            properties:
              row: {type: integer}
              id: {type: string, format: uuid}
              employee_code: {type: string}
              name: {type: string}
              employee_type: {$ref: '#/components/schemas/EmployeeType'}
    CreditPolicy:
      type: object
      properties:
        employee_type: {$ref: '#/components/schemas/EmployeeType'}
        limit_per_cutoff: {type: string, description: 'Decimal with two places, e.g. 1500.00.'}
        updated_at: {type: string, format: date-time}
    DishCategory:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        sort_order: {type: integer}
        active: {type: boolean}
    Dish:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        dish_category_id: {type: string, format: uuid}
        sort_order: {type: integer}
        active: {type: boolean}
        stock_mode: {type: string, enum: [NONE, DAILY], description: 'ADR-017 slice B. DAILY: the dish''s portions are counted per stock date (entered each morning). Switching it off is refused while today''s remaining is not zero or an active ala carte item draws from it (STOCK_MODE_CHANGE_BLOCKED, 409).'}
        ala_carte_products:
          type: array
          description: 'Only on dishList: the products linked to the dish.'
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              sku: {type: string}
              selling_price: {$ref: '#/components/schemas/Money'}
              active: {type: boolean}
              stock_portion: {$ref: '#/components/schemas/Quantity'}
              menu_group_id: {type: [string, 'null'], format: uuid}
    MealOption:
      type: object
      description: 'A dish option carries the dish (dish_id, dish_name, dish_category_id); an add-on option carries a label. Live configuration, never read back by a sale (MENU-001).'
      properties:
        id: {type: string, format: uuid}
        meal_option_group_id: {type: string, format: uuid}
        dish_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        dish_name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        dish_category_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        label:
          anyOf:
          - {type: string}
          - {type: 'null'}
        sort_order: {type: integer}
        active: {type: boolean}
    MealOptionGroup:
      type: object
      properties:
        id: {type: string, format: uuid}
        meal_id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [CHOICE, ADDON]}
        min_select: {type: integer}
        max_select: {type: integer}
        prices_the_meal: {type: boolean}
        popup_after_choice: {type: boolean}
        step_order: {type: integer}
        active: {type: boolean}
        options:
          type: array
          items: {$ref: '#/components/schemas/MealOption'}
    Meal:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        menu_group_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        backing_product_id: {type: string, format: uuid}
        sort_order: {type: integer}
        active: {type: boolean}
        option_groups:
          type: array
          items: {$ref: '#/components/schemas/MealOptionGroup'}
        pricing:
          type: object
          description: 'What still has no price in force now: dish categories offered by an active dish option, and active add-ons.'
          properties:
            unpriced_dish_category_ids:
              type: array
              items: {type: string, format: uuid}
            unpriced_option_ids:
              type: array
              items: {type: string, format: uuid}
    MenuPrice:
      type: object
      description: 'One row of the append-only price history. Exactly one of dish_category_id and meal_option_id is set.'
      properties:
        id: {type: string, format: uuid}
        meal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        dish_category_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        dish_category_name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        meal_option_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        meal_option_label:
          anyOf:
          - {type: string}
          - {type: 'null'}
        amount: {$ref: '#/components/schemas/Money'}
        effective_from: {type: string, format: date-time}
        changed_by: {type: string, format: uuid}
        changed_by_name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        reason:
          anyOf:
          - {type: string}
          - {type: 'null'}
        created_at: {type: string, format: date-time}
    MenuPriceSummary:
      type: object
      properties:
        amount: {$ref: '#/components/schemas/Money'}
        effective_from: {type: string, format: date-time}
    MenuPriceGrid:
      type: object
      properties:
        meal_id: {type: string, format: uuid}
        rows:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [DISH_CATEGORY, ADDON]}
              dish_category_id:
                anyOf:
                - {type: string, format: uuid}
                - {type: 'null'}
              meal_option_id:
                anyOf:
                - {type: string, format: uuid}
                - {type: 'null'}
              label: {type: string}
              active: {type: boolean}
              dishes:
                type: array
                items: {type: string}
              current:
                anyOf:
                - {$ref: '#/components/schemas/MenuPriceSummary'}
                - {type: 'null'}
              upcoming:
                anyOf:
                - {$ref: '#/components/schemas/MenuPriceSummary'}
                - {type: 'null'}
    Brand:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    ProductBarcode:
      description: 'Stage 26, extended in stage 29. A packaging of a product: an alternate barcode and/or a named pack that holds units_per_base single units. The product''s own barcode and unit of measure are the base unit and are not a row.'
      type: object
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        barcode:
          anyOf:
          - {type: string}
          - {type: 'null'}
        name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        units_per_base: {$ref: '#/components/schemas/Quantity'}
        can_receive: {type: boolean}
        created_at: {type: string, format: date-time}
    Product:
      type: object
      properties:
        id: {type: string, format: uuid}
        sku: {type: string}
        barcode:
          anyOf:
          - {type: string}
          - {type: 'null'}
        name: {type: string}
        description:
          anyOf:
          - {type: string}
          - {type: 'null'}
        category_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        brand_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        menu_group_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        unit_of_measure: {type: string}
        cost: {$ref: '#/components/schemas/Money'}
        selling_price: {$ref: '#/components/schemas/Money'}
        tax_class: {$ref: '#/components/schemas/TaxClassification'}
        track_inventory: {type: boolean}
        reorder_level:
          anyOf:
          - {type: integer, minimum: 0, description: 'This product''s own low-stock threshold (0 = warn only when sold out).'}
          - {type: 'null', description: 'Use the store''s low_stock_default_threshold (ADR-017 section 2).'}
        stock_mode: {type: string, enum: [NONE, RUNNING, DAILY], description: 'ADR-017 slice B. Kept equal to track_inventory (tracked exactly when not NONE). RUNNING carries over; DAILY is cooked per stock date (entered in Today''s stock). Changing it is refused while the product holds stock (STOCK_MODE_CHANGE_BLOCKED, 409).'}
        dish_id: {type: [string, 'null'], format: uuid, description: 'An ala carte product that draws from this DAILY dish''s pool (its own balance is never written).'}
        stock_portion: {$ref: '#/components/schemas/Quantity'}
        active: {type: boolean}
        note: {type: string, readOnly: true, description: 'selling_price/tax_class here are current catalog values for cashier preview only — never authoritative for a historical sale_item, which carries its own immutable snapshot.'}
    ProductInput:
      type: object
      required: [sku, name, unit_of_measure, selling_price, tax_class]
      properties:
        sku: {type: string}
        barcode:
          anyOf:
          - {type: string}
          - {type: 'null'}
        name: {type: string}
        description:
          anyOf:
          - {type: string}
          - {type: 'null'}
        category_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        brand_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        menu_group_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        unit_of_measure: {type: string}
        cost: {$ref: '#/components/schemas/Money'}
        selling_price: {$ref: '#/components/schemas/Money'}
        tax_class: {$ref: '#/components/schemas/TaxClassification'}
        track_inventory: {type: boolean, default: true}
        reorder_level:
          anyOf:
          - {type: integer, minimum: 0}
          - {type: 'null'}
          description: 'null or absent on create = use the store''s low-stock default; a number, even 0, is this product''s own threshold. On update, absent leaves it alone and null clears it back to the default. ADR-017 section 2.'
        stock_mode: {type: string, enum: [NONE, RUNNING, DAILY], description: 'ADR-017 slice B. Kept equal to track_inventory (tracked exactly when not NONE). RUNNING carries over; DAILY is cooked per stock date (entered in Today''s stock). Changing it is refused while the product holds stock (STOCK_MODE_CHANGE_BLOCKED, 409).'}
        dish_id: {type: [string, 'null'], format: uuid, description: 'An ala carte product that draws from this DAILY dish''s pool (its own balance is never written).'}
        stock_portion: {$ref: '#/components/schemas/Quantity'}
    ImportResult:
      type: object
      properties:
        created: {type: integer}
        updated: {type: integer}
        failed: {type: integer}
        errors:
          type: array
          items:
            type: object
            properties:
              row: {type: integer}
              message: {type: string}
    StockBalance:
      type: object
      properties:
        product_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        quantity_on_hand: {$ref: '#/components/schemas/Quantity'}
        low_stock_threshold: {type: [integer, 'null'], description: 'The effective low-stock threshold: the product''s reorder_level, else the store default (ADR-017 section 2). Present on the stock and low-stock lists.'}
        updated_at: {type: string, format: date-time}
    StockRulesInput:
      type: object
      required: [block_sale_without_stock, stock_override_enabled, low_stock_default_threshold]
      properties:
        block_sale_without_stock: {type: boolean, description: 'The master switch. false (the default): a sale never refuses and stock may go below zero. true: a sale that demands more of a tracked product than is on hand is refused (INSUFFICIENT_STOCK).'}
        stock_override_enabled: {type: boolean, description: 'Only matters while blocking is on: whether a manager may approve one blocked sale. Default true.'}
        low_stock_default_threshold: {type: integer, minimum: 0, maximum: 1000, description: 'The "N left" warning for every product whose reorder_level is null. Default 3.'}
        stock_day_cutover_hour: {type: integer, minimum: 0, maximum: 6, description: 'ADR-017 slice B. The hour the stock day starts (store-local). 0 = the calendar day; 5 = the day runs 05:00 to 05:00 (the canteen). Optional on input: left out, the stored hour is kept. A sale''s stock date is the date of the sale minus this many hours.'}
    StockRules:
      allOf:
      - {$ref: '#/components/schemas/StockRulesInput'}
      - type: object
        properties:
          preflight:
            type: object
            properties:
              unsellable_count: {type: integer, description: 'Tracked, active products with zero, negative or no stock at the default location.'}
              tracked_count: {type: integer}
              sample:
                type: array
                description: 'The first 25 by name.'
                items:
                  type: object
                  properties:
                    product_id: {type: string, format: uuid}
                    name: {type: string}
                    sku: {type: string}
    StockAvailability:
      type: object
      properties:
        blocking: {type: boolean}
        override_available: {type: boolean, description: 'blocking AND stock_override_enabled.'}
        low_stock_default_threshold: {type: integer}
        stock_date: {type: string, format: date, description: 'ADR-017 slice B. The store''s current stock date.'}
        daily_configured: {type: boolean, description: 'Some active dish or product counts daily stock.'}
        daily_entered: {type: boolean, description: 'Some daily row exists for stock_date (false + blocking: the till says "No stock entered for today yet").'}
        items:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string, format: uuid}
              mode: {type: string, enum: [RUNNING, DAILY]}
              dish_id: {type: [string, 'null'], format: uuid, description: 'An ala carte product draws from this dish''s pool.'}
              stock_portion: {anyOf: [{$ref: '#/components/schemas/Quantity'}, {type: 'null'}], description: 'Portions of the dish one unit draws.'}
              remaining: {$ref: '#/components/schemas/Quantity'}
              threshold: {type: integer}
              low: {type: boolean, description: 'RUNNING items only; a daily item is never "low", it sells out.'}
              sold_out: {type: boolean}
        dishes:
          type: array
          description: 'Every active DAILY dish with the portions left for stock_date.'
          items:
            type: object
            properties:
              dish_id: {type: string, format: uuid}
              name: {type: string}
              remaining: {$ref: '#/components/schemas/Quantity'}
              sold_out: {type: boolean}
    StockShortfall:
      type: object
      description: 'One short line of an INSUFFICIENT_STOCK refusal. kind PRODUCT (mode RUNNING, or DAILY for a plain daily product) or DISH (mode DAILY: the dish''s pool, in portions, with its dish_id and the stock_date). The demand of a meal''s chosen dishes, a Combo side and an ala carte portion of one dish is added up per pool before the check.'
      properties:
        kind: {type: string, enum: [PRODUCT, DISH]}
        product_id: {type: string, format: uuid, description: 'For a DISH, the id of its hidden pool product.'}
        dish_id: {type: [string, 'null'], format: uuid}
        name: {type: string}
        mode: {type: string, enum: [RUNNING, DAILY]}
        stock_date: {type: [string, 'null'], format: date}
        required: {$ref: '#/components/schemas/Quantity'}
        available: {$ref: '#/components/schemas/Quantity'}
    StockOverrideGrantRequest:
      type: object
      required: [approver_id, code, items]
      properties:
        approver_id: {type: string, format: uuid, description: 'The approver the cashier picked by name (from stockOverrideApproverList).'}
        code: {type: string, pattern: '^\d{6,8}$', writeOnly: true, description: 'The approver''s own code, typed by them. Never stored, logged or audited.'}
        items:
          type: array
          minItems: 1
          description: 'The cart as saleFinalize would carry it: product_id + quantity, or a meal selection (its chosen daily dishes and any ala carte product draw portions from the dishes'' pools).'
          items:
            type: object
            required: [quantity]
            properties:
              product_id: {type: [string, 'null'], format: uuid}
              meal: {type: [object, 'null']}
              quantity: {$ref: '#/components/schemas/Quantity'}
    StockOverrideGrantResult:
      type: object
      properties:
        grant_id: {type: string, format: uuid}
        token: {type: string, pattern: '^[0-9a-f]{64}$', description: 'Shown once. Send as saleFinalize.stock_override_token. Only its SHA-256 is stored.'}
        expires_at: {type: string, format: date-time}
        approver:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        shortfalls:
          type: array
          items: {$ref: '#/components/schemas/StockShortfall'}
    DailyStockGrid:
      type: object
      properties:
        stock_date: {type: string, format: date}
        location_id: {type: string, format: uuid}
        can_enter_directly: {type: boolean}
        rows:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [DISH, PRODUCT]}
              id: {type: string, format: uuid, description: 'The dish id, or the product id for a plain daily product.'}
              name: {type: string}
              group: {type: [string, 'null'], description: 'The dish category; null for a product.'}
              sku: {type: [string, 'null']}
              pool_product_id: {type: string, format: uuid}
              cooked: {$ref: '#/components/schemas/Quantity'}
              sold: {$ref: '#/components/schemas/Quantity'}
              remaining: {$ref: '#/components/schemas/Quantity'}
              yesterday_cooked: {$ref: '#/components/schemas/Quantity'}
    DailyStockApprovalRequest:
      type: object
      required: [approver_id, code]
      properties:
        approver_id: {type: string, format: uuid, description: 'The manager the cashier picked by name (from dailyStockApproverList).'}
        code: {type: string, pattern: '^\d{6,8}$', writeOnly: true, description: 'The manager''s own code, typed by them. Never stored, logged or audited.'}
    DailyStockApprovalResult:
      type: object
      properties:
        grant_id: {type: string, format: uuid}
        token: {type: string, pattern: '^[0-9a-f]{64}$', description: 'Shown once. Send as dailyStockEntryCreate.stock_entry_token. Only its SHA-256 is stored.'}
        stock_date: {type: string, format: date}
        expires_at: {type: string, format: date-time}
        approver:
          type: object
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
    DailyStockEntryRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 300
          description: 'Each line names a dish (dish_id) or a plain daily product (product_id), once, and gives EXACTLY ONE of `cooked` (the total cooked today) or `add` (portions to add, above zero).'
          items:
            type: object
            properties:
              dish_id: {type: [string, 'null'], format: uuid}
              product_id: {type: [string, 'null'], format: uuid}
              cooked: {anyOf: [{$ref: '#/components/schemas/Quantity'}, {type: 'null'}]}
              add: {anyOf: [{$ref: '#/components/schemas/Quantity'}, {type: 'null'}]}
        reason: {type: [string, 'null'], maxLength: 255, description: 'Required when any line lowers a total.'}
        stock_entry_token: {type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'A cashier''s single-use manager approval. Ignored for a user holding STOCK_ADJUST.'}
    DailyStockEntryResult:
      type: object
      properties:
        stock_date: {type: string, format: date}
        entered_by: {type: string, format: uuid}
        approved_by: {type: [string, 'null'], format: uuid}
        approval_grant_id: {type: [string, 'null'], format: uuid}
        lines:
          type: array
          items:
            type: object
            properties:
              kind: {type: string, enum: [DISH, PRODUCT]}
              id: {type: string, format: uuid}
              name: {type: string}
              cooked_before: {$ref: '#/components/schemas/Quantity'}
              cooked_after: {$ref: '#/components/schemas/Quantity'}
              delta: {type: string, description: 'Signed quantity written (negative = DAILY_PORTIONS_REMOVED, 0 = no movement).'}
              remaining_after: {$ref: '#/components/schemas/Quantity'}
        grid: {$ref: '#/components/schemas/DailyStockGrid'}
    DishAlaCarteRequest:
      type: object
      required: [items]
      properties:
        menu_group_id: {type: [string, 'null'], format: uuid}
        stock_portion: {$ref: '#/components/schemas/Quantity'}
        category_prices:
          type: object
          description: 'Dish category id -> price (Money, two decimals). Used for a dish with no price of its own.'
          additionalProperties: {$ref: '#/components/schemas/Money'}
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dish_id]
            properties:
              dish_id: {type: string, format: uuid}
              price: {anyOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
              name: {type: [string, 'null']}
    DishAlaCarteResult:
      type: object
      properties:
        created:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string, format: uuid}
              sku: {type: string}
              name: {type: string}
              dish_id: {type: string, format: uuid}
              selling_price: {$ref: '#/components/schemas/Money'}
              stock_portion: {$ref: '#/components/schemas/Quantity'}
        skipped:
          type: array
          items:
            type: object
            properties:
              dish_id: {type: string, format: uuid}
              dish_name: {type: string}
              reason: {type: string, enum: [ALREADY_EXISTS, DISH_NOT_DAILY]}
              product_id: {type: string, format: uuid}
    StockCountStatus:
      type: string
      enum: [OPEN, POSTED, CANCELLED]
      description: Stage 25. OPEN counts can be edited, posted or cancelled; POSTED and CANCELLED are final.
    StockCount:
      description: 'Stage 25. The list omits lines and summary and carries lines_count; the detail (stockCountGet, and what the write operations return) carries both.'
      type: object
      properties:
        id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        location_name: {type: string}
        status: {$ref: '#/components/schemas/StockCountStatus'}
        note:
          anyOf:
          - {type: string}
          - {type: 'null'}
        created_by: {type: string, format: uuid}
        posted_by:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        posted_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
        cancelled_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        lines_count: {type: integer}
        summary:
          type: object
          description: What posting does (or did). units_over is stock found beyond the books, units_short is stock the books had that was not found.
          properties:
            lines_counted: {type: integer}
            lines_with_variance: {type: integer}
            units_over: {$ref: '#/components/schemas/Quantity'}
            units_short: {$ref: '#/components/schemas/Quantity'}
        lines:
          type: array
          items: {$ref: '#/components/schemas/StockCountLine'}
    StockCountLine:
      type: object
      properties:
        product_id: {type: string, format: uuid}
        sku: {type: string}
        product_name: {type: string}
        counted_quantity: {$ref: '#/components/schemas/Quantity'}
        expected_quantity:
          description: What the ledger said was on hand when this line was recorded; may be negative.
          type: string
        variance:
          description: counted_quantity minus expected_quantity, signed. Negative means stock the books had was not found.
          type: string
        counted_by: {type: string, format: uuid}
        counted_at: {type: string, format: date-time}
        stock_movement_id:
          description: The adjustment this line produced once the count was posted; null before posting and for a line with no variance.
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
    StockTransfer:
      description: 'Stage 25. The list omits lines and carries lines_count; the detail carries the lines.'
      type: object
      properties:
        id: {type: string, format: uuid}
        from_location_id: {type: string, format: uuid}
        from_location_name: {type: string}
        to_location_id: {type: string, format: uuid}
        to_location_name: {type: string}
        note:
          anyOf:
          - {type: string}
          - {type: 'null'}
        terminal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        lines_count: {type: integer}
        lines:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string, format: uuid}
              sku: {type: string}
              product_name: {type: string}
              quantity: {$ref: '#/components/schemas/Quantity'}
    StockMovement:
      type: object
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        location_id: {type: string, format: uuid}
        terminal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        movement_type: {$ref: '#/components/schemas/StockMovementType'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        reference_type:
          anyOf:
          - {type: string}
          - {type: 'null'}
        reference_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        reason:
          anyOf:
          - {type: string}
          - {type: 'null'}
        unit_cost: {$ref: '#/components/schemas/Money'}
        created_by: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
    TaxSummary:
      type: object
      description: 'Preserved as separate values per current BIR invoicing guidance for mixed-category sales. `non_vat_sales` (added 2026-09-17, see domain-model.md 4a) carries the finalized consideration of a sale governed by a NON_VAT store registration; for a VAT-registered sale it is always "0.00", and for a NON_VAT-registered sale the other four fields are always "0.00" while non_vat_sales equals the sale grand total -- the two groups are never both nonzero on the same TaxSummary.'
      properties:
        taxable_sales: {$ref: '#/components/schemas/Money'}
        vat_exempt_sales: {$ref: '#/components/schemas/Money'}
        zero_rated_sales: {$ref: '#/components/schemas/Money'}
        vat_amount: {$ref: '#/components/schemas/Money'}
        non_vat_sales: {$ref: '#/components/schemas/Money'}
    TillMenu:
      type: object
      required: [as_of, dish_categories, meals]
      properties:
        as_of: {type: string, format: date-time, description: The instant the prices are in force for}
        dish_categories:
          type: array
          description: The dish categories of the dishes on offer, in till order
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              code: {type: string}
              name: {type: string}
              sort_order: {type: integer}
        meals:
          type: array
          items: {$ref: '#/components/schemas/TillMeal'}
    TillMeal:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        menu_group_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        menu_group_path:
          anyOf:
          - {type: string, example: Lunch > Standard Meal}
          - {type: 'null'}
        sort_order: {type: integer}
        prices:
          type: array
          description: The meal's current price for each dish category on offer in its pricing group
          items:
            type: object
            properties:
              dish_category_id: {type: string, format: uuid}
              amount: {$ref: '#/components/schemas/Money'}
        option_groups:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              kind: {type: string, enum: [CHOICE, ADDON]}
              min_select: {type: integer}
              max_select: {type: integer}
              prices_the_meal: {type: boolean}
              popup_after_choice: {type: boolean, description: 'The till opens this (add-on) group as a pop-up once the choices are complete, e.g. the rice'}
              step_order: {type: integer}
              options:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string, format: uuid}
                    label: {type: string, description: The dish name (CHOICE) or the add-on label (ADDON)}
                    sort_order: {type: integer}
                    dish:
                      anyOf:
                      - type: object
                        properties:
                          id: {type: string, format: uuid}
                          name: {type: string}
                          dish_category_id: {type: string, format: uuid}
                      - {type: 'null'}
                    price:
                      anyOf:
                      - {$ref: '#/components/schemas/Money'}
                      - {type: 'null'}
                      description: 'The meal price when this dish is picked (pricing group), the add-on price (ADDON), otherwise null'
    MealSelectionInput:
      type: object
      required: [meal_id]
      description: 'A meal line as the till sends it (ADR-016 section 3). Ids only: the server prices the meal from the menu at the sale instant (MENU-002), so there is no price field and none is read. `choices` are the picked options of CHOICE groups, each under the group it belongs to; `addons` are the picked options of ADDON groups. Each group''s pick count must lie within min_select..max_select (MENU-003), an option may be picked once, and the item''s quantity is exactly 1 (a plate each: send N plates as N items).'
      properties:
        meal_id: {type: string, format: uuid}
        choices:
          type: array
          items:
            type: object
            required: [group_id, option_id]
            properties:
              group_id: {type: string, format: uuid}
              option_id: {type: string, format: uuid}
        addons:
          type: array
          items: {type: string, format: uuid}
    SaleItemInput:
      type: object
      required: [quantity]
      description: 'Exactly one of product_id (an ordinary product, priced by the catalog) or meal (a meal selection, priced by the menu) -- both or neither is 422 VALIDATION_FAILED. A product_id that names a meal''s hidden backing product is refused as PRODUCT_INACTIVE: those products are sold only through `meal`. A meal item becomes the meal line plus one line per chosen add-on (linked by parent_line_number); a meal quantity other than 1 is 422 MEAL_SELECTION_INVALID.'
      properties:
        product_id: {type: string, format: uuid}
        meal: {$ref: '#/components/schemas/MealSelectionInput'}
        quantity: {$ref: '#/components/schemas/Quantity'}
        line_discount_amount: {$ref: '#/components/schemas/Money'}
        order_discount_eligible: {type: boolean, default: true}
        override_reason: {type: string, description: Required when a PRICE_OVERRIDE/DISCOUNT_OVERRIDE capability check applies}
    PaymentInput:
      type: object
      required: [method, amount]
      properties:
        method: {$ref: '#/components/schemas/PaymentMethod'}
        amount: {$ref: '#/components/schemas/Money'}
        external_reference:
          anyOf:
          - {type: string}
          - {type: 'null'}
    SaleFinalizeRequest:
      type: object
      required: [items, payments]
      properties:
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SaleItemInput'}
        order_level_discount_amount: {$ref: '#/components/schemas/Money'}
        payments:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PaymentInput'}
        employee_id:
          anyOf:
          - {type: string, format: uuid, description: 'ADR-016 slice 3.2. The employee a CREDIT sale is charged to (the id from employeeLookup). Required with a CREDIT payment, refused without one.'}
          - {type: 'null'}
        credit_override_token:
          anyOf:
          - {type: string, pattern: '^[0-9a-f]{64}$', description: 'ADR-016 section 6, slice 3.3. The single-use manager approval from creditOverrideGrant. Used (consumed, under the employee lock, in the sale''s transaction) ONLY if this credit sale would exceed the limit; a sale within the limit leaves it unused. Refused on a sale that is not paid with credit (CREDIT_EMPLOYEE_REQUIRED). Part of the idempotency hash. Refusals: CREDIT_OVERRIDE_INVALID (422), CREDIT_OVERRIDE_EXPIRED (409), CREDIT_OVERRIDE_NOT_ALLOWED (403).'}
          - {type: 'null'}
        stock_override_token:
          anyOf:
          - {type: string, pattern: '^[0-9a-f]{64}$', description: 'ADR-017 section 9. The single-use manager approval from stockOverrideGrant. Used (consumed, under the stock row locks, in the sale''s transaction) ONLY if the store blocks sales without stock AND this sale really is short; a sale that is not short leaves it unused, and with blocking off it is ignored. Part of the idempotency hash. Refusals: STOCK_OVERRIDE_INVALID (422), STOCK_OVERRIDE_EXPIRED (409), STOCK_OVERRIDE_NOT_ALLOWED (403). Without a token a short sale is INSUFFICIENT_STOCK (409).'}
          - {type: 'null'}
        buyer_name:
          anyOf:
          - {type: string}
          - {type: 'null'}
        buyer_address:
          anyOf:
          - {type: string}
          - {type: 'null'}
        buyer_tin:
          anyOf:
          - {type: string}
          - {type: 'null'}
        buyer_business_style:
          anyOf:
          - {type: string}
          - {type: 'null'}
        client_expected_grand_total:
          allOf:
          - {$ref: '#/components/schemas/Money'}
          description: 'NON-AUTHORITATIVE. Optional client-computed preview total, compared server-side only to surface a UI mismatch warning; the server''s own recomputation always governs the finalized Sale (Stage 2 invariant #4; architecture.md §46).

            '
    SaleItem:
      type: object
      description: Immutable per-line financial snapshot (Stage 2 domain-model.md §2.7).
      properties:
        id: {type: string, format: uuid}
        line_number: {type: integer}
        product_id: {type: string, format: uuid}
        product_name_snapshot: {type: string}
        sku_snapshot: {type: string}
        barcode_snapshot:
          anyOf:
          - {type: string}
          - {type: 'null'}
        unit_of_measure_snapshot: {type: string}
        quantity: {$ref: '#/components/schemas/Quantity'}
        unit_price_snapshot: {$ref: '#/components/schemas/Money'}
        gross_line_amount: {$ref: '#/components/schemas/Money'}
        line_discount_amount: {$ref: '#/components/schemas/Money'}
        order_discount_eligible: {type: boolean}
        allocated_order_discount_amount: {$ref: '#/components/schemas/Money'}
        net_line_amount: {$ref: '#/components/schemas/Money'}
        tax_classification_snapshot: {$ref: '#/components/schemas/TaxClassification'}
        tax_rate_snapshot: {type: string}
        taxable_base: {$ref: '#/components/schemas/Money'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        menu_group_path_snapshot:
          type: string
          description: 'Present only on a line that was sold from a menu group (a meal, its add-ons, or a product placed in a group): "Lunch > Standard Meal". A snapshot (MENU-001).'
        meal_id: {type: string, format: uuid, description: Present only on a meal line and its add-on lines}
        meal_name_snapshot: {type: string, description: Present with meal_id}
        parent_line_number:
          anyOf:
          - {type: integer}
          - {type: 'null'}
          description: 'Present with meal_id. On an add-on line, the line_number of the meal line it was ordered with; null on the meal line. An add-on line can be refunded on its own.'
        selections:
          type: array
          description: 'Present with meal_id. What was chosen, copied when it was sold (MENU-001): a meal line has one entry per chosen dish, an add-on line one entry for its option. Renaming, hiding or repricing the menu later never changes them.'
          items:
            type: object
            properties:
              group_name_snapshot: {type: string}
              option_label_snapshot: {type: string}
              dish_id:
                anyOf:
                - {type: string, format: uuid}
                - {type: 'null'}
              dish_name_snapshot:
                anyOf:
                - {type: string}
                - {type: 'null'}
              dish_category_snapshot:
                anyOf:
                - {type: string}
                - {type: 'null'}
              price_snapshot:
                anyOf:
                - {$ref: '#/components/schemas/Money'}
                - {type: 'null'}
              sort_order: {type: integer}
    Payment:
      type: object
      properties:
        id: {type: string, format: uuid}
        method: {$ref: '#/components/schemas/PaymentMethod'}
        amount: {$ref: '#/components/schemas/Money'}
        reference_note:
          anyOf:
          - {type: string}
          - {type: 'null'}
        recorded_at: {type: string, format: date-time}
    SaleSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        uuid: {type: string, format: uuid}
        transaction_number: {type: string, description: 'TindaFlow''s internal human-readable identifier — a distinct namespace from invoice_number, never interchangeable (RMO 24-2023 series-separation requirement).'}
        invoice_number:
          anyOf:
          - {type: string, description: 'The accountable fiscal serial itself — digits only, minimum six, leading zeroes preserved (RMO 24-2023). Deliberately excludes any invoice_series.prefix/series_code (Stage 2 domain-model.md §2.6 already keeps those as separate invoice_series fields); a future need to display a series prefix alongside this serial must add an explicit separate field, never concatenate it into this one. See InvoiceSummary.invoice_number for the full rationale.', pattern: '^[0-9]{6,}$', example: '000103'}
          - {type: 'null'}
        document_mode: {$ref: '#/components/schemas/SaleDocumentMode'}
        document_reference:
          anyOf:
          - {type: string, description: 'ADR-016. The one number to show for this sale, whichever document it got: its invoice number (INVOICE mode) or its slip number, "<terminal code>-<6 digits>" (SLIP mode). Screens show this instead of assuming an invoice.'}
          - {type: 'null'}
        store_id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        fiscal_day_id: {type: string, format: uuid}
        shift_id: {type: string, format: uuid}
        cashier_id: {type: string, format: uuid}
        sold_at: {type: string, format: date-time}
        grand_total: {$ref: '#/components/schemas/Money'}
        status: {$ref: '#/components/schemas/SaleStatus'}
        employee:
          type: object
          description: 'ADR-016 slice 3.2. Present ONLY on a sale charged to an employee (payment CREDIT); absent on every other sale.'
          properties:
            id: {type: string, format: uuid}
            employee_code: {type: string}
            name: {type: string}
    SaleDocumentMode:
      type: string
      enum: [INVOICE, SLIP]
      description: 'ADR-016. INVOICE: the numbered invoice path (default, unchanged). SLIP: internal sales monitoring -- a small per-terminal-numbered slip, no invoice, no invoice series, no electronic journal entry, no tax breakdown.'
    SaleDetail:
      allOf:
      - {$ref: '#/components/schemas/SaleSummary'}
      - type: object
        properties:
          subtotal: {$ref: '#/components/schemas/Money'}
          order_level_discount_amount: {$ref: '#/components/schemas/Money'}
          discount_total: {$ref: '#/components/schemas/Money'}
          tax_summary: {$ref: '#/components/schemas/TaxSummary'}
          idempotency_key:
            anyOf:
            - {type: string, format: uuid}
            - {type: 'null'}
          buyer_name:
            anyOf:
            - {type: string}
            - {type: 'null'}
          buyer_address:
            anyOf:
            - {type: string}
            - {type: 'null'}
          buyer_tin:
            anyOf:
            - {type: string}
            - {type: 'null'}
          buyer_business_style:
            anyOf:
            - {type: string}
            - {type: 'null'}
          items:
            type: array
            items: {$ref: '#/components/schemas/SaleItem'}
          payments:
            type: array
            items: {$ref: '#/components/schemas/Payment'}
          amount_tendered: {$ref: '#/components/schemas/Money'}
          change: {$ref: '#/components/schemas/Money'}
          invoice: {$ref: '#/components/schemas/InvoiceSummary'}
          slip:
            anyOf:
            - {$ref: '#/components/schemas/SaleSlipSummary'}
            - {type: 'null'}
          void:
            anyOf:
            - allOf:
              - {$ref: '#/components/schemas/VoidSummary'}
            - {type: 'null'}
          refunds:
            type: array
            items: {$ref: '#/components/schemas/RefundSummary'}
    InvoiceSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        invoice_number: {type: string, description: 'The accountable fiscal serial (invoice_series.current_number), always a STRING — never modeled as integer/number, because RMO 24-2023 requires a minimum six-digit running serial with leading zeroes preserved (e.g. "000001", "000103"). A JSON number would silently drop leading zeroes; a string never does. Digits only — no series prefix/code is embedded here, deliberately: Stage 2 domain-model.md §2.6 already models invoice_series.prefix/series_code as fields distinct from current_number, so this field represents the serial alone. If a future release needs to display a prefixed/composed invoice number, that must be an explicit additional field (e.g. display_invoice_number), never a looser pattern on this one. Never interchangeable with Sale.transaction_number, which is a separate internal identifier drawn from a distinct namespace/series (RMO 24-2023''s series-separation requirement) and may carry its own human-readable prefix.

            ', example: '000103', pattern: '^[0-9]{6,}$'}
        issued_at: {type: string, format: date-time}
        schema_version: {type: integer}
    InvoiceDetail:
      allOf:
      - {$ref: '#/components/schemas/InvoiceSummary'}
      - type: object
        properties:
          sale_id: {type: string, format: uuid}
          invoice_series_id: {type: string, format: uuid}
          terminal_id: {type: string, format: uuid}
          fiscal_installation_id:
            anyOf:
            - {type: string, format: uuid}
            - {type: 'null'}
          seller_registered_name_snapshot: {type: string}
          tax_registration_type_snapshot: {$ref: '#/components/schemas/TaxRegistrationType'}
          terminal_code_snapshot: {type: string}
          render_html: {type: string, description: 'Server-rendered, print-optimized HTML for the 80mm thermal layout, produced by the versioned renderer matching schema_version (ADR-006). Rendered exclusively from invoice_snapshot_json. Carries no reprint marker of its own — GET /invoices/{invoiceId} always renders the plain original document; see InvoiceReprintResult for the watermarked reprint rendering.'}
    InvoiceReprintResult:
      type: object
      description: 'The response shape for POST /invoices/{invoiceId}/reprints only. An Invoice is an immutable resource that may be reprinted any number of times (Stage 2 invariant #11 — the invoice_number/invoice_snapshot_json/issued_at never change), so "is this a reprint, and when" is a property of one reprint occurrence, never a property of the Invoice resource itself — it does not appear on InvoiceDetail. GET /invoices/{invoiceId} always returns the plain InvoiceDetail with no knowledge that a reprint ever happened.'
      properties:
        reprint_event_id: {type: string, format: uuid, description: 'Identifies this specific reprint occurrence — the id of the INVOICE_REPRINTED audit_event row created for this call (Stage 2 §2.11; no new Stage 2 entity was introduced for this). Distinct on every call, including idempotent retries that return the original stored result.'}
        invoice: {$ref: '#/components/schemas/InvoiceDetail'}
        is_reprint: {type: boolean, enum: [true], description: 'Always true — this schema only ever describes a reprint occurrence. render_html inside `invoice` carries a visible "REPRINT"/"COPY" watermark whenever it was produced via this endpoint (ADR-007), even though the underlying `invoice` payload is otherwise identical to the original.'}
        reprinted_at: {type: string, format: date-time, description: 'The date/time of this specific reprint event — never the original invoice.issued_at.'}
        requested_by: {type: string, format: uuid, description: 'The authenticated user who performed this reprint (resolved server-side from the session, never client-supplied).'}
    SaleSlipSummary:
      type: object
      description: 'ADR-016. The document of a sale made in SLIP mode. Append-only.'
      properties:
        id: {type: string, format: uuid}
        slip_number: {type: string, description: 'A running number per terminal, gap-free for committed slips: "<terminal code>-<6 digits>", e.g. T-01-000004. A different sequence from invoice numbers; never prefixed or formatted like one.', example: T-01-000004}
        issued_at: {type: string, format: date-time}
        schema_version: {type: integer}
    SaleSlipDetail:
      allOf:
      - {$ref: '#/components/schemas/SaleSlipSummary'}
      - type: object
        properties:
          sale_id: {type: string, format: uuid}
          terminal_id: {type: string, format: uuid}
          render_html: {type: string, description: 'Server-rendered, print-optimized HTML for a narrow 58mm thermal slip (store name, slip number, date and time, cashier, lines, total, payment type, the store''s footer line). Rendered exclusively from slip_snapshot_json. Never contains the words invoice or official receipt. Carries no reprint marker -- GET /sale-slips/{slipId} always renders the plain original.'}
    SaleSlipReprintResult:
      type: object
      description: 'The response shape for POST /sale-slips/{slipId}/reprints only (the twin of InvoiceReprintResult).'
      properties:
        reprint_event_id: {type: string, format: uuid, description: 'The id of the SLIP_REPRINTED audit_event row created for this call; identical on an idempotent retry.'}
        slip: {$ref: '#/components/schemas/SaleSlipDetail'}
        is_reprint: {type: boolean, enum: [true]}
        reprinted_at: {type: string, format: date-time}
        requested_by: {type: string, format: uuid}
    SaleDocumentSettings:
      type: object
      properties:
        sale_document_mode: {$ref: '#/components/schemas/SaleDocumentMode'}
        slip_footer:
          anyOf:
          - {type: string, maxLength: 200}
          - {type: 'null'}
        open_shifts: {type: integer, description: 'Shifts open on any terminal of the store right now.'}
        open_fiscal_days: {type: integer, description: 'Business days (fiscal days) open on any terminal of the store right now.'}
    SaleDocumentModeInput:
      type: object
      required: [sale_document_mode]
      properties:
        sale_document_mode: {$ref: '#/components/schemas/SaleDocumentMode'}
    SlipFooterInput:
      type: object
      required: [slip_footer]
      properties:
        slip_footer:
          anyOf:
          - {type: string, maxLength: 200}
          - {type: 'null'}
    VoidSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED, VOIDED]
        reason: {type: string}
        requested_by: {type: string, format: uuid}
        approved_by:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        requested_at: {type: string, format: date-time}
        resolved_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
        terminal_id:
          anyOf:
          - {type: string, format: uuid, description: 'Processing context, populated at execution — independent of the original sale''s terminal_id (Stage 2 invariant'}
          - {type: 'null'}
        fiscal_day_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        shift_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
    VoidResult:
      allOf:
      - {$ref: '#/components/schemas/VoidSummary'}
      - type: object
        properties:
          sale: {$ref: '#/components/schemas/SaleSummary'}
    RefundItemInput:
      type: object
      required: [sale_item_id, quantity, disposition]
      properties:
        sale_item_id: {type: string, format: uuid}
        quantity: {$ref: '#/components/schemas/Quantity'}
        disposition: {$ref: '#/components/schemas/RefundDisposition'}
    RefundSettlementInput:
      type: object
      required: [payment_method, amount]
      properties:
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        amount: {$ref: '#/components/schemas/Money'}
        external_reference:
          anyOf:
          - {type: string}
          - {type: 'null'}
    RefundRequest:
      type: object
      required: [items, settlements, reason]
      properties:
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RefundItemInput'}
        settlements:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/RefundSettlementInput'}
        reason: {type: string, minLength: 1}
    RefundItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        sale_item_id: {type: string, format: uuid}
        quantity_returned: {$ref: '#/components/schemas/Quantity'}
        disposition: {$ref: '#/components/schemas/RefundDisposition'}
        unit_refund_amount: {$ref: '#/components/schemas/Money'}
    RefundSettlement:
      type: object
      properties:
        id: {type: string, format: uuid}
        payment_method: {$ref: '#/components/schemas/PaymentMethod'}
        amount: {$ref: '#/components/schemas/Money'}
        processed_at: {type: string, format: date-time}
        external_reference:
          anyOf:
          - {type: string}
          - {type: 'null'}
    RefundSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        sale_id: {type: string, format: uuid}
        status:
          type: string
          enum: [REQUESTED, APPROVED, REJECTED, COMPLETED]
        reason: {type: string}
        requested_by: {type: string, format: uuid, description: 'Added Stage 4 remediation pass 4 — the authenticated user who created this refund request. Symmetric with VoidSummary.requested_by; the original draft omitted it (VoidSummary always had it), a gap only surfaced when refundApprove/refundReject needed to state explicitly who resolved a request they did not create.'}
        approved_by:
          anyOf:
          - {type: string, format: uuid, description: 'The user who resolved this refund — via approve OR reject (exactly one ever applies to a given REQUESTED refund). Null while still REQUESTED. Named approved_by for symmetry with VoidSummary even when the actual resolution was a rejection, matching VoidSummary''s own established convention.'}
          - {type: 'null'}
        refund_total: {$ref: '#/components/schemas/Money'}
        requested_at: {type: string, format: date-time, description: 'Added Stage 4 remediation pass 4, symmetric with VoidSummary.requested_at — this request''s own creation timestamp, distinct from refunded_at/resolved_at below.'}
        resolved_at:
          anyOf:
          - {type: string, format: date-time, description: 'Added Stage 4 remediation pass 4, symmetric with VoidSummary.resolved_at — set once, whenever approve OR reject resolves this refund (whichever happens). Null while still REQUESTED.'}
          - {type: 'null'}
        refunded_at:
          anyOf:
          - {type: string, format: date-time, description: 'Set only on the COMPLETED outcome (equal to resolved_at in that case) — kept as its own field, distinct from resolved_at, specifically so a REJECTED refund is never described as having a "refunded_at" moment it never had.'}
          - {type: 'null'}
        terminal_id:
          anyOf:
          - {type: string, format: uuid, description: 'Processing context — may differ from the original sale''s terminal/fiscal_day (e.g. a Friday refund against a Monday sale), per Stage 2 invariant'}
          - {type: 'null'}
        fiscal_day_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        shift_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
    RefundResult:
      allOf:
      - {$ref: '#/components/schemas/RefundSummary'}
      - type: object
        properties:
          items:
            type: array
            items: {$ref: '#/components/schemas/RefundItem'}
          settlements:
            type: array
            items: {$ref: '#/components/schemas/RefundSettlement'}
          sale: {$ref: '#/components/schemas/SaleSummary'}
          remaining_refundable:
            type: array
            description: Non-authoritative convenience projection of remaining refundable quantity/amount per sale_item, for UI display only — always re-derived server-side on the next refund attempt, never trusted from a prior response.
            items:
              type: object
              properties:
                sale_item_id: {type: string, format: uuid}
                remaining_quantity: {$ref: '#/components/schemas/Quantity'}
                remaining_amount: {$ref: '#/components/schemas/Money'}
    CashMovement:
      type: object
      properties:
        id: {type: string, format: uuid}
        shift_id: {type: string, format: uuid}
        type:
          type: string
          enum: [CASH_IN, CASH_OUT]
        amount: {$ref: '#/components/schemas/Money'}
        reason: {type: string}
        authorized_by:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        created_at: {type: string, format: date-time}
    Shift:
      type: object
      properties:
        id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        fiscal_day_id: {type: string, format: uuid}
        cashier_id: {type: string, format: uuid}
        opening_cash: {$ref: '#/components/schemas/Money'}
        opened_at: {type: string, format: date-time}
        status:
          type: string
          enum: [OPEN, CLOSED]
        expected_cash:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        declared_cash:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        variance:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        cash_sales:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        non_cash_sales:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        refunds_total:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        cash_in_total:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        cash_out_total:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
          - {type: 'null'}
        closed_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
    ShiftOpenResult:
      type: object
      properties:
        shift: {$ref: '#/components/schemas/Shift'}
        fiscal_day: {$ref: '#/components/schemas/FiscalDay'}
        fiscal_day_was_opened: {type: boolean, description: True if this request also opened a new FiscalDay (V1 auto-open-on-first-shift policy — see api-design.md).}
    ShiftCloseResult:
      type: object
      properties:
        shift: {$ref: '#/components/schemas/Shift'}
        x_reading: {$ref: '#/components/schemas/XReading'}
    XReadingTotalsSnapshot:
      type: object
      description: 'Cashier''s Accountability / End-of-Shift Report figures (RMO 24-2023). Deliberately narrower than ZReadingTotalsSnapshot — X-Reading is a drawer/shift accountability document, not a fiscal closure document; it carries no accumulated-grand-total or Z/reset-counter fields (those belong to Z-Reading only). All values are computed server-side from Sale/Payment/CashMovement records for this shift — never accepted from the browser. Reviewed 2026-09-17 alongside the Stage 6A NON_VAT gap (domain-model.md 4a): this object intentionally carries no tax-category breakdown at all (no taxable_sales/vat_exempt_sales/zero_rated_sales/vat_amount either) — it reports cash-drawer accountability only, keyed by payment method, never by tax classification or registration type. `non_vat_sales` is therefore deliberately not added here; it belongs on ZReadingTotalsSnapshot, the fiscal-closure-scoped object.

        '
      required: [opening_cash, expected_cash, cash_sales, non_cash_sales, payment_breakdown, refunds_total, cash_in_total, cash_out_total, transaction_count]
      properties:
        opening_cash: {$ref: '#/components/schemas/Money'}
        expected_cash: {$ref: '#/components/schemas/Money'}
        cash_sales: {$ref: '#/components/schemas/Money'}
        non_cash_sales: {$ref: '#/components/schemas/Money'}
        payment_breakdown:
          type: object
          description: 'Keyed by PaymentMethod, e.g. {"CASH": "260.00", "GCASH": "200.00"}.'
          additionalProperties: {$ref: '#/components/schemas/Money'}
        refunds_total: {$ref: '#/components/schemas/Money'}
        cash_in_total: {$ref: '#/components/schemas/Money'}
        cash_out_total: {$ref: '#/components/schemas/Money'}
        variance:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Money'}
            description: Only present once the shift has closed (the closing X-Reading); null for an interim, on-demand reading.
          - {type: 'null'}
        transaction_count: {type: integer}
    XReading:
      type: object
      description: 'Immutable, append-only, generated accountability snapshot (Stage 2 invariant #41). A shift may have multiple management-requested XReadings in addition to the automatic one generated at shift close (Stage 2 §2.5, invariant #43) — generating an interim XReading never closes or resets the shift. Re-viewing/reprinting a previously generated XReading is a plain GET of this same resource (see shiftXReadingList) — it never creates a new row, since an X-Reading carries no BIR-mandated reprint-audit requirement of its own (unlike Invoice reprint, ADR-006).'
      properties:
        id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        shift_id: {type: string, format: uuid}
        cashier_id: {type: string, format: uuid}
        from_at: {type: string, format: date-time}
        to_at: {type: string, format: date-time}
        generated_at: {type: string, format: date-time}
        generated_by: {type: string, format: uuid}
        is_closing_reading: {type: boolean, description: 'True for the reading automatically generated at shift close; false for an on-demand, management-requested interim reading.'}
        totals_snapshot: {$ref: '#/components/schemas/XReadingTotalsSnapshot'}
    FiscalDay:
      type: object
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        opened_at: {type: string, format: date-time}
        closed_at:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
        status:
          type: string
          enum: [OPEN, CLOSED]
    FiscalDayCloseResult:
      type: object
      properties:
        fiscal_day: {$ref: '#/components/schemas/FiscalDay'}
        z_reading: {$ref: '#/components/schemas/ZReading'}
    ZReadingTotalsSnapshot:
      type: object
      description: 'End-of-Day Report figures (RMO 24-2023) — the fiscal-closure breakdown, distinct from XReadingTotalsSnapshot''s shift- accountability focus. All values are computed server-side from Sale/Payment/Void/Refund/CashMovement records for this fiscal day — never accepted from the browser (architecture.md §8/§46).

        '
      required: [accumulated_grand_total_sales_before, accumulated_grand_total_sales_after, gross_sales, taxable_sales, vat_exempt_sales, zero_rated_sales, vat_amount, non_vat_sales, payment_breakdown, void_total, refund_total, z_counter, reset_counter]
      properties:
        accumulated_grand_total_sales_before:
          allOf:
          - {$ref: '#/components/schemas/AccumulatedMoney'}
          description: This terminal's accumulated grand total sales immediately before this Z-Reading (RMO 24-2023's non-resettable running total).
        accumulated_grand_total_sales_after:
          allOf:
          - {$ref: '#/components/schemas/AccumulatedMoney'}
          description: This terminal's accumulated grand total sales immediately after this Z-Reading (accumulated_before + this day's gross_sales).
        gross_sales:
          allOf:
          - {$ref: '#/components/schemas/Money'}
          description: This fiscal day's completed (non-voided) sales total.
        taxable_sales: {$ref: '#/components/schemas/Money'}
        vat_exempt_sales: {$ref: '#/components/schemas/Money'}
        zero_rated_sales: {$ref: '#/components/schemas/Money'}
        vat_amount: {$ref: '#/components/schemas/Money'}
        non_vat_sales:
          allOf:
          - {$ref: '#/components/schemas/Money'}
          description: 'Added 2026-09-17 (Stage 6A NON_VAT gap, see domain-model.md 4a). "0.00" for a fiscal day closed under a VAT-registered store; equals this fiscal day''s gross_sales for a fiscal day closed under a NON_VAT-registered store, since a NON_VAT sale has no taxable_sales/vat_exempt_sales/zero_rated_sales/vat_amount contribution. Uses the same Money precision as its peer tax-category fields on this object, not AccumulatedMoney -- only the running accumulated-grand-total fields use that type.'
        payment_breakdown:
          type: object
          description: 'Keyed by PaymentMethod, e.g. {"CASH": "260.00", "GCASH": "200.00"}.'
          additionalProperties: {$ref: '#/components/schemas/Money'}
        void_total:
          allOf:
          - {$ref: '#/components/schemas/Money'}
          description: Sum of grand_total for sales voided on this fiscal day, reported for audit transparency — excluded from gross_sales.
        refund_total: {$ref: '#/components/schemas/Money'}
        z_counter: {type: integer, description: 'This terminal''s running Z-Reading sequence number (RMO 24-2023 Z Counter requirement) — increments by exactly one per closure, never reused.'}
        reset_counter: {type: integer, default: 0, description: 'Number of times the accumulated grand total has been reset. TindaFlow''s architecture provides no user-facing reset function (architecture.md §4/Stage 2 invariant #4 on fiscal_day/z_reading design) — this field is expected to remain 0 for the life of a terminal and exists to satisfy RMO 24-2023''s accreditation-demonstration checklist item, not because a reset path exists in the product.

            '}
    ZReading:
      type: object
      description: 'Immutable, append-only, generated fiscal-closure snapshot. Exactly one ZReading exists per FiscalDay, created atomically with its OPEN→CLOSED transition (Stage 2 invariant #42) — there is no "regenerate Z-Reading" operation. Historical retrieval (fiscalDayZReadingGet) always returns the stored totals_snapshot exactly as generated, never recomputed under today''s configuration.

        '
      properties:
        id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        fiscal_day_id: {type: string, format: uuid}
        business_date: {type: string, format: date}
        from_at: {type: string, format: date-time}
        to_at: {type: string, format: date-time}
        generated_at: {type: string, format: date-time}
        generated_by: {type: string, format: uuid}
        totals_snapshot: {$ref: '#/components/schemas/ZReadingTotalsSnapshot'}
        document_mode: {allOf: [{$ref: '#/components/schemas/SaleDocumentMode'}], description: 'ADR-016. SLIP when the day''s sales were slips: the reading is then the store''s internal end-of-day report (business day), printed without tax lines or accumulated-sales counters. The stored totals are unchanged.'}
    ReportResult:
      type: object
      properties:
        generated_at: {type: string, format: date-time}
        filters_applied: {type: object, additionalProperties: true}
        rows:
          type: array
          items: {type: object, additionalProperties: true}
        summary: {type: object, additionalProperties: true, description: 'Report-specific aggregate totals (e.g. grand_total, vat_amount) — always Money-schema decimal strings where monetary.'}
    StoreSettings:
      type: object
      properties:
        business_name: {type: string}
        registered_name: {type: string}
        business_address: {type: string}
        tin: {type: string}
        branch_code:
          anyOf:
          - {type: string}
          - {type: 'null'}
        invoice_header:
          anyOf:
          - {type: string}
          - {type: 'null'}
        invoice_footer:
          anyOf:
          - {type: string}
          - {type: 'null'}
        telephone:
          anyOf:
          - {type: string}
          - {type: 'null'}
        email:
          anyOf:
          - {type: string}
          - {type: 'null'}
        current_tax_registration: {$ref: '#/components/schemas/TaxRegistration'}
    StoreSettingsInput:
      type: object
      properties:
        business_name: {type: string}
        registered_name: {type: string}
        business_address: {type: string}
        tin: {type: string}
        branch_code:
          anyOf:
          - {type: string}
          - {type: 'null'}
        invoice_header:
          anyOf:
          - {type: string}
          - {type: 'null'}
        invoice_footer:
          anyOf:
          - {type: string}
          - {type: 'null'}
        telephone:
          anyOf:
          - {type: string}
          - {type: 'null'}
        email:
          anyOf:
          - {type: string}
          - {type: 'null'}
    TaxRegistration:
      type: object
      properties:
        id: {type: string, format: uuid}
        registration_type: {$ref: '#/components/schemas/TaxRegistrationType'}
        effective_from: {type: string, format: date}
        effective_to:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
    Accreditation:
      type: object
      description: 'Supplier/software-level accreditation status — independently effective-dated from PermitToUse per ADR-009 (RMC 72-2025: an expiring Certificate of Accreditation does not itself expire the taxpayer''s PTU). All fields nullable/empty until a real accreditation exists — entering values here does not itself constitute BIR accreditation.

        '
      properties:
        number:
          anyOf:
          - {type: string}
          - {type: 'null'}
        date:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
        effective_from:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
        effective_to:
          anyOf:
          - {type: string, format: date, description: Null = currently in effect}
          - {type: 'null'}
    PermitToUse:
      type: object
      description: 'Taxpayer/installation-level Permit to Use status — independently effective-dated from Accreditation per ADR-009. Carries the Machine Identification Number (MIN), which is a PTU-lifecycle concept per domain-model.md §2.1, not an accreditation-lifecycle one.'
      properties:
        number:
          anyOf:
          - {type: string}
          - {type: 'null'}
        min:
          anyOf:
          - {type: string, description: Machine Identification Number}
          - {type: 'null'}
        date:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
        effective_from:
          anyOf:
          - {type: string, format: date}
          - {type: 'null'}
        effective_to:
          anyOf:
          - {type: string, format: date, description: Null = currently in effect}
          - {type: 'null'}
    FiscalInstallationInput:
      type: object
      required: [deployment_model, software_version]
      properties:
        deployment_model:
          type: string
          enum: [STANDALONE, SERVER_CONNECTED]
        machine_serial_number:
          anyOf:
          - {type: string}
          - {type: 'null'}
        software_version: {type: string}
        accreditation:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/Accreditation'}
          - {type: 'null'}
        permit_to_use:
          anyOf:
          - allOf:
            - {$ref: '#/components/schemas/PermitToUse'}
          - {type: 'null'}
    FiscalInstallation:
      description: 'Accreditation and PermitToUse are represented as distinct nested objects, never collapsed into one generic "compliance_status" field — they are independent lifecycles (ADR-009/BIR-012) even though V1''s underlying database representation (two column-pairs vs. two child tables) remains a Stage 5 decision that this HTTP shape does not need to anticipate further.

        '
      allOf:
      - {$ref: '#/components/schemas/FiscalInstallationInput'}
      - type: object
        properties:
          id: {type: string, format: uuid}
          store_id: {type: string, format: uuid}
          installed_at: {type: string, format: date-time}
          superseded_at:
            anyOf:
            - {type: string, format: date-time}
            - {type: 'null'}
          terminals:
            type: array
            items: {type: string, format: uuid}
            description: Terminals currently associated via terminal_fiscal_installation (supports both STANDALONE and SERVER_CONNECTED deployment models, ADR-009/BIR-013).
    TerminalFiscalInstallation:
      description: 'A terminal''s fiscal installation mapping over time (store-setup pass, 2026-09-18) -- at most one row per terminal has effective_to = null (the current mapping).'
      type: object
      properties:
        id: {type: string, format: uuid}
        terminal_id: {type: string, format: uuid}
        fiscal_installation_id: {type: string, format: uuid}
        effective_from: {type: string, format: date-time}
        effective_to:
          anyOf:
          - {type: string, format: date-time}
          - {type: 'null'}
    InvoiceSeriesInput:
      type: object
      required: [fiscal_installation_id, series_code, starting_number]
      properties:
        fiscal_installation_id: {type: string, format: uuid}
        series_code: {type: string, maxLength: 64}
        prefix:
          anyOf:
          - {type: string, maxLength: 8}
          - {type: 'null'}
        starting_number: {type: integer, minimum: 1}
        ending_number:
          anyOf:
          - {type: integer}
          - {type: 'null'}
    InvoiceSeries:
      description: current_number/starting_number/ending_number/status mirror invoice_series exactly (Stage 6B). Bootstraps at current_number = starting_number - 1 (invariants.md INVSERIES-001).
      type: object
      properties:
        id: {type: string, format: uuid}
        fiscal_installation_id: {type: string, format: uuid}
        series_code: {type: string}
        prefix:
          anyOf:
          - {type: string}
          - {type: 'null'}
        current_number: {type: integer}
        starting_number: {type: integer}
        ending_number:
          anyOf:
          - {type: integer}
          - {type: 'null'}
        status: {type: string, enum: [ACTIVE, CLOSED]}
    InventoryLocationInput:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 255}
        is_default: {type: boolean, description: 'A store''s first location is made the default regardless of this value.'}
    InventoryLocation:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        is_default: {type: boolean}
    StoreSetupReadiness:
      description: Non-authoritative aggregate check across the four checkout-time resolver prerequisites -- CheckoutService always re-derives its own resolution independently; this never gates or substitutes for that.
      type: object
      properties:
        ready: {type: boolean}
        checks:
          type: object
          properties:
            fiscal_installation: {type: boolean}
            invoice_series: {type: boolean}
            inventory_location: {type: boolean}
            tax_registration: {type: boolean}
        document_mode: {allOf: [{$ref: '#/components/schemas/SaleDocumentMode'}], description: 'ADR-016. In SLIP mode fiscal_installation, invoice_series and tax_registration do not apply and read true; only inventory_location is required.'}
    StoreSetupOverview:
      description: Store-wide readiness from the same checks the till runs, per terminal that can sell.
      type: object
      properties:
        ready: {type: boolean}
        checks: {$ref: '#/components/schemas/StoreSetupReadiness/properties/checks'}
        document_mode: {$ref: '#/components/schemas/SaleDocumentMode'}
        terminals:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              terminal_code: {type: string}
              ready: {type: boolean}
              checks: {$ref: '#/components/schemas/StoreSetupReadiness/properties/checks'}
    AuditEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        event_type: {type: string}
        actor_user_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        terminal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        entity_type:
          anyOf:
          - {type: string}
          - {type: 'null'}
        entity_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        before_metadata:
          anyOf:
          - {type: object, additionalProperties: true}
          - {type: 'null'}
        after_metadata:
          anyOf:
          - {type: object, additionalProperties: true}
          - {type: 'null'}
        reason:
          anyOf:
          - {type: string}
          - {type: 'null'}
        request_id:
          anyOf:
          - {type: string}
          - {type: 'null'}
        occurred_at: {type: string, format: date-time}
    ElectronicJournalEntry:
      type: object
      description: 'A projection of an authoritative domain event (ADR-005) — never an independently-editable second ledger. RMO 24-2023 requires the POS electronic journal to represent principal and supplementary documents/adjustments (invoices, voids, refunds) and X/Z-Readings; every one of those event types is retrievable here via event_type filtering, and no browser client can create, update, or delete a journal entry directly (journalEntryList/ journalEntryGet are the only two operations on this resource).'
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        terminal_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        event_type: {$ref: '#/components/schemas/ElectronicJournalEventType'}
        source_type: {type: string, description: 'The authoritative originating table (e.g. "sale", "void", "refund", "x_reading", "z_reading", "shift", "cash_movement", "stock_movement").'}
        source_id: {type: string, format: uuid}
        audit_event_id:
          anyOf:
          - {type: string, format: uuid}
          - {type: 'null'}
        payload_json: {type: object, additionalProperties: true}
        occurred_at: {type: string, format: date-time}
