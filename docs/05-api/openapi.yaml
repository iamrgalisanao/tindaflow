openapi: 3.1.0
info:
  title: TindaFlow POS API
  version: 1.0.0-draft
  description: 'TindaFlow POS HTTP API (Stage 4 contract). Implements the frozen Stage 2 domain (tag stage-2-baseline, commit 2bc8885) and Stage 3 architecture (tag stage-3-baseline, commit c8a8bbe) without redesigning either. Same-origin session-authenticated SPA API for a self-hosted, LAN-first deployment. This is a design-time contract; no implementation exists yet.'
  contact: {name: ABBADev IT Solutions}
servers:
- {url: /api/v1, description: Same-origin relative base path (store LAN server or VPS)}
tags:
- {name: Auth}
- {name: Terminal}
- {name: Catalog}
- {name: Inventory}
- {name: Sales}
- {name: Invoices}
- {name: Shifts}
- {name: FiscalDay}
- {name: Reports}
- {name: StoreSettings}
- {name: FiscalInstallation}
- {name: InvoiceSeries}
- {name: StoreSetup}
- {name: Audit}
- {name: ElectronicJournal}
- {name: Users}
security:
- cookieAuth: []
paths:
  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Authenticate a user and establish a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password, writeOnly: true}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Terminate the current session
      responses:
        '204': {description: Session terminated}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      operationId: authMe
      tags: [Auth]
      summary: Current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  # ------------------------------------------------------------ Terminal
  /terminal-enrollment-tokens:
    post:
      operationId: terminalCreateEnrollmentToken
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Generate a one-time enrollment token for a terminal (ADR-011)
      description: 'Requires TERMINAL_MANAGE. Does not itself require an enrolled terminal, since this is administered from an already-authenticated back-office session (which may or may not be running on an enrolled terminal browser).'
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_id]
              properties:
                terminal_id: {type: string, format: uuid}
      responses:
        '201':
          description: Enrollment token created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalEnrollmentToken'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /terminal/enroll:
    post:
      operationId: terminalEnroll
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Bind this browser to a Terminal using a one-time token (ADR-011)
      description: 'Requires an authenticated administrative session on this workstation. On success, the server establishes an HttpOnly terminal credential on this browser; the one-time token is invalidated immediately.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Terminal credential established for this browser
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Token already used, expired, or revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /terminal/current:
    get:
      operationId: terminalCurrent
      tags: [Terminal]
      summary: The terminal this browser is currently enrolled as
      security:
      - cookieAuth: []
        terminalCookieAuth: []
      responses:
        '200':
          description: Current terminal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: This browser is not enrolled as any terminal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /terminals:
    get:
      operationId: terminalList
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: List terminals for the store
      security:
      - cookieAuth: []
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/TerminalStatus'}
      responses:
        '200':
          description: Paginated terminal list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /terminals/{terminalId}:
    get:
      operationId: terminalGet
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Get a terminal
      parameters:
      - {$ref: '#/components/parameters/TerminalIdPath'}
      responses:
        '200':
          description: Terminal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /terminals/{terminalId}/revoke:
    post:
      operationId: terminalRevoke
      tags: [Terminal]
      x-capability: TERMINAL_MANAGE
      summary: Revoke a terminal's enrolled credential
      parameters:
      - {$ref: '#/components/parameters/TerminalIdPath'}
      responses:
        '200':
          description: Terminal revoked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TerminalSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # ------------------------------------------------------------- Catalog
  /products:
    get:
      operationId: productList
      tags: [Catalog]
      summary: List products
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: category_id
        in: query
        schema: {type: string, format: uuid}
      - name: active
        in: query
        schema: {type: boolean}
      - name: search
        in: query
        description: Matches name or SKU (not barcode — use the barcode lookup operation for that)
        schema: {type: string}
      - name: sort
        in: query
        schema:
          type: string
          enum: [name, -name, sku, -sku, created_at, -created_at]
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: productCreate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /products/{productId}:
    get:
      operationId: productGet
      tags: [Catalog]
      summary: Get a product
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: productUpdate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Update a product's catalog attributes
      description: 'Updates current catalog data only (name, price, tax class, etc.). Never affects historical sale_item snapshots, which are immutable per Stage 2. There is no DELETE for products — see productDeactivate.'
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /products/{productId}/activate:
    post:
      operationId: productActivate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Reactivate a product
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      responses:
        '200':
          description: Product activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /products/{productId}/deactivate:
    post:
      operationId: productDeactivate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Deactivate a product (retirement mechanism — never DELETE)
      description: 'Deactivated products are excluded from barcode lookup and catalog listings by default but remain fully referenceable by historical sale_item rows, satisfying Stage 2''s "reference only, never a live dependency" rule.

        '
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      responses:
        '200':
          description: Product deactivated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  # ---- Alternate barcodes (stage 26) ------------------------------------------------------------
  # Added 2026-09-20 as a forward commit: no prior draft at any stage (docs/06-backend/stage-26-alternate-barcodes.md).
  # productLookupByBarcode already matched alternates from stage 20; nothing could create them until now. A code identifies
  # at most one product per store across a product's own barcode and every alternate. A code already in use is the
  # catalog's usual 422 VALIDATION_FAILED field error on `barcode`; no new error code.
  /products/{productId}/barcodes:
    get:
      operationId: productBarcodeList
      tags: [Catalog]
      summary: List a product's alternate barcodes
      description: Session only, like the other catalog reads. The product's own barcode is Product.barcode and is not repeated here. Oldest first (codes added in the same second by code).
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated alternate barcodes
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/ProductBarcode'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: productBarcodeCreate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Add an alternate barcode to a product
      description: 'Another code the product can be scanned by, for example a different supplier''s packaging. Surrounding whitespace (a scanner''s line break) is trimmed; the code is otherwise stored exactly as given (matching is exact, so case matters). A code already in use in the store, as any product''s own barcode or alternate, is 422 VALIDATION_FAILED on `barcode`; another store''s identical code is not a conflict. Allowed for an inactive product. Audited as PRODUCT_BARCODE_ADDED.'
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [barcode]
              properties:
                barcode: {type: string, minLength: 1, maxLength: 255}
      responses:
        '201':
          description: Alternate barcode added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductBarcode'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /products/{productId}/barcodes/{barcodeId}:
    delete:
      operationId: productBarcodeDelete
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Remove an alternate barcode
      description: 'The product can no longer be scanned by that code (its own barcode and other alternates are unaffected). Idempotent: removing a barcode that is not there, or one that belongs to another product, is a 204 that changes nothing. Audited as PRODUCT_BARCODE_REMOVED when a barcode was actually removed. A real delete is fine here: an alternate barcode is a lookup key, not accounting data, and sale lines keep their own barcode snapshot.'
      parameters:
      - {$ref: '#/components/parameters/ProductIdPath'}
      - name: barcodeId
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '204': {description: 'Barcode removed, or was not there'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /products/by-barcode/{barcode}:
    get:
      operationId: productLookupByBarcode
      tags: [Catalog]
      summary: Low-latency barcode lookup for cashier scanning
      description: 'Returns current saleable-product data for cart preview only. The returned price/tax data is NOT authoritative for checkout — sale finalization always recalculates server-side from current authoritative data at the moment of finalization (Stage 2 invariant #4; architecture.md §11).'
      parameters:
      - name: barcode
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404':
          description: BARCODE_NOT_FOUND
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /categories:
    get:
      operationId: categoryList
      tags: [Catalog]
      summary: List categories
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated category list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/Category'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: categoryCreate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Category'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /brands:
    get:
      operationId: brandList
      tags: [Catalog]
      summary: List brands
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated brand list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/Brand'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: brandCreate
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Create a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        '201':
          description: Brand created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Brand'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /products/import:
    post:
      operationId: productImport
      tags: [Catalog]
      x-capability: CATALOG_MANAGE
      summary: Bulk-import products from CSV
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Import accepted; result summary returned synchronously for V1's expected catalog size
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /products/export:
    get:
      operationId: productExport
      tags: [Catalog]
      summary: Export the product catalog as CSV
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
  # ----------------------------------------------------------- Inventory
  /inventory/stock:
    get:
      operationId: inventoryStockList
      tags: [Inventory]
      summary: Stock on hand (derived StockBalance projection)
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: product_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated stock balances
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/StockBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /inventory/low-stock:
    get:
      operationId: inventoryLowStockList
      tags: [Inventory]
      summary: Products at or below their reorder level
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      responses:
        '200':
          description: Paginated low-stock list
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/StockBalance'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /inventory/movements:
    get:
      operationId: inventoryMovementList
      tags: [Inventory]
      summary: Append-only stock movement ledger
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: product_id
        in: query
        schema: {type: string, format: uuid}
      - {$ref: '#/components/parameters/FromParam'}
      - {$ref: '#/components/parameters/ToParam'}
      - name: movement_type
        in: query
        schema: {$ref: '#/components/schemas/StockMovementType'}
      responses:
        '200':
          description: Paginated stock movements
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/PaginatedResponse'}
                - type: object
                  properties:
                    data:
                      type: array
                      items: {$ref: '#/components/schemas/StockMovement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /inventory/receipts:
    post:
      operationId: inventoryReceiptCreate
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Receive stock (PURCHASE_RECEIPT / OPENING_STOCK movement)
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, movement_type]
              properties:
                product_id: {type: string, format: uuid}
                quantity: {$ref: '#/components/schemas/Quantity'}
                movement_type:
                  type: string
                  enum: [OPENING_STOCK, PURCHASE_RECEIPT]
                unit_cost: {$ref: '#/components/schemas/Money'}
                note: {type: string}
      responses:
        '201':
          description: Stock movement recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  /inventory/adjustments:
    post:
      operationId: inventoryAdjustmentCreate
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: Record a stock adjustment (reason required — Stage 2 invariant
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyHeader'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity, movement_type, reason]
              properties:
                product_id: {type: string, format: uuid}
                quantity: {$ref: '#/components/schemas/Quantity'}
                movement_type:
                  type: string
                  enum: [STOCK_ADJUSTMENT_IN, STOCK_ADJUSTMENT_OUT, DAMAGE, EXPIRED]
                reason: {type: string, minLength: 1, description: Required — STOCK_ADJUSTMENT_REASON_REQUIRED if omitted}
                note: {type: string}
      responses:
        '201':
          description: Stock movement recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
  # ---- Stock counts and transfers (stage 25) ---------------------------------------------------
  # Added 2026-09-20 as a forward commit: none of these operations had a prior draft at any stage
  # (docs/06-backend/stage-25-stock-counts-and-transfers.md). Scope note: scope.md lists stocktake and inter-store
  # transfers as Phase 2; the owner chose to build counts and transfers between one store's own locations now.
  # Every operation needs STOCK_ADJUST and is scoped to the caller's store. Posting a count and creating a transfer
  # write the ledger, so, like receipts and adjustments, they need an enrolled terminal and an Idempotency-Key.
  /inventory/counts:
    get:
      operationId: stockCountList
      tags: [Inventory]
      x-capability: STOCK_ADJUST
      summary: List stock counts, newest first
      description: Carries lines_count, not the lines; stockCountGet carries the lines. An unknown status or a malformed location_id matches nothing.
      parameters:
      - {$ref: '#/components/parameters/PageParam'}
      - {$ref: '#/components/parameters/PerPageParam'}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/StockCountStatus'}
      - name: location_id
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Paginated stock counts
          content:
            application/json:
              schema:
                allOf:
