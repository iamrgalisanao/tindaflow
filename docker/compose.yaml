# TindaFlow production stack (docs/03-architecture/deployment.md, docs/06-backend/stage-23-production-readiness.md).
#
#   cp .env.example .env   # then fill it in (docker/README.md)
#   docker compose up -d --build
#
# web (nginx, the only published ports) -> app (PHP-FPM) -> postgres (no published port, on the backend network only).
# backup keeps hourly dumps of the database; see docker/backup/backup.sh.
#
# Two database roles (docs/06-backend/stage-23-production-readiness.md, addendum 2026-09-27): the OWNER
# (DB_OWNER_USERNAME) runs the migrations and provisions the application's role in the one-shot `migrate` service;
# the long-running `app` connects as DB_USERNAME (tindaflow_app), which the database itself forbids from updating or
# deleting the append-only tables (sale items, payments, invoices, audit log, journal, stock ledger, readings). The
# running app never holds the owner's credentials.
name: tindaflow

services:
  web:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
      target: web
    image: tindaflow-web:${TINDAFLOW_TAG:-latest}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # fullchain.pem and privkey.pem (docker/README.md explains how to make them)
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Runs once per `up`, as the database OWNER: applies pending migrations, then creates/updates the application's role
  # and enforces the append-only privileges (php artisan tindaflow:harden-database). The app starts only after it
  # succeeds. It runs the app image (built by the `app` service), so it has no build of its own.
  migrate:
    image: tindaflow-app:${TINDAFLOW_TAG:-latest}
    env_file: .env
    environment:
      DB_USERNAME: ${DB_OWNER_USERNAME}
      DB_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_PASSWORD}
    command: ["runuser", "-u", "www-data", "--", "sh", "-c", "php artisan migrate --force && php artisan tindaflow:harden-database"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
      target: app
    image: tindaflow-app:${TINDAFLOW_TAG:-latest}
    env_file: .env
    environment:
      # The owner's credentials stay in .env for compose to hand to `migrate` and `postgres`, but this container
      # must not see them: blank them here so PHP-FPM's environment holds only the restricted role's.
      DB_OWNER_USERNAME: ""
      DB_OWNER_PASSWORD: ""
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [frontend, backend]
    healthcheck:
      # Reaches PostgreSQL with the app's own credentials (Laravel's /up never touches the database).
      test: ["CMD", "php", "/usr/local/bin/healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      # The owner (a superuser inside this container), NOT the application's role.
      POSTGRES_USER: ${DB_OWNER_USERNAME}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD}
      TZ: ${APP_TIMEZONE:-Asia/Manila}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # No "ports:" on purpose: the database is reachable only from the app and backup containers.

  backup:
    image: postgres:17
    env_file: .env
    environment:
      # BACKUP_DIR in .env is the HOST folder for the mount below; without this the container would write dumps to that
      # same path inside itself (its own disk), never reaching the mounted host folder.
      BACKUP_DIR: /backups
    # Through bash so it starts even if the checkout lost the scripts' executable bit (Windows, some archives).
    entrypoint: ["bash", "/usr/local/bin/backup.sh"]
    command: ["loop"]
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backup/restore.sh:/usr/local/bin/restore.sh:ro
      # The database's own volume, read-only, ONLY so backup.sh can watch how full its disk is (it never reads the files).
      - pgdata:/pgdata:ro
      # Put this on a different disk from the database (docker/README.md).
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      # After the app: its start applies the migrations, so the first dump is of a real schema, not an empty database.
      app:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      # Unhealthy when no backup has succeeded for 2.5 intervals, the off-machine copy is failing, or a disk is critically
      # full: `docker compose ps` then shows it, and `docker compose logs backup` says why ([BACKUP] / [DISK] lines).
      test: ["CMD", "bash", "/usr/local/bin/backup.sh", "health"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 120s
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  pgdata:
  app-storage:
