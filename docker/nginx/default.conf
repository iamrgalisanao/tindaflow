# TindaFlow web tier: TLS, static assets, and FastCGI to the app container. Nothing else is served.
server_tokens off;

# Plain HTTP only redirects to HTTPS; the application is never served over it.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # The product CSV import accepts up to 5 MB.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json text/csv;
    gzip_min_length 1024;

    # Vite output is content-hashed, so it can be cached forever.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # The one PHP entry point. `$https` becomes the HTTPS server variable, so the app knows the request was secure
    # (it then sends Strict-Transport-Security and marks cookies Secure).
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # No other PHP file is ever executed, and dotfiles are never served.
    location ~ \.php$ {
        return 404;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
}
