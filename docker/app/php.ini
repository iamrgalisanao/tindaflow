; Production PHP settings for the TindaFlow app image.

; Never announce the PHP version or show errors to a client; errors go to the log.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = 256M
; The product CSV import accepts up to 5 MB; leave headroom.
post_max_size = 8M
upload_max_filesize = 8M

; The image is immutable, so PHP never needs to re-check files for changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
